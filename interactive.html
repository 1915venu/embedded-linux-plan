{id:'02',sec:'linux',icon:'🐧',title:'Phase 2: Linux Fundamentals',secs:[{h:'🧠 THEORY: User Space vs Kernel Space (Why It Exists)',b:'The entire Linux architecture is built on this fundamental split:\n␀CODE␀User Space (Ring 3)  Kernel Space (Ring 0)\n┌──────────────────────────┐  ┌──────────────────────────────────┐\n│  Your application  │  │  Full hardware access  │\n│  Limited privileges  │  │  All memory accessible  │\n│  Virtual addresses only  │  ───►  │  Physical + Virtual memory  │\n│  Can crash safely  │  syscall │  Bug here = system crash  │\n│  Multiple processes  │  │  Single address space (shared)  │\n│  ~3GB address space (32) │  │  ~1GB address space (32-bit)  │\n└──────────────────────────┘  └──────────────────────────────────┘␀ENDCODE␀\nWhy the split?\n\n• **Protection**: User code can t corrupt kernel or other processes\n\n• **Stability**: App crash doesn t take down the system\n\n• **Security**: Prevents malicious code from accessing hardware directly\n\n• **Abstraction**: Same syscall interface regardless of hardware'},{h:'🧠 THEORY: System Call Mechanism — Step by Step',b:'␀CODE␀Application: write(fd, buf, count)\n  │\n  │ 1. glibc wrapper loads syscall number into register\n  │  (write = syscall #1 on x86_64)\n  │\n  │ 2. Arguments loaded into registers:\n  │  rdi = fd, rsi = buf, rdx = count\n  │\n  │ 3. SYSCALL instruction (x86_64) or int 0x80 (x86_32)\n  │  ┌─────────────────────────────────────────┐\n  │  │ CPU switches to Ring 0  │\n  │  │ Stack switches to kernel stack  │\n  │  │ Saves user registers on kernel stack  │\n  │  └─────────────────────────────────────────┘\n  │\n  │ 4. Kernel entry point (entry_SYSCALL_64 in entry/entry_64.S)\n  │\n  │ 5. Look up handler: sys_call_table[__NR_write] → ksys_write()\n  │\n  │ 6. Handler validates parameters\n  │  - Is fd valid?\n  │  - Is buf a valid user pointer?\n  │  - Does process have permission?\n  │\n  │ 7. Perform the operation\n  │\n  │ 8. Return value placed in rax\n  │  If negative = errno value\n  │\n  │ 9. SYSRET instruction\n  │  ┌─────────────────────────────────────────┐\n  │  │ CPU switches back to Ring 3  │\n  │  │ Stack switches back to user stack  │\n  │  │ Restores user registers  │\n  │  └─────────────────────────────────────────┘\n  │\n  ▼ Application continues with return value␀ENDCODE␀'},{h:'🧠 THEORY: Key System Calls for Embedded',b:'System Call\nPurpose\nKernel Function\n\n `open()` |\n Open file/device |\n `ksys_open()` → VFS → driver s `.open()` |\n\n `read()` |\n Read data |\n → VFS → driver s `.read()` |\n\n `write()` |\n Write data |\n → VFS → driver s `.write()` |\n\n `close()` |\n Close FD |\n → VFS → driver s `.release()` |\n\n `ioctl()` |\n Device control |\n → VFS → driver s `.unlocked_ioctl()` |\n\n `mmap()` |\n Map memory |\n → VFS → driver s `.mmap()` |\n\n `poll()` |\n Wait for events |\n → VFS → driver s `.poll()` |\n\n `fork()` |\n Create process |\n → `kernel_clone()` |\n\n `execve()` |\n Replace process |\n → Load new ELF binary |\n\n**Key insight**: When user calls `open("/dev/mydevice")`, it eventually calls YOUR driver s `.open()` function!'},{h:'🧠 THEORY: File Descriptors — The Universal Handle',b:'␀CODE␀Process File Descriptor Table:\n┌────┬──────────────────────────────┐\n│ FD │ Points to...  │\n├────┼──────────────────────────────┤\n│  0 │ → Open File Entry (stdin)  │ → /dev/tty\n│  1 │ → Open File Entry (stdout)  │ → /dev/tty\n│  2 │ → Open File Entry (stderr)  │ → /dev/tty\n│  3 │ → Open File Entry  │ → /dev/mydevice\n│  4 │ → Open File Entry  │ → /home/user/data.txt\n│  5 │ → (unused)  │\n└────┴──────────────────────────────┘\n\nEach Open File Entry contains:\n- Current position (offset)\n- Open flags (O_RDONLY, etc.)\n- Pointer to inode (which file)\n- Pointer to file_operations (which driver)␀ENDCODE␀'},{h:'💻 COMPLETE CODE: System Calls Deep Dive',b:'␀CODE␀// File: ~/embedded_learning/day_04/syscalls_complete.c\n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n\n#define CHECK(x, msg) do { \\\n  if ((x)  0) {\n  total_written = 0;\n  while (total_written < bytes_read) {\n  // Handle partial writes (important for devices/pipes!)\n  bytes_written = write(dst_fd, buffer + total_written,\n  bytes_read - total_written);\n  if (bytes_written < 0) {\n  if (errno == EINTR) continue;  // Interrupted by signal, retry\n  close(src_fd);\n  close(dst_fd);\n  return -1;\n  }\n  total_written += bytes_written;\n  }\n  }\n\n  close(src_fd);\n  close(dst_fd);\n  return (bytes_read < 0) ? -1 : 0;\n}\n\n// Demonstrate lseek\nvoid demo_lseek(const char *path) {\n  int fd = open(path, O_RDONLY);\n  if (fd < 0) { perror( open ); return; }\n\n  // Get file size using lseek\n  off_t size = lseek(fd, 0, SEEK_END);\n  printf( File size via lseek: %ld bytes\\n , size);\n\n  // Read last 10 bytes\n  lseek(fd, -10, SEEK_END);\n  char buf[11] = {0};\n  read(fd, buf, 10);\n  printf( Last 10 bytes: \'%s\'\\n , buf);\n\n  close(fd);\n}\n\n// File info via stat\nvoid print_file_info(const char *path) {\n  struct stat st;\n  if (stat(path, &st) < 0) { perror( stat ); return; }\n\n  printf( File: %s\\n , path);\n  printf(  Size: %ld bytes\\n , st.st_size);\n  printf(  Mode: %o\\n , st.st_mode & 0777);\n  printf(  Type:  );\n  if (S_ISREG(st.st_mode))  printf( Regular file\\n );\n  else if (S_ISDIR(st.st_mode))  printf( Directory\\n );\n  else if (S_ISCHR(st.st_mode))  printf( Character device\\n );\n  else if (S_ISBLK(st.st_mode))  printf( Block device\\n );\n  else if (S_ISFIFO(st.st_mode)) printf( FIFO\\n );\n  else printf( Other\\n );\n  printf(  Inode: %lu\\n , st.st_ino);\n  printf(  Links: %lu\\n , (unsigned long)st.st_nlink);\n}\n\nint main(int argc, char *argv[]) {\n  printf( === SYSTEM CALL DEMO ===\\n\\n );\n\n  // Create and write file using low-level syscalls\n  int fd = open( test.txt , O_WRONLY | O_CREAT | O_TRUNC, 0644);\n  CHECK(fd,  open for write );\n\n  const char *content =  Hello from system calls!\\nLine 2\\nLine 3\\n ;\n  ssize_t written = write(fd, content, strlen(content));\n  printf( Wrote %zd bytes\\n , written);\n  close(fd);\n\n  // Read file\n  fd = open( test.txt , O_RDONLY);\n  CHECK(fd,  open for read );\n  char buffer[256];\n  ssize_t bytes = read(fd, buffer, sizeof(buffer) - 1);\n  buffer[bytes] = \'\\0\';\n  printf( Read %zd bytes:\\n%s\\n , bytes, buffer);\n  close(fd);\n\n  // File info\n  print_file_info( test.txt );\n\n  // lseek demo\n  printf( \\n=== LSEEK DEMO ===\\n );\n  demo_lseek( test.txt );\n\n  // Copy file\n  printf( \\n=== COPY FILE ===\\n );\n  if (copy_file( test.txt ,  copy.txt ) == 0) {\n  printf( Copy successful\\n );\n  print_file_info( copy.txt );\n  }\n\n  // Strace hint\n  printf( \\n=== TRY THIS ===\\n );\n  printf( Run: strace ./syscalls_complete\\n );\n  printf( to see ALL system calls made!\\n );\n\n  // Cleanup\n  unlink( test.txt );\n  unlink( copy.txt );\n\n  return 0;\n}␀ENDCODE␀'},{h:'⚠️ COMMON PITFALLS — Day 4',b:'Pitfall\nWhy\nFix\n\n Not checking return values |\n Syscalls can fail! |\n Always check < 0 |\n\n Ignoring partial writes |\n write() may write fewer bytes |\n Loop until all written |\n\n Ignoring EINTR |\n Signals can interrupt syscalls |\n Retry on EINTR |\n\n Using printf in kernel |\n printf is userspace only |\n Use printk in kernel |'},{h:'📝 INTERVIEW QUESTIONS — Day 4 (10 Questions)',b:'**Q1: What is the difference between `open()` and `fopen()`?**\n\n`open()`: System call, returns int fd, no buffering, for device files & precise control.\n`fopen()`: C library function, returns `FILE*`, provides buffering, for regular file I/O.\n\n**Q2: Explain the file descriptor table.**\n\nEach process has FD table mapping integers to kernel file objects. fd 0=stdin, 1=stdout, 2=stderr. `open()` returns lowest available fd. FDs are per-process, but the underlying file objects can be shared (after `fork()` or `dup()`).\n\n**Q3: What happens when you call `write()` on a device file?**\n\n`write()` → syscall → VFS layer → looks up device by major number → calls driver s `.write()` function via `file_operations`. Your driver then handles the data.\n\n**Q4: What is `strace` and how does it work?**\n\n`strace` uses `ptrace()` syscall to intercept all system calls made by a process. Shows syscall name, arguments, and return value. Essential debugging tool for understanding app-kernel interaction.\n\n**Q5: Explain `dup()` and `dup2()`.**\n\n`dup(fd)` creates a copy of fd (new fd pointing to same file). `dup2(oldfd, newfd)` makes newfd a copy of oldfd, closing newfd first. Used for I/O redirection (e.g., redirecting stdout to a file).\n\n**Q6: What is the difference between `stat()`, `fstat()`, and `lstat()`?**\n\n`stat(path)`: gets info by path. `fstat(fd)`: gets info by fd (already opened). `lstat(path)`: like stat but doesn t follow symlinks. In kernel driver context, you usually work with fd (inode already known).\n\n**Q7: What flags would you use to open a file for appending?**\n\n`O_WRONLY | O_APPEND | O_CREAT` with mode 0644. `O_APPEND` seeks to end before each write atomically. Multiple processes can append safely.\n\n**Q8: What is the significance of `O_NONBLOCK`?**\n\nMakes file operations non-blocking. If data isn t available, `read()` returns `EAGAIN` instead of blocking. Critical for device drivers and event-driven programming. Kernel driver checks `filp->f_flags & O_NONBLOCK`.\n\n**Q9: How does the kernel know which driver handles a device file?**\n\nDevice files have major and minor numbers (visible with `ls -l /dev/`). Major number identifies the driver. Minor number identifies the specific device instance. The kernel maintains a table mapping major numbers to registered drivers.\n\n**Q10: What is the VFS layer?**\n\nVirtual File System Switch — abstraction layer that provides uniform file interface regardless of underlying filesystem or device. All file operations go through VFS, which then dispatches to the appropriate filesystem driver or device driver based on the file type.'},{h:'🧠 THEORY: Process Creation in Linux',b:'Linux creates processes using a unique 2-step model:\n\n**Step 1: `fork()`** — Clone the current process\n- Creates an almost-exact copy (child)\n- Uses **Copy-On-Write (COW)**: pages shared until written\n- Returns twice: 0 to child, child PID to parent\n\n**Step 2: `exec()`** — Replace the process image\n- Replaces code, data, stack with new program\n- Same PID, same file descriptors (unless FD_CLOEXEC set)\n- This is why shell commands work: shell forks, child execs\n␀CODE␀shell$ ls -la\n╔══════════════════╗\n║  Shell (bash)  ║\n║  PID = 1000  ║\n╚══════════════════╝\n  │\n  │ fork()\n  ▼\n╔══════════════════╗  ╔══════════════════╗\n║  Shell (parent) ║  ║  Shell (child)  ║\n║  PID = 1000  ║  ║  PID = 1001  ║\n║  wait()...  ║  ║  exec( ls )  ║\n╚══════════════════╝  ╚══════════════════╝\n  │\n  ▼\n  ╔══════════════════╗\n  ║  ls program  ║\n  ║  PID = 1001  ║\n  ║  runs, prints  ║\n  ║  exit(0)  ║\n  ╚══════════════════╝\n  │\n  ▼\n╔══════════════════╗\n║  Shell resumes  ║\n║  PID = 1000  ║\n║  prints prompt  ║\n╚══════════════════╝␀ENDCODE␀'},{h:'🧠 THEORY: Copy-On-Write (COW) — Performance Critical',b:'␀CODE␀Before fork():\nParent virtual page → Physical page P1 (writable)\n\nAfter fork():\nParent virtual page → Physical page P1 (read-only)\nChild  virtual page → Physical page P1 (read-only)  ← SAME physical page!\n\nWhen child writes:\nPage fault! → Kernel copies P1 → P2\nParent virtual page → P1 (writable again)\nChild  virtual page → P2 (writable, modified copy)␀ENDCODE␀\n\nWhy COW matters:\n1. Fork is fast — just copy page table entries, not pages\n2. Child often calls `exec()` immediately — no need to copy at all\n3. Read-only data (code) is never copied'},{h:'🧠 THEORY: Process States',b:'␀CODE␀┌──────────────────────────────┐\n  │  │\nfork() ──▶ TASK_RUNNING ────schedule()──▶ RUNNING ON CPU\n  │  │\n  │◀────── preempted ────────────┘\n  │\n  wait for event\n  │\n  ▼\n  TASK_INTERRUPTIBLE  (can be woken by signal)\n  │  or\n  TASK_UNINTERRUPTIBLE (cannot be interrupted)\n  │\n  event/signal\n  │\n  ▼\n  TASK_RUNNING (back in run queue)\n\n  exit() ──▶ EXIT_ZOMBIE ──wait()──▶ EXIT_DEAD (freed)␀ENDCODE␀'},{h:'💻 COMPLETE CODE: Process Patterns',b:'␀CODE␀// File: ~/embedded_learning/day_05/process_complete.c\n#include \n#include \n#include \n#include \n#include \n#include \n#include \n\n// Pattern 1: Simple fork\nvoid demo_fork() {\n  printf( \\n=== SIMPLE FORK ===\\n );\n  int shared_var = 42;\n\n  pid_t pid = fork();\n\n  if (pid  0) {\n  int status;\n  waitpid(pid, &status, 0);\n\n  if (WIFEXITED(status))\n  printf( Child exited normally, status=%d\\n , WEXITSTATUS(status));\n  else if (WIFSIGNALED(status))\n  printf( Child killed by signal %d\\n , WTERMSIG(status));\n  }\n}\n\n// Pattern 3: Pipe communication\nvoid demo_pipe() {\n  printf( \\n=== PIPE COMMUNICATION ===\\n );\n\n  int pipefd[2];  // pipefd[0]=read, pipefd[1]=write\n\n  if (pipe(pipefd) < 0) { perror( pipe ); return; }\n\n  pid_t pid = fork();\n\n  if (pid == 0) {\n  close(pipefd[1]);  // Close write end in child\n  char buffer[256];\n  ssize_t n = read(pipefd[0], buffer, sizeof(buffer)-1);\n  buffer[n] = \'\\0\';\n  printf( Child received: \'%s\'\\n , buffer);\n  close(pipefd[0]);\n  exit(0);\n  } else {\n  close(pipefd[0]);  // Close read end in parent\n  const char *msg =  Hello from parent via pipe! ;\n  write(pipefd[1], msg, strlen(msg));\n  close(pipefd[1]);  // Signal EOF to child\n  wait(NULL);\n  }\n}\n\n// Pattern 4: Multiple children\nvoid demo_multi_child() {\n  printf( \\n=== MULTIPLE CHILDREN ===\\n );\n  const int NUM_CHILDREN = 3;\n  pid_t children[NUM_CHILDREN];\n\n  for (int i = 0; i < NUM_CHILDREN; i++) {\n  children[i] = fork();\n  if (children[i] == 0) {\n  printf( Child %d (PID=%d) starting work...\\n , i, getpid());\n  usleep((3 - i) * 100000);  // Different durations\n  printf( Child %d done\\n , i);\n  exit(i);  // Exit with different codes\n  }\n  }\n\n  // Parent waits for all children\n  for (int i = 0; i < NUM_CHILDREN; i++) {\n  int status;\n  pid_t pid = waitpid(children[i], &status, 0);\n  printf( Child PID=%d exited with status=%d\\n , pid, WEXITSTATUS(status));\n  }\n}\n\nint main() {\n  demo_fork();\n  demo_fork_exec();\n  demo_pipe();\n  demo_multi_child();\n  return 0;\n}␀ENDCODE␀'},{h:'📝 INTERVIEW QUESTIONS — Day 5 (12 Questions)',b:'**Q1: What does fork() return?**\n\nReturns 0 to child, child s PID to parent, -1 on error. The process execution continues from the same point in both parent and child.\n\n**Q2: What is a zombie process?**\n\nA finished process whose exit status hasn t been read by parent via `wait()`. Takes no memory/CPU but occupies a PID slot. Parent MUST call `wait()` or set `SIGCHLD` to `SIG_IGN`.\n\n**Q3: What is an orphan process?**\n\nA process whose parent terminated. Adopted by init (PID 1) or subreaper. Init calls `wait()` when orphan exits, preventing zombies.\n\n**Q4: Explain Copy-On-Write.**\n\nAfter fork(), parent and child share same physical pages (marked read-only). On first write, page fault triggers kernel to copy the page. Huge optimization — if child calls exec() immediately, no copying needed at all.\n\n**Q5: Difference between exec family functions?**\n\n`execl`: list of args. `execv`: vector (array) of args. `execlp`/`execvp`: search PATH. `execle`/`execve`: pass environment. All replace current process image.\n\n**Q6: What happens to open file descriptors after fork()?**\n\nChild inherits copies of all parent s file descriptors. Both share the same file position (offset). Writing from either changes the shared offset. This is why pipes work — parent and child share pipe fds.\n\n**Q7: What is `wait()` vs `waitpid()`?**\n\n`wait()`: waits for any child, blocks. `waitpid(pid, &status, flags)`: waits for specific child, can be non-blocking with `WNOHANG`. Can check specific child or process group.\n\n**Q8: How does a shell implement piping (`ls | grep foo`)?**\n\nShell creates pipe, forks twice. First child: dup2(pipe_write, STDOUT), exec( ls ). Second child: dup2(pipe_read, STDIN), exec( grep ). Parent closes pipe, waits for both.\n\n**Q9: What is the difference between `_exit()` and `exit()`?**\n\n`exit()`: flushes stdio buffers, calls `atexit()` handlers, then calls `_exit()`. `_exit()`: immediate termination, no cleanup. After `fork()`, child should use `_exit()` to avoid flushing parent s buffers.\n\n**Q10: What is `vfork()`?**\n\nLike fork() but child shares parent s address space (no COW). Parent is suspended until child calls exec() or _exit(). Faster than fork() but dangerous — child must not modify shared memory. Largely obsolete with efficient fork() + COW.\n\n**Q11: How do kernel threads differ from user processes?**\n\nKernel threads (`kthread_create()`) run only in kernel space, no user-space address space. Share kernel address space. Used for background tasks: kworker, ksoftirqd, kswapd.\n\n**Q12: What is the `clone()` system call?**\n\nUnderlying syscall for both `fork()` and `pthread_create()`. Flags control what is shared: `CLONE_VM` (share memory), `CLONE_FILES` (share fd table), etc. Most flexible Linux process/thread creation mechanism.'},{h:'🧠 THEORY: Why mmap() Matters',b:'`mmap()` is one of the most important system calls for embedded Linux because:\n1. **Device drivers** use it to map hardware registers into user space\n2. **Shared memory** between processes uses it\n3. **Large file access** without read/write overhead\n4. **DMA buffers** are exposed to user space via mmap\n␀CODE␀Regular file I/O:\nUser Buffer → copy → Kernel Buffer → copy → Disk\n(Two copies!)\n\nmmap() file I/O:\nUser Virtual Address → Page Fault → Kernel loads page from disk → Direct access\n(Zero copies! Pages loaded on demand)␀ENDCODE␀'},{h:'🧠 THEORY: mmap() Parameters Explained',b:'␀CODE␀void *mmap(\n  void *addr,  // Suggested address (usually NULL = let kernel choose)\n  size_t length,  // Size to map\n  int prot,  // Protection: PROT_READ | PROT_WRITE | PROT_EXEC\n  int flags,  // MAP_SHARED | MAP_PRIVATE | MAP_ANONYMOUS\n  int fd,  // File descriptor (-1 for anonymous)\n  off_t offset  // Offset in file (must be page-aligned)\n);␀ENDCODE␀\n\nFlag\nMeaning\n\n `MAP_SHARED` |\n Changes visible to other processes, written to file |\n\n `MAP_PRIVATE` |\n Copy-on-write, changes NOT written to file |\n\n `MAP_ANONYMOUS` |\n Not backed by file (memory allocation) |\n\n `MAP_FIXED` |\n Map at exact address (dangerous!) |'},{h:'💻 COMPLETE CODE: mmap Patterns',b:'␀CODE␀// File: ~/embedded_learning/day_06/mmap_complete.c\n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n\n// Pattern 1: Read file via mmap (zero-copy)\nvoid mmap_read_file(const char *filename) {\n  int fd = open(filename, O_RDONLY);\n  if (fd < 0) { perror( open ); return; }\n\n  struct stat st;\n  fstat(fd, &st);\n\n  char *data = mmap(NULL, st.st_size, PROT_READ, MAP_PRIVATE, fd, 0);\n  if (data == MAP_FAILED) { perror( mmap ); close(fd); return; }\n\n  // Access file like an array — NO read() calls needed!\n  printf( File size: %ld, First 50 chars: %.50s\\n , st.st_size, data);\n\n  // Can search, parse, etc. using normal pointer operations\n  // The kernel loads pages on-demand (page faults)\n\n  munmap(data, st.st_size);\n  close(fd);\n}\n\n// Pattern 2: Shared memory between processes\nvoid mmap_shared_memory() {\n  size_t size = 4096;\n\n  // Anonymous shared mapping — persists across fork()\n  int *shared = mmap(NULL, size, PROT_READ | PROT_WRITE,\n  MAP_SHARED | MAP_ANONYMOUS, -1, 0);\n  if (shared == MAP_FAILED) { perror( mmap ); return; }\n\n  shared[0] = 0;  // Counter\n  shared[1] = 0;  // Flag\n\n  pid_t pid = fork();\n  if (pid == 0) {\n  // Child increments counter\n  for (int i = 0; i < 1000; i++) shared[0]++;\n  shared[1] = 1;  // Signal done\n  _exit(0);\n  } else {\n  wait(NULL);\n  printf( Shared counter: %d (expect ~2000, race possible without lock)\\n ,\n  shared[0]);\n  }\n\n  munmap(shared, size);\n}\n\n// Pattern 3: Memory-mapped hardware simulation\n// In real embedded: mmap /dev/mem or driver provides mmap\nvoid mmap_hardware_sim() {\n  // Simulate hardware register access\n  size_t size = 4096;\n  volatile uint32_t *regs = mmap(NULL, size, PROT_READ | PROT_WRITE,\n  MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);\n  if (regs == MAP_FAILED) { perror( mmap ); return; }\n\n  // In real driver, this would be physical hardware address\n  regs[0] = 0x01;  // Control register\n  regs[1] = 0xFF;  // Status register\n  printf( Simulated HW regs: CTRL=0x%X, STATUS=0x%X\\n , regs[0], regs[1]);\n\n  // IMPORTANT: volatile prevents compiler from optimizing away reads\n  // Without volatile, compiler might cache the value\n\n  munmap((void*)regs, size);\n}\n\nint main() {\n  // Create test file\n  int fd = open( test.txt , O_WRONLY | O_CREAT | O_TRUNC, 0644);\n  const char *text =  Hello World! This is a test file for memory mapping.\\n ;\n  write(fd, text, strlen(text));\n  close(fd);\n\n  printf( === MMAP FILE READ ===\\n );\n  mmap_read_file( test.txt );\n\n  printf( \\n=== MMAP SHARED MEMORY ===\\n );\n  mmap_shared_memory();\n\n  printf( \\n=== MMAP HARDWARE SIM ===\\n );\n  mmap_hardware_sim();\n\n  unlink( test.txt );\n  return 0;\n}␀ENDCODE␀'},{h:'📝 INTERVIEW QUESTIONS — Day 6 (8 Questions)',b:'**Q1: mmap vs read/write — when to use each?**\n\nmmap: random access, multiple reads of same data, shared memory, large files, HW register access. read/write: sequential one-time access, small files, simple operations.\n\n**Q2: MAP_PRIVATE vs MAP_SHARED?**\n\nPRIVATE: COW — changes not written to file, not visible to others. SHARED: changes go to file and visible to all mapping processes.\n\n**Q3: What is the purpose of msync()?**\n\nForces dirty pages to disk. Without it, changes may be lost on crash. `msync(addr, len, MS_SYNC)` blocks until write completes.\n\n**Q4: How does mmap relate to device drivers?**\n\nDrivers implement `.mmap()` in file_operations to map device memory/DMA buffers into user space. User calls `mmap()` on `/dev/mydevice`, kernel calls driver s mmap handler, which sets up page table entries pointing to physical device memory.\n\n**Q5: Why use volatile with memory-mapped registers?**\n\nWithout volatile, compiler may cache register values in CPU registers, reorder accesses, or eliminate  redundant  reads. `volatile` forces every access to go to the actual memory address.\n\n**Q6: What happens when you access unmapped mmap d memory?**\n\nPage fault → kernel checks if address is in valid mapping → if yes, loads page from file/allocates zero page → returns to user. If address invalid → SIGSEGV.\n\n**Q7: Can mmap() fail? When?**\n\nYes. Common failures: out of virtual address space, file too large, invalid flags, permission denied, no physical memory for page tables. Always check for `MAP_FAILED`.\n\n**Q8: What is the difference between mmap() and ioremap() in kernel?**\n\n`mmap()` is userspace syscall. `ioremap()` is kernel function that maps physical I/O addresses into kernel virtual address space for driver register access. Both achieve memory-mapped I/O but in different contexts.'},{h:'🧠 THEORY: Complete Boot Sequence',b:'␀CODE␀1. POWER ON\n  │\n  ▼\n2. BIOS/UEFI\n  - POST (Power-On Self Test)\n  - Find boot device\n  - Load bootloader (MBR/EFI)\n  │\n  ▼\n3. BOOTLOADER (GRUB/U-Boot)\n  - Load kernel image (vmlinuz) from disk\n  - Load initial ramdisk (initrd/initramfs)\n  - Set kernel command line parameters\n  - Transfer control to kernel\n  - On embedded: U-Boot loads kernel + DTB from flash/network\n  │\n  ▼\n4. KERNEL STARTUP (start_kernel() in init/main.c)\n  - Decompress kernel image\n  - Initialize memory management (page tables, buddy system)\n  - Initialize CPU, interrupts, timers\n  - Initialize device drivers (built-in ones)\n  - Parse device tree (on ARM/embedded)\n  - Mount initramfs as temporary root\n  - Run /init from initramfs\n  - Real root filesystem mounted (pivot_root)\n  - Execute /sbin/init (PID 1)\n  │\n  ▼\n5. INIT SYSTEM (systemd on modern, SysV init on legacy)\n  - PID 1 process — ancestor of all user processes\n  - Start services (networking, logging, etc.)\n  - Mount filesystems from /etc/fstab\n  - On embedded: may use BusyBox init\n  │\n  ▼\n6. USER SPACE\n  - Login prompt or auto-start application␀ENDCODE␀'},{h:'🧠 THEORY: Critical Pseudo-Filesystems',b:'Path\nType\nPurpose\n\n `/proc` |\n procfs |\n Process & kernel info |\n\n `/sys` |\n sysfs |\n Device & driver info (modern, structured) |\n\n `/dev` |\n devtmpfs |\n Device nodes |\n\n `/run` |\n tmpfs |\n Runtime data |\n\n/proc — What your driver should know:\n␀CODE␀/proc/[PID]/  # Per-process info (status, maps, fd/)\n/proc/cpuinfo  # CPU details\n/proc/meminfo  # Memory statistics\n/proc/interrupts  # IRQ usage (your driver\'s IRQ shows here!)\n/proc/modules  # Loaded kernel modules\n/proc/devices  # Registered char/block devices (YOUR driver!)\n/proc/cmdline  # Kernel boot parameters␀ENDCODE␀\n/sys — The driver developer s best friend:\n␀CODE␀/sys/class/  # Device classes (your driver creates class here)\n/sys/bus/  # Bus types (platform, i2c, spi, pci, usb)\n/sys/devices/  # Physical device hierarchy\n/sys/module/  # Loaded module parameters (readable/writable!)\n/sys/kernel/  # Kernel parameters␀ENDCODE␀\n/dev — Device nodes:\n␀CODE␀# Character devices (stream):\n/dev/null  - Discards all data\n/dev/zero  - Produces zeros\n/dev/random  - Random numbers (blocking)\n/dev/urandom - Random numbers (non-blocking)\n/dev/ttyS0  - Serial port\n/dev/i2c-0  - I2C bus 0\n\n# Block devices (random access):\n/dev/sda  - First SATA/SCSI disk\n/dev/mmcblk0 - First MMC/SD card\n\n# Your driver will create:\n/dev/mydevice - Your character device!␀ENDCODE␀'},{h:'🧠 THEORY: For Embedded — U-Boot Device Tree Boot',b:'␀CODE␀U-Boot (common on ARM SoCs):\n1. Initialize DRAM controller\n2. Load kernel image from flash/SD/network:\n  fatload mmc 0:1 0x80000000 zImage\n3. Load device tree blob:\n  fatload mmc 0:1 0x84000000 board.dtb\n4. Optional: load initramfs\n5. Boot:\n  bootz 0x80000000 - 0x84000000\n  ^kernel  ^dtb address␀ENDCODE␀'},{h:'📝 INTERVIEW QUESTIONS — Days 7-8 (12 Questions)',b:'**Q1: What is initramfs and why is it needed?**\n\nTemporary root filesystem in RAM. Contains drivers and tools needed to mount real root. Needed because root may be on complex storage (RAID, LVM, encrypted, NFS) requiring drivers not built into kernel.\n\n**Q2: Difference between /proc and /sys?**\n\n`/proc`: process info + kernel params, historical, somewhat messy format. `/sys`: structured device/driver info, modern, organized by bus/class, each file=one value. Use /sys for device driver interfaces.\n\n**Q3: What is PID 1 and why is it special?**\n\nInit process (systemd). First user process. Cannot be killed. Adopts orphans. Reaps zombies. System shuts down if PID 1 exits.\n\n**Q4: What is U-Boot?**\n\nUniversal Boot Loader — standard bootloader for embedded Linux (ARM, MIPS, etc.). Initializes hardware (DRAM, clocks), loads kernel + DTB + rootfs from flash/SD/TFTP/USB, passes control to kernel with boot args.\n\n**Q5: What is the kernel command line?**\n\nParameters passed to kernel at boot (by GRUB/U-Boot). Example: `root=/dev/mmcblk0p2 console=ttyS0,115200 loglevel=7`. Controls root device, console, debug settings.\n\n**Q6: What is the difference between `insmod` and `modprobe`?**\n\n`insmod`: loads a specific .ko file, no dependency handling. `modprobe`: searches `/lib/modules/`, resolves and loads dependencies automatically. Use `modprobe` in production, `insmod` during development.\n\n**Q7: How does udev create device nodes?**\n\nKernel sends uevent when device registered. udev daemon (or mdev on embedded) receives event, creates /dev node with correct major/minor/permissions based on rules in /etc/udev/rules.d/.\n\n**Q8: What is sysfs and how do drivers use it?**\n\nKernel object filesystem at /sys. Drivers expose attributes (readable/writable files) via `DEVICE_ATTR_RO/RW/WO`. Users read/write these files to control driver behavior without ioctl.\n\n**Q9: What is the difference between built-in and loadable modules?**\n\nBuilt-in (`obj-y`): compiled into kernel image, available at boot, __init memory freed after boot, cannot be removed. Loadable (`obj-m`): separate .ko file, loaded/unloaded at runtime, uses more memory.\n\n**Q10: Explain rootfs mounting process.**\n\n• Kernel mounts initramfs as temporary /. 2. initramfs /init loads storage drivers. 3. Mounts real root partition. 4. `switch_root` or `pivot_root` changes to real root. 5. Real /sbin/init starts.\n\n**Q11: What is BusyBox and why is it used in embedded?**\n\nSingle binary providing hundreds of Unix utilities (sh, ls, cat, mount, etc.). Uses symlinks: `/bin/ls → /bin/busybox`. Tiny footprint (~1MB for everything). Standard for embedded rootfs.\n\n**Q12: How do you cross-compile a kernel for ARM?**\n\n`bash\nexport ARCH=arm\nexport CROSS_COMPILE=arm-linux-gnueabihf-\nmake defconfig  # or vendor-specific config\nmake menuconfig  # customize\nmake zImage dtbs modules -j$(nproc)`\nProduces `arch/arm/boot/zImage` (kernel) and `arch/arm/boot/dts/*.dtb` (device trees).\n\n  \n  \n  ← PreviousPhase 1: C Revision\nNext →Phase 3: Kernel Modules\n  \n  \n  \n\n  \n  ↑'}]},
{id:'03',sec:'kmod',icon:'🧩',title:'Phase 3: Kernel Modules',secs:[{h:'🧠 THEORY: What IS a Kernel Module?',b:'A kernel module is a piece of code that can be loaded/unloaded into the kernel **at runtime** without rebooting. Think of it as a plugin for the Linux kernel.\n␀CODE␀┌────────────────────────────────────────────────────────────────┐\n│  LINUX KERNEL (Ring 0)  │\n│  │\n│  ┌──────────┐  ┌──────────┐  ┌──────────────────────┐  │\n│  │ Scheduler│  │ VFS  │  │  Built-in Drivers  │  │\n│  │  │  │  │  │  (compiled into kernel)│  │\n│  └──────────┘  └──────────┘  └──────────────────────┘  │\n│  │\n│  ┌──────────────────────────────────────┐  │\n│  │  MODULE SPACE  │  │\n│  │  ┌──────────┐  ┌──────────┐  │  │\n│  │  │ your_mod │  │ usb_drv  │  ← Loaded at runtime  │\n│  │  │  .ko  │  │  .ko  │  insmod / modprobe  │\n│  │  └──────────┘  └──────────┘  │\n│  └──────────────────────────────────────┘  │\n│  │\n│  A module has FULL kernel privileges!  │\n│  Bug in module = kernel crash (oops/panic)  │\n└────────────────────────────────────────────────────────────────┘␀ENDCODE␀'},{h:'🧠 THEORY: Module vs Built-in',b:'Aspect\nModule (.ko)\nBuilt-in\n\n **Config** |\n `obj-m += foo.o` |\n `obj-y += foo.o` or CONFIG=y |\n\n **Load time** |\n Runtime via insmod/modprobe |\n Boot time |\n\n **Unload** |\n rmmod |\n Cannot |\n\n **__init memory** |\n Freed after insmod |\n Freed after boot |\n\n **Use case** |\n Development, optional drivers |\n Essential drivers |\n\n **Size impact** |\n No kernel image growth |\n Larger vmlinuz |'},{h:'🧠 THEORY: Module Lifecycle',b:'␀CODE␀insmod module.ko\n  │\n  ▼\n1. Kernel loads .ko into memory (ELF parsing)\n2. Relocate symbols (link printk, kmalloc, etc.)\n3. Run __init function (module_init)\n  │\n  ├── Returns 0 → SUCCESS\n  │  Module is active, appears in lsmod\n  │  /sys/module/my_module/ directory created\n  │\n  └── Returns negative → FAILURE\n  Module NOT loaded\n  Cleanup already done (by your code!)\n  __exit is NOT called!\n\nrmmod module\n  │\n  ▼\n4. Kernel checks refcount (in-use?)\n5. Run __exit function (module_exit)\n6. Free module memory\n  Module removed from lsmod␀ENDCODE␀'},{h:'🧠 THEORY: Kernel vs Userspace Environment',b:'In kernel modules, you are NOT in userspace anymore:\n\nFeature\nUserspace\nKernel Module\n\n **Output** |\n printf(), stdout |\n printk(), dmesg |\n\n **Memory** |\n malloc/free |\n kmalloc/kfree, vmalloc |\n\n **Headers** |\n stdio.h, stdlib.h |\n linux/module.h, linux/kernel.h |\n\n **Errors** |\n errno, perror |\n Return negative errno |\n\n **String** |\n string.h |\n linux/string.h |\n\n **Sleep** |\n sleep(), usleep() |\n msleep(), usleep_range() |\n\n **Threading** |\n pthread |\n kthread, workqueue |\n\n **Stack** |\n ~8MB |\n **8-16KB** (TINY!) |\n\n **Float** |\n Allowed |\n **NEVER use floating point!** |\n\n **Crash** |\n Segfault (process dies) |\n **Kernel oops/panic (system may crash)** |'},{h:'💻 COMPLETE CODE: Comprehensive First Module',b:'␀CODE␀// File: ~/embedded_learning/day_09/my_module/my_module.c\n#include \n#include \n#include \n#include \n#include \n#include \n#include \n\n/* Module metadata */\nMODULE_LICENSE( GPL );\nMODULE_AUTHOR( Your Name );\nMODULE_DESCRIPTION( Comprehensive first kernel module );\nMODULE_VERSION( 1.0 );\n\n/* ==== MODULE PARAMETERS ==== */\n/* These appear in /sys/module/my_module/parameters/ */\nstatic int debug_level = 0;\nmodule_param(debug_level, int, S_IRUGO | S_IWUSR);  // Readable by all, writable by root\nMODULE_PARM_DESC(debug_level,  Debug verbosity (0=off, 1=info, 2=verbose) );\n\nstatic char *device_name =  mydevice ;\nmodule_param(device_name, charp, S_IRUGO);  // Read-only after load\nMODULE_PARM_DESC(device_name,  Device name string );\n\nstatic int max_devices = 4;\nmodule_param(max_devices, int, S_IRUGO);\nMODULE_PARM_DESC(max_devices,  Maximum number of devices );\n\n/* ==== LOGGING MACROS ==== */\n/* Kernel convention: use dev_info/dev_err when you have a struct device,\n  pr_info/pr_err when you don\'t */\n#define MOD_NAME  my_module \n#define LOG(level, fmt, ...) do { \\\n  if (debug_level >= level) \\\n  pr_info(MOD_NAME  :  fmt, ##__VA_ARGS__); \\\n} while(0)\n\n#define LOG_ERR(fmt, ...)  pr_err(MOD_NAME  : ERROR:  fmt, ##__VA_ARGS__)\n#define LOG_INFO(fmt, ...) LOG(1, fmt, ##__VA_ARGS__)\n#define LOG_DBG(fmt, ...)  LOG(2, fmt, ##__VA_ARGS__)\n\n/* ==== INIT FUNCTION ==== */\n/* __init: function used ONLY during initialization\n  Memory is freed after init completes (for built-in modules) */\nstatic int __init my_module_init(void)\n{\n  pr_info( ========================================\\n );\n  pr_info(MOD_NAME  : Loading module\\n );\n  pr_info(MOD_NAME  : Parameters:\\n );\n  pr_info(MOD_NAME  :  debug_level = %d\\n , debug_level);\n  pr_info(MOD_NAME  :  device_name = %s\\n , device_name);\n  pr_info(MOD_NAME  :  max_devices = %d\\n , max_devices);\n\n  /* Validate parameters */\n  if (max_devices  16) {\n  LOG_ERR( max_devices must be 1-16, got %d\\n , max_devices);\n  return -EINVAL;  /* Module will NOT load */\n  }\n\n  /* Log some kernel info */\n  pr_info(MOD_NAME  : Kernel version: %s\\n , UTS_RELEASE);\n  pr_info(MOD_NAME  : HZ = %d (timer frequency)\\n , HZ);\n  pr_info(MOD_NAME  : Jiffies = %lu\\n , jiffies);\n  pr_info(MOD_NAME  : Current process: %s (PID %d)\\n ,\n  current->comm, current->pid);\n  pr_info(MOD_NAME  : PAGE_SIZE = %lu\\n , PAGE_SIZE);\n\n  /* Print all log levels */\n  pr_emerg(MOD_NAME  : EMERG: System is unusable\\n );\n  pr_alert(MOD_NAME  : ALERT: Action must be taken immediately\\n );\n  pr_crit(MOD_NAME  :  CRIT:  Critical conditions\\n );\n  pr_err(MOD_NAME  :  ERR:  Error conditions\\n );\n  pr_warn(MOD_NAME  :  WARN:  Warning conditions\\n );\n  pr_notice(MOD_NAME  : NOTICE: Normal but significant\\n );\n  pr_info(MOD_NAME  :  INFO:  Informational\\n );\n\n  LOG_INFO( Debug logging active at level %d\\n , debug_level);\n  LOG_DBG( Verbose debug active\\n );\n\n  pr_info(MOD_NAME  : Module loaded successfully!\\n );\n  pr_info( ========================================\\n );\n\n  return 0;  /* SUCCESS */\n}\n\n/* ==== EXIT FUNCTION ==== */\n/* __exit: function called ONLY during module unload\n  For built-in modules, this function is discarded entirely */\nstatic void __exit my_module_exit(void)\n{\n  pr_info(MOD_NAME  : Unloading module\\n );\n  pr_info(MOD_NAME  : Module was active for %lu seconds\\n ,\n  jiffies / HZ);\n  pr_info(MOD_NAME  : Module unloaded. Goodbye!\\n );\n}\n\n/* Register init/exit functions */\nmodule_init(my_module_init);\nmodule_exit(my_module_exit);␀ENDCODE␀'},{h:'💻 Makefile for Out-of-Tree Module',b:'␀CODE␀# File: ~/embedded_learning/day_09/my_module/Makefile\n\n# For modules built outside kernel tree\nobj-m += my_module.o\n\n# Kernel build directory\nKDIR := /lib/modules/$(shell uname -r)/build\n\n# Build directory (current)\nPWD := $(shell pwd)\n\n# Default target\nall:\n  $(MAKE) -C $(KDIR) M=$(PWD) modules\n\nclean:\n  $(MAKE) -C $(KDIR) M=$(PWD) clean\n\n# Convenience targets\nload:\n  sudo insmod my_module.ko debug_level=2 device_name= testdev  max_devices=4\n\nunload:\n  sudo rmmod my_module\n\nreload: unload load\n\ninfo:\n  modinfo my_module.ko\n\nlog:\n  dmesg | tail -30\n\ntest: all load log\n  @echo  Module loaded. Check dmesg output above. \n\n.PHONY: all clean load unload reload info log test␀ENDCODE␀'},{h:'🧠 THEORY: Makefile Explanation',b:'␀CODE␀$(MAKE) -C $(KDIR) M=$(PWD) modules\n  │  │  │\n  │  │  └── Target: build modules\n  │  └── M= tells kbuild  source is HERE \n  └── -C: change to kernel build dir first (has kbuild system)\n\nThis invokes the kernel\'s build system (kbuild), which:\n1. Reads your Makefile for obj-m line\n2. Compiles your .c files with kernel flags\n3. Links into .ko (kernel object) file␀ENDCODE␀'},{h:'Usage:',b:'␀CODE␀cd ~/embedded_learning/day_09/my_module\nmake\nsudo insmod my_module.ko debug_level=2\ndmesg | tail -20\nlsmod | grep my_module\ncat /sys/module/my_module/parameters/debug_level\necho 1 | sudo tee /sys/module/my_module/parameters/debug_level  # Change at runtime!\nsudo rmmod my_module\ndmesg | tail -5␀ENDCODE␀'},{h:'🏗️ MINI-EXERCISES — Day 9',b:'• **Exercise 9.1**: Add a module parameter `greeting` (string). Print it in init. Change it via sysfs while module is loaded.\n\n• **Exercise 9.2**: Add an array parameter (`module_param_array`). Print all values.\n\n• **Exercise 9.3**: Try loading with invalid `max_devices=20`. Verify module fails to load.'},{h:'⚠️ COMMON PITFALLS — Day 9',b:'Pitfall\nWhy\nFix\n\n Missing `MODULE_LICENSE("GPL")` |\n Taints kernel, EXPORT_SYMBOL_GPL fails |\n Always add GPL |\n\n `printf()` instead of `printk()` |\n printf is userspace only |\n Use pr_info(), pr_err() |\n\n Large stack arrays |\n Kernel stack is 8-16KB |\n Use kmalloc for large buffers |\n\n Using floats |\n No FPU in kernel context |\n Use fixed-point math |\n\n Returning positive from init |\n Positive treated as module-specific code, module LOADS |\n Return 0 success, negative errno fail |'},{h:'📝 INTERVIEW QUESTIONS — Day 9 (10 Questions)',b:'**Q1: What is a kernel module?**\n\nDynamically loadable kernel code (.ko file). Runs in Ring 0 with full kernel privileges. Can be loaded/unloaded without rebooting. Used for drivers, filesystems, network protocols.\n\n**Q2: What happens if module_init returns -EINVAL?**\n\nModule fails to load. `insmod` returns error to userspace. Module_exit is NOT called. Developer must clean up all partially-allocated resources before returning the error.\n\n**Q3: What does MODULE_LICENSE( GPL ) do?**\n\nDeclares module s license. Without it: kernel is  tainted  (warning in dmesg), EXPORT_SYMBOL_GPL symbols become inaccessible. Always use GPL for new driver development.\n\n**Q4: How does `module_param` work?**\n\nCreates a parameter that can be set at load time (`insmod mod.ko param=val`) and optionally changed at runtime via `/sys/module/modname/parameters/param`. Permission bits control read/write access.\n\n**Q5: What is the difference between `pr_info` and `dev_info`?**\n\n`pr_info` prints with module name prefix. `dev_info(&dev, ...)` prints with device identifier prefix (bus/address). Use `dev_*` when you have a struct device (in drivers), `pr_*` when you don t.\n\n**Q6: What is `__init` annotation?**\n\nMarks function as initialization-only. For built-in drivers: memory freed after boot (kernel prints  Freeing unused kernel memory ). For modules: freed after successful insmod. Saves memory.\n\n**Q7: Where do printk messages go?**\n\nKernel ring buffer. Read with `dmesg`. Also: `/proc/kmsg`, syslog. Messages above `console_loglevel` display on console. Can set level: `echo 7 > /proc/sys/kernel/printk`.\n\n**Q8: What is module taint?**\n\nFlags indicating kernel may be in unexpected state. Taint reasons: proprietary module (P), forced load (F), staging driver (C), unsigned module (E). Tainted kernel bugs get less attention from developers.\n\n**Q9: What is `current` in kernel?**\n\nMacro returning pointer to current process s `task_struct`. In process context: the process that called syscall. In init: the insmod process. Always valid in process context.\n\n**Q10: Why MODULE_DEVICE_TABLE?**\n\nCreates alias information so `modprobe` can auto-load the module when matching device appears. Example: `MODULE_DEVICE_TABLE(of, my_of_match)` creates autoload entry for DT compatible strings.'},{h:'🧠 THEORY: The goto Cleanup Pattern — Kernel s #1 Pattern',b:'In userspace, goto is considered bad practice. In kernel code, it s **essential and standard**:\n␀CODE␀WHY goto in kernel?\n─────────────────\ninit() allocates 5 resources in sequence.\nIf resource 3 fails, must free resources 2 and 1.\nIf resource 5 fails, must free 4, 3, 2, and 1.\n\nWithout goto: deeply nested if/else, error-prone duplicated cleanup code\nWith goto: clean, linear, matches kernel coding style exactly␀ENDCODE␀'},{h:'💻 COMPLETE CODE: Error Handling Patterns',b:'␀CODE␀// File: ~/embedded_learning/day_10/error_handling/error_module.c\n#include \n#include \n#include  /* kmalloc, kfree */\n#include \n#include  /* IS_ERR, PTR_ERR, ERR_PTR */\n\nMODULE_LICENSE( GPL );\n\nstruct my_device {\n  char *name;\n  char *buffer;\n  int *config;\n  int id;\n};\n\nstatic struct my_device *mydev = NULL;\n\n/*\n * PATTERN: goto cleanup chain\n * \n * Rules:\n * 1. Allocate resources in order\n * 2. On failure, goto label that frees all PREVIOUSLY allocated resources\n * 3. Labels go in REVERSE order of allocation\n * 4. Success path returns 0 at the end\n * 5. Every allocation has a corresponding label\n */\nstatic int __init error_module_init(void)\n{\n  int ret;\n\n  pr_info( error_module: Starting initialization\\n );\n\n  /* Step 1: Allocate device structure */\n  mydev = kzalloc(sizeof(*mydev), GFP_KERNEL);\n  if (!mydev) {\n  pr_err( error_module: Failed to allocate device struct\\n );\n  ret = -ENOMEM;\n  goto fail;\n  }\n  pr_info( error_module: Step 1 OK - device struct allocated\\n );\n\n  /* Step 2: Allocate name buffer */\n  mydev->name = kzalloc(64, GFP_KERNEL);\n  if (!mydev->name) {\n  pr_err( error_module: Failed to allocate name\\n );\n  ret = -ENOMEM;\n  goto fail_dev;\n  }\n  snprintf(mydev->name, 64,  TestDevice-%d , 0);\n  pr_info( error_module: Step 2 OK - name: %s\\n , mydev->name);\n\n  /* Step 3: Allocate data buffer */\n  mydev->buffer = kzalloc(4096, GFP_KERNEL);\n  if (!mydev->buffer) {\n  pr_err( error_module: Failed to allocate buffer\\n );\n  ret = -ENOMEM;\n  goto fail_name;\n  }\n  pr_info( error_module: Step 3 OK - buffer allocated\\n );\n\n  /* Step 4: Allocate config */\n  mydev->config = kzalloc(sizeof(int) * 10, GFP_KERNEL);\n  if (!mydev->config) {\n  pr_err( error_module: Failed to allocate config\\n );\n  ret = -ENOMEM;\n  goto fail_buffer;\n  }\n  pr_info( error_module: Step 4 OK - config allocated\\n );\n\n  /* Simulated validation (could fail) */\n  mydev->id = 42;\n  if (mydev->id > 100) {\n  pr_err( error_module: Invalid device ID\\n );\n  ret = -EINVAL;\n  goto fail_config;\n  }\n\n  pr_info( error_module: All initialization complete!\\n );\n  return 0;\n\n  /* Cleanup labels - REVERSE ORDER */\nfail_config:\n  kfree(mydev->config);\nfail_buffer:\n  kfree(mydev->buffer);\nfail_name:\n  kfree(mydev->name);\nfail_dev:\n  kfree(mydev);\n  mydev = NULL;\nfail:\n  return ret;\n}\n\nstatic void __exit error_module_exit(void)\n{\n  if (mydev) {\n  kfree(mydev->config);\n  kfree(mydev->buffer);\n  kfree(mydev->name);\n  kfree(mydev);\n  }\n  pr_info( error_module: Unloaded\\n );\n}\n\nmodule_init(error_module_init);\nmodule_exit(error_module_exit);␀ENDCODE␀'},{h:'🧠 THEORY: Kernel Memory Allocation',b:'␀CODE␀MEMORY ALLOCATION LANDSCAPE:\n\n┌─────────────────────────────────────────────────────────┐\n│  KERNEL MEMORY  │\n│  │\n│  ┌──────────────────┐  ┌──────────────────┐  │\n│  │  PAGE ALLOCATOR │  │  SLAB ALLOCATOR  │  │\n│  │  (Buddy System) │  │  (SLUB/SLAB)  │  │\n│  │  │  │  │  │\n│  │  alloc_pages()  │  │  kmalloc()  │ ◄── Use this!\n│  │  __get_free_page()│  │  kzalloc()  │  │\n│  │  │  │  kcalloc()  │  │\n│  │  Granularity:  │  │  kfree()  │  │\n│  │  4KB pages  │  │  │  │\n│  │  │  │  Physically  │  │\n│  │  │  │  contiguous  │  │\n│  └──────────────────┘  └──────────────────┘  │\n│  │\n│  ┌──────────────────┐  ┌──────────────────┐  │\n│  │  VMALLOC  │  │  DEVICE MANAGED  │  │\n│  │  │  │  (devm_*)  │  │\n│  │  vmalloc()  │  │  │  │\n│  │  vfree()  │  │  devm_kzalloc()  │ ◄── Preferred!\n│  │  │  │  devm_ioremap()  │  │\n│  │  Virtually  │  │  devm_request_irq│  │\n│  │  contiguous only  │  │  │  │\n│  │  Can\'t DMA!  │  │  Auto-freed on  │  │\n│  │  │  │  device removal  │  │\n│  └──────────────────┘  └──────────────────┘  │\n└─────────────────────────────────────────────────────────┘\n\nDecision flow:\n1. In a driver with struct device? → devm_kzalloc (preferred!)\n2. Need physically contiguous, 1MB)? → vmalloc\n5. Need DMA-able? → dma_alloc_coherent or kmalloc with GFP_DMA\n6. In interrupt context? → kmalloc with GFP_ATOMIC␀ENDCODE␀'},{h:'🧠 THEORY: IS_ERR / PTR_ERR / ERR_PTR Pattern',b:'Some kernel functions return pointers that encode errors:\n␀CODE␀/* Kernel convention: error pointers */\n/* PTR range: last page of address space reserved for error codes */\n\nvoid *ptr = some_alloc_func();\n\nif (IS_ERR(ptr)) {\n  int err = PTR_ERR(ptr);  // Extract error code\n  pr_err( Alloc failed: %d\\n , err);\n  return err;\n}\n\n/* Creating error pointer (from callee side): */\nreturn ERR_PTR(-ENOMEM);\n\n/* Example: class_create returns error pointer, NOT NULL! */\nstruct class *cls = class_create( myclass );\nif (IS_ERR(cls))\n  return PTR_ERR(cls);  // Don\'t check for NULL!␀ENDCODE␀'},{h:'🧠 THEORY: Kernel Linked Lists',b:'The kernel linked list is **different** from typical textbook linked lists:\n␀CODE␀Textbook (wrong for kernel):\n┌────────────┐  ┌────────────┐  ┌────────────┐\n│ data  │  │ data  │  │ data  │\n│ next ──────┼───>│ next ──────┼───>│ next=NULL  │\n└────────────┘  └────────────┘  └────────────┘\n\nKernel (correct):\nYou EMBED list_head into YOUR struct, not the other way!\n\nstruct my_item {\n  int data;\n  char name[32];\n  struct list_head list;  // <-- Embedded generic list node\n};\n\n  ┌────────────────────┐  ┌────────────────────┐\n  │  struct my_item  │  │  struct my_item  │\n  │  data=42  │  │  data=99  │\n  │  name= hello  │  │  name= world  │\n  │  ┌──────────────┐  │  │  ┌──────────────┐  │\n  │  │  list_head  │  │ ←──→│  │  list_head  │  │ ←──→ (head)\n  │  │  next/prev  │  │  │  │  next/prev  │  │\n  │  └──────────────┘  │  │  └──────────────┘  │\n  └────────────────────┘  └────────────────────┘\n\nTo get from list_head back to my_item → container_of()!␀ENDCODE␀'},{h:'💻 COMPLETE CODE: Kernel List Timer Module',b:'␀CODE␀// File: ~/embedded_learning/day_12/kdata/kdata_module.c\n#include \n#include \n#include \n#include \n#include \n#include \n\nMODULE_LICENSE( GPL );\nMODULE_DESCRIPTION( Kernel lists, timers, and data structures demo );\n\n/* ==== LINKED LIST DEMO ==== */\n\nstruct sensor_reading {\n  int sensor_id;\n  int temperature;  // milli-Celsius\n  unsigned long timestamp;\n  struct list_head list;  // Embedded list node\n};\n\nstatic LIST_HEAD(sensor_list);  // Declare and initialize list head\nstatic int reading_count = 0;\n\nstatic int add_reading(int id, int temp)\n{\n  struct sensor_reading *reading;\n\n  reading = kzalloc(sizeof(*reading), GFP_KERNEL);\n  if (!reading)\n  return -ENOMEM;\n\n  reading->sensor_id = id;\n  reading->temperature = temp;\n  reading->timestamp = jiffies;\n\n  /* Add to end of list */\n  list_add_tail(&reading->list, &sensor_list);\n  reading_count++;\n\n  pr_info( kdata: Added sensor %d: temp=%d.%03d°C\\n ,\n  id, temp / 1000, abs(temp % 1000));\n  return 0;\n}\n\nstatic void print_all_readings(void)\n{\n  struct sensor_reading *reading;\n\n  pr_info( kdata: === All Readings (%d total) ===\\n , reading_count);\n\n  /* list_for_each_entry: iterate over list, extracting struct */\n  list_for_each_entry(reading, &sensor_list, list) {\n  pr_info( kdata:  Sensor %d: %d.%03d°C @ jiffies=%lu\\n ,\n  reading->sensor_id,\n  reading->temperature / 1000,\n  abs(reading->temperature % 1000),\n  reading->timestamp);\n  }\n}\n\nstatic void delete_all_readings(void)\n{\n  struct sensor_reading *reading, *tmp;\n\n  /* list_for_each_entry_safe: safe for deletion during iteration */\n  list_for_each_entry_safe(reading, tmp, &sensor_list, list) {\n  list_del(&reading->list);\n  kfree(reading);\n  reading_count--;\n  }\n\n  pr_info( kdata: All readings deleted\\n );\n}\n\n/* ==== TIMER DEMO ==== */\n\nstatic struct timer_list my_timer;\nstatic int timer_count = 0;\n#define MAX_TIMER_FIRES 5\n\nstatic void timer_callback(struct timer_list *t)\n{\n  timer_count++;\n  pr_info( kdata: Timer fired! Count=%d, jiffies=%lu\\n ,\n  timer_count, jiffies);\n\n  /* Re-arm timer (periodic behavior) */\n  if (timer_count < MAX_TIMER_FIRES) {\n  mod_timer(&my_timer, jiffies + 2 * HZ);  /* 2 seconds */\n  } else {\n  pr_info( kdata: Timer finished (max fires reached)\\n );\n  }\n}\n\n/* ==== MODULE INIT/EXIT ==== */\n\nstatic int __init kdata_init(void)\n{\n  int ret;\n\n  pr_info( kdata: Initializing kernel data structures demo\\n );\n\n  /* Add some sensor readings */\n  ret = add_reading(1, 25500);  // 25.500°C\n  if (ret) goto fail;\n  ret = add_reading(2, 30200);  // 30.200°C\n  if (ret) goto fail_readings;\n  ret = add_reading(1, 26100);  // 26.100°C\n  if (ret) goto fail_readings;\n  ret = add_reading(3, -5300);  // -5.300°C (negative!)\n  if (ret) goto fail_readings;\n\n  print_all_readings();\n\n  /* Check if list is empty */\n  pr_info( kdata: List empty? %s\\n ,\n  list_empty(&sensor_list) ?  yes  :  no );\n\n  /* Setup and start timer */\n  timer_setup(&my_timer, timer_callback, 0);\n  mod_timer(&my_timer, jiffies + HZ);  /* Fire in 1 second */\n  pr_info( kdata: Timer started (1 second interval)\\n );\n\n  pr_info( kdata: Module loaded\\n );\n  return 0;\n\nfail_readings:\n  delete_all_readings();\nfail:\n  return ret;\n}\n\nstatic void __exit kdata_exit(void)\n{\n  /* IMPORTANT: delete timer before freeing anything it might access */\n  del_timer_sync(&my_timer);  /* _sync waits for running callback */\n  pr_info( kdata: Timer cancelled (fired %d times)\\n , timer_count);\n\n  print_all_readings();\n  delete_all_readings();\n\n  pr_info( kdata: Module unloaded\\n );\n}\n\nmodule_init(kdata_init);\nmodule_exit(kdata_exit);␀ENDCODE␀\n␀CODE␀# File: ~/embedded_learning/day_12/kdata/Makefile\nobj-m += kdata_module.o\nKDIR := /lib/modules/$(shell uname -r)/build\nPWD := $(shell pwd)\n\nall:\n  $(MAKE) -C $(KDIR) M=$(PWD) modules\n\nclean:\n  $(MAKE) -C $(KDIR) M=$(PWD) clean\n\nload: all\n  sudo insmod kdata_module.ko\n  sleep 12\n  dmesg | tail -40\n\nunload:\n  sudo rmmod kdata_module\n  dmesg | tail -10␀ENDCODE␀'},{h:'🧠 THEORY: Key Kernel Data Structures',b:'Structure\nHeader\nPurpose\n\n `struct list_head` |\n `linux/list.h` |\n Doubly linked circular list |\n\n `struct hlist_head` |\n `linux/list.h` |\n Hash list (single pointer head) |\n\n `struct rb_node` |\n `linux/rbtree.h` |\n Red-black tree |\n\n `struct timer_list` |\n `linux/timer.h` |\n Kernel timer (softirq context!) |\n\n `struct work_struct` |\n `linux/workqueue.h` |\n Deferred work (process context) |\n\n `struct completion` |\n `linux/completion.h` |\n One-shot synchronization |\n\n `struct kref` |\n `linux/kref.h` |\n Reference counting |'},{h:'🧠 THEORY: Timers Delayed Work',b:'␀CODE␀TIMER (timer_list):\n- Runs in softirq context (CANNOT sleep!)\n- Cannot use mutex, kmalloc(GFP_KERNEL), or I2C/SPI\n- Good for: setting flags, scheduling work, quick checks\n\nDELAYED WORK (delayed_work):\n- Runs in process context (CAN sleep)\n- Can use mutex, kmalloc, device I/O\n- schedule_delayed_work(&work, delay_in_jiffies)\n- Good for: polling devices, periodic I/O\n\nWHICH TO USE?\n- Need to access hardware (I2C/SPI)? → delayed_work\n- Need to sleep/lock? → delayed_work\n- Just incrementing counter, setting flag? → timer\n- In doubt? → delayed_work (safer)␀ENDCODE␀'},{h:'📝 INTERVIEW QUESTIONS — Days 10-13 (14 Questions)',b:'**Q1: Explain the goto cleanup pattern. Why is it used in kernel?**\n\nResources allocated sequentially. On failure at step N, free steps N-1 to 1 in reverse. Goto provides clean, linear code matching kernel coding style. Google s kernel coding guidelines explicitly recommend this.\n\n**Q2: What is the difference between kmalloc and kzalloc?**\n\nkzalloc = kmalloc + memset(0). Always prefer kzalloc for structures — uninitialized memory causes bugs (dangling pointers, garbage values read as valid data).\n\n**Q3: What is GFP_KERNEL vs GFP_ATOMIC?**\n\nGFP_KERNEL: can sleep to reclaim memory. Use in process context. GFP_ATOMIC: cannot sleep. Lower chance of success. Use in interrupt context or while holding spinlock.\n\n**Q4: When would you use vmalloc instead of kmalloc?**\n\nLarge allocations (>128KB) where physical contiguity isn t needed. vmalloc pages are only virtually contiguous. Cannot be used for DMA. Slower than kmalloc due to page table manipulation.\n\n**Q5: What is IS_ERR/PTR_ERR/ERR_PTR?**\n\nPattern for functions returning pointers that can fail. ERR_PTR(-ENOMEM) creates error pointer. IS_ERR(ptr) checks if it s an error. PTR_ERR(ptr) extracts error code. Used by class_create, devm functions, etc. Don t check for NULL — check with IS_ERR!\n\n**Q6: What is devm_kzalloc and why prefer it?**\n\nDevice-managed allocation. Auto-freed when device is removed (remove()) or probe fails. Eliminates memory leaks from forgotten kfree. Part of devm_* family (devm_ioremap, devm_request_irq, etc.).\n\n**Q7: How does the kernel linked list differ from a textbook one?**\n\nKernel list embeds struct list_head INTO your struct (intrusive list). The list mechanism is generic — one implementation works for any struct. Use container_of to recover your struct from list_head pointer. Circular doubly-linked.\n\n**Q8: What is list_for_each_entry_safe and when is it needed?**\n\nIterates over list using a temporary variable. Required when deleting entries during iteration (regular list_for_each_entry would use freed memory). The  safe  version pre-fetches next before your code potentially deletes current.\n\n**Q9: Explain del_timer_sync.**\n\nDeletes timer and waits for any currently running callback to complete. Essential in module_exit — without _sync, you might free memory that the timer callback is still using. Regular del_timer doesn t wait.\n\n**Q10: Timer callback context — what can/can t you do?**\n\nRuns in softirq context (bottom half). CANNOT: sleep, use mutex, call GFP_KERNEL alloc, do I2C/SPI. CAN: set flags, schedule work, increment counters, spin_lock. Solution for heavier work: schedule_work from timer callback.\n\n**Q11: What is container_of and how is it implemented?**\n\n`(type*)((char*)ptr - offsetof(type, member))`. Given pointer to a struct member, computes pointer to containing struct. Foundation of Linux kernel data structures, driver model, subsystem interfaces.\n\n**Q12: What is kref?**\n\nKernel reference counter. `kref_init`: set to 1. `kref_get`: increment. `kref_put(&kref, release_func)`: decrement, call release when 0. Thread-safe (atomic). Used for shared objects (struct device, struct kobject).\n\n**Q13: What is the difference between `timer_setup` and `init_timer`?**\n\n`timer_setup(&timer, callback, flags)` is the modern API (kernel 4.14+). `init_timer` is legacy, requires manual .function and .data assignment. Always use timer_setup.\n\n**Q14: What is `jiffies`?**\n\nGlobal kernel counter, incremented HZ times per second. HZ = 100 (server), 250 (desktop), 1000 (low-latency). `jiffies + HZ` = 1 second from now. Wraps around (~49 days on 32-bit). Use `time_after()`, `time_before()` for comparison to handle wraparound.\n\n  \n  \n  ← PreviousPhase 2: Linux Fundamentals\nNext →Phase 4: Char Driver Project\n  \n  \n  \n\n  \n  ↑'}]},
{id:'04',sec:'char',icon:'💾',title:'Phase 4: Character Driver',secs:[{h:'🧠 THEORY: The Big Picture — How User Reaches Your Driver',b:'␀CODE␀┌─────────────────────────────────────────────────────────────────────┐\n│  USER SPACE  │\n│  │\n│  int fd = open( /dev/mydev , O_RDWR);  │\n│  write(fd,  hello , 5);  │\n│  read(fd, buf, 100);  │\n│  ioctl(fd, MY_CMD, &arg);  │\n│  close(fd);  │\n│  │\n└──────────────────────┬──────────────────────────────────────────────┘\n  │ SYSTEM CALL BOUNDARY\n  ▼\n┌─────────────────────────────────────────────────────────────────────┐\n│  KERNEL SPACE  │\n│  │\n│  ┌──────────────────────────────────────────────────────────┐  │\n│  │  VFS (Virtual File System)  │  │\n│  │  - Resolves path → inode (device file)  │  │\n│  │  - inode has major:minor numbers  │  │\n│  │  - Looks up struct cdev by major number  │  │\n│  │  - Gets file_operations from cdev  │  │\n│  └────────────────────────┬─────────────────────────────────┘  │\n│  ▼  │\n│  ┌──────────────────────────────────────────────────────────┐  │\n│  │  YOUR DRIVER  │  │\n│  │  struct file_operations {  │  │\n│  │  .open  = my_open,  ← fd = open()  │  │\n│  │  .read  = my_read,  ← read(fd, ...)  │  │\n│  │  .write  = my_write,  ← write(fd, ...)  │  │\n│  │  .release  = my_release,  ← close(fd)  │  │\n│  │  .unlocked_ioctl = my_ioctl, ← ioctl(fd, ...)  │  │\n│  │  .llseek  = my_llseek,  ← lseek(fd, ...)  │  │\n│  │  };  │  │\n│  └──────────────────────────────────────────────────────────┘  │\n│  │\n│  YOUR DATA:  │\n│  struct my_device {  │\n│  struct cdev cdev;  // Registered char device  │\n│  char *buffer;  // Device data buffer  │\n│  size_t size;  // Current data size  │\n│  struct mutex lock;  // Concurrent access protection  │\n│  };  │\n│  │\n└─────────────────────────────────────────────────────────────────────┘␀ENDCODE␀'},{h:'🧠 THEORY: Device Numbers',b:'␀CODE␀Device Number (dev_t) = 32-bit value\n┌──────────────────┬──────────────────┐\n│  MAJOR (12)  │  MINOR (20)  │\n├──────────────────┼──────────────────┤\n│  Identifies  │  Identifies  │\n│  the DRIVER  │  specific DEVICE  │\n│  │  instance  │\n└──────────────────┴──────────────────┘\n\nMAJOR  number → which driver handles this device\nMINOR  number → which instance (driver decides meaning)\n\nExample: /dev/ttyS0 has major=4, minor=64\n  /dev/ttyS1 has major=4, minor=65\n  Same driver (major=4), different ports (minor 64,65)\n\nAPIs:\nMKDEV(major, minor)  → creates dev_t\nMAJOR(dev)  → extracts major\nMINOR(dev)  → extracts minor␀ENDCODE␀'},{h:'🧠 THEORY: Key Structures Deep Dive',b:'struct file — Represents an OPEN file\n␀CODE␀struct file {\n  loff_t  f_pos;  // Current read/write position\n  unsigned int  f_flags;  // O_RDONLY, O_NONBLOCK, etc.\n  fmode_t  f_mode;  // FMODE_READ, FMODE_WRITE\n  const struct file_operations *f_op;  // ops table\n  void  *private_data;  // YOUR PER-OPEN DATA HERE\n  struct inode  *f_inode;  // The inode (device)\n};\n// NOTE: Multiple opens = multiple struct file, each with own f_pos␀ENDCODE␀\nstruct inode — Represents a FILE on filesystem\n␀CODE␀struct inode {\n  dev_t  i_rdev;  // Major:minor for devices\n  struct cdev  *i_cdev;  // Pointer to your cdev (for char devices)\n  // ...\n};\n// NOTE: One inode per device, shared across all opens\n// Use i_cdev + container_of to find your device struct␀ENDCODE␀'},{h:'🧠 THEORY: copy_to_user / copy_from_user — WHY They Exist',b:'␀CODE␀DANGER: You\'re in kernel space, user passed a pointer.\nWhat if the pointer is invalid (NULL, points to kernel space, unmapped)?\n\nDirect memcpy(kernel_dst, user_src, len):\n  → If user_src is bad → KERNEL CRASH (oops)\n  → If user_src points to kernel memory → SECURITY HOLE\n\ncopy_from_user(kernel_dst, user_src, len):\n  → Validates user address range\n  → Handles page faults (page might be swapped out)\n  → Returns bytes NOT copied (0 = all OK)\n  → If bad address → returns non-zero, no crash\n\nALWAYS use copy_to_user / copy_from_user for user↔kernel transfer!␀ENDCODE␀'},{h:'💻 THE DRIVER — Production Quality',b:'␀CODE␀// File: ~/embedded_learning/day_15/chardev/chardev.c\n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n\nMODULE_LICENSE( GPL );\nMODULE_AUTHOR( Your Name );\nMODULE_DESCRIPTION( Production character device driver );\nMODULE_VERSION( 2.0 );\n\n/* ==== IOCTL COMMAND DEFINITIONS ==== */\n/*\n * _IO(magic, nr)  - no data transfer\n * _IOR(magic, nr, type)  - read FROM driver (driver → user)\n * _IOW(magic, nr, type)  - write TO driver (user → driver)\n * _IOWR(magic, nr, type) - bidirectional\n */\n#define CHARDEV_IOC_MAGIC \'C\'\n#define CHARDEV_IOCRESET  _IO(CHARDEV_IOC_MAGIC, 0)\n#define CHARDEV_IOCGSIZE  _IOR(CHARDEV_IOC_MAGIC, 1, int)\n#define CHARDEV_IOCSDBG  _IOW(CHARDEV_IOC_MAGIC, 2, int)\n#define CHARDEV_IOCGDBG  _IOR(CHARDEV_IOC_MAGIC, 3, int)\n#define CHARDEV_IOC_MAXNR  3\n\n/* ==== DRIVER CONFIGURATION ==== */\n#define DEVICE_NAME  chardev \n#define CLASS_NAME  chardev_class \n#define BUFFER_SIZE  4096\n#define MAX_DEVICES  4\n\n/* ==== PER-DEVICE DATA ==== */\nstruct chardev_data {\n  struct cdev cdev;\n  struct device *device;\n  char *buffer;\n  size_t size;  // Current data size in buffer\n  size_t buffer_size;  // Total buffer capacity\n  struct mutex lock;\n  int debug_level;\n  int open_count;  // Track number of opens\n  int minor;\n};\n\n/* ==== GLOBAL DRIVER DATA ==== */\nstatic dev_t dev_num;  // First device number\nstatic struct class *chardev_class;\nstatic struct chardev_data devices[MAX_DEVICES];\nstatic int device_count = MAX_DEVICES;\n\nmodule_param(device_count, int, S_IRUGO);\nMODULE_PARM_DESC(device_count,  Number of devices to create (1-4) );\n\n/* ==== FILE OPERATIONS ==== */\n\n/*\n * OPEN handler\n * Called when user does open( /dev/chardevN )\n * Key job: find per-device data, store in private_data\n */\nstatic int chardev_open(struct inode *inode, struct file *filp)\n{\n  struct chardev_data *dev;\n\n  /* THE container_of pattern — critical for multi-device support */\n  dev = container_of(inode->i_cdev, struct chardev_data, cdev);\n  filp->private_data = dev;\n\n  if (mutex_lock_interruptible(&dev->lock))\n  return -ERESTARTSYS;\n\n  dev->open_count++;\n\n  if (dev->debug_level)\n  dev_info(dev->device,  Device opened (count=%d, flags=0x%x)\\n ,\n  dev->open_count, filp->f_flags);\n\n  mutex_unlock(&dev->lock);\n  return 0;\n}\n\n/*\n * RELEASE handler\n * Called when last fd to this file is closed\n */\nstatic int chardev_release(struct inode *inode, struct file *filp)\n{\n  struct chardev_data *dev = filp->private_data;\n\n  mutex_lock(&dev->lock);\n  dev->open_count--;\n\n  if (dev->debug_level)\n  dev_info(dev->device,  Device closed (count=%d)\\n , dev->open_count);\n\n  mutex_unlock(&dev->lock);\n  return 0;\n}\n\n/*\n * READ handler\n * User calls: ssize_t n = read(fd, buf, count);\n * We must: copy data from device buffer to user buffer\n *\n * Parameters:\n *  filp  - open file instance\n *  buf  - USER SPACE buffer (must use copy_to_user!)\n *  count - bytes requested\n *  ppos  - pointer to file position (updated for next read)\n */\nstatic ssize_t chardev_read(struct file *filp, char __user *buf,\n  size_t count, loff_t *ppos)\n{\n  struct chardev_data *dev = filp->private_data;\n  ssize_t retval;\n\n  if (mutex_lock_interruptible(&dev->lock))\n  return -ERESTARTSYS;\n\n  /* Check if past end of data */\n  if (*ppos >= dev->size) {\n  retval = 0;  /* EOF */\n  goto out;\n  }\n\n  /* Don\'t read past end */\n  if (*ppos + count > dev->size)\n  count = dev->size - *ppos;\n\n  /* Transfer to user space — THE critical operation */\n  if (copy_to_user(buf, dev->buffer + *ppos, count)) {\n  retval = -EFAULT;\n  goto out;\n  }\n\n  *ppos += count;\n  retval = count;\n\n  if (dev->debug_level > 1)\n  dev_info(dev->device,  Read %zu bytes from pos %lld\\n , count, *ppos - count);\n\nout:\n  mutex_unlock(&dev->lock);\n  return retval;\n}\n\n/*\n * WRITE handler\n * User calls: ssize_t n = write(fd, data, len);\n * We must: copy data from user buffer to device buffer\n */\nstatic ssize_t chardev_write(struct file *filp, const char __user *buf,\n  size_t count, loff_t *ppos)\n{\n  struct chardev_data *dev = filp->private_data;\n  ssize_t retval;\n\n  if (mutex_lock_interruptible(&dev->lock))\n  return -ERESTARTSYS;\n\n  /* Check buffer overflow */\n  if (*ppos + count > dev->buffer_size)\n  count = dev->buffer_size - *ppos;\n\n  if (count == 0) {\n  retval = -ENOSPC;\n  goto out;\n  }\n\n  /* Transfer from user space */\n  if (copy_from_user(dev->buffer + *ppos, buf, count)) {\n  retval = -EFAULT;\n  goto out;\n  }\n\n  *ppos += count;\n\n  /* Update size if we wrote past current end */\n  if (*ppos > dev->size)\n  dev->size = *ppos;\n\n  retval = count;\n\n  if (dev->debug_level > 1)\n  dev_info(dev->device,  Wrote %zu bytes at pos %lld\\n , count, *ppos - count);\n\nout:\n  mutex_unlock(&dev->lock);\n  return retval;\n}\n\n/*\n * LLSEEK handler\n * User calls: off_t pos = lseek(fd, offset, whence);\n */\nstatic loff_t chardev_llseek(struct file *filp, loff_t offset, int whence)\n{\n  struct chardev_data *dev = filp->private_data;\n  loff_t new_pos;\n\n  mutex_lock(&dev->lock);\n\n  switch (whence) {\n  case SEEK_SET:\n  new_pos = offset;\n  break;\n  case SEEK_CUR:\n  new_pos = filp->f_pos + offset;\n  break;\n  case SEEK_END:\n  new_pos = dev->size + offset;\n  break;\n  default:\n  mutex_unlock(&dev->lock);\n  return -EINVAL;\n  }\n\n  if (new_pos  dev->buffer_size) {\n  mutex_unlock(&dev->lock);\n  return -EINVAL;\n  }\n\n  filp->f_pos = new_pos;\n  mutex_unlock(&dev->lock);\n  return new_pos;\n}\n\n/*\n * IOCTL handler\n * For device-specific control commands\n */\nstatic long chardev_ioctl(struct file *filp, unsigned int cmd, unsigned long arg)\n{\n  struct chardev_data *dev = filp->private_data;\n  int retval = 0;\n  int tmp;\n\n  /* Verify magic number */\n  if (_IOC_TYPE(cmd) != CHARDEV_IOC_MAGIC)\n  return -ENOTTY;\n  if (_IOC_NR(cmd) > CHARDEV_IOC_MAXNR)\n  return -ENOTTY;\n\n  if (mutex_lock_interruptible(&dev->lock))\n  return -ERESTARTSYS;\n\n  switch (cmd) {\n  case CHARDEV_IOCRESET:\n  /* Reset device buffer */\n  memset(dev->buffer, 0, dev->buffer_size);\n  dev->size = 0;\n  dev_info(dev->device,  Device reset via ioctl\\n );\n  break;\n\n  case CHARDEV_IOCGSIZE:\n  /* Get current data size */\n  tmp = dev->size;\n  if (copy_to_user((int __user *)arg, &tmp, sizeof(int)))\n  retval = -EFAULT;\n  break;\n\n  case CHARDEV_IOCSDBG:\n  /* Set debug level */\n  if (copy_from_user(&tmp, (int __user *)arg, sizeof(int))) {\n  retval = -EFAULT;\n  } else {\n  dev->debug_level = tmp;\n  dev_info(dev->device,  Debug level set to %d\\n , tmp);\n  }\n  break;\n\n  case CHARDEV_IOCGDBG:\n  /* Get debug level */\n  tmp = dev->debug_level;\n  if (copy_to_user((int __user *)arg, &tmp, sizeof(int)))\n  retval = -EFAULT;\n  break;\n\n  default:\n  retval = -ENOTTY;\n  break;\n  }\n\n  mutex_unlock(&dev->lock);\n  return retval;\n}\n\nstatic struct file_operations chardev_fops = {\n  .owner  = THIS_MODULE,\n  .open  = chardev_open,\n  .release  = chardev_release,\n  .read  = chardev_read,\n  .write  = chardev_write,\n  .llseek  = chardev_llseek,\n  .unlocked_ioctl = chardev_ioctl,\n};\n\n/* ==== SYSFS ATTRIBUTES ==== */\n\n/* Read-only attribute: current data size */\nstatic ssize_t size_show(struct device *dev, struct device_attribute *attr, char *buf)\n{\n  struct chardev_data *cdev_data = dev_get_drvdata(dev);\n  return scnprintf(buf, PAGE_SIZE,  %zu\\n , cdev_data->size);\n}\nstatic DEVICE_ATTR_RO(size);\n\n/* Read-write attribute: debug level */\nstatic ssize_t debug_show(struct device *dev, struct device_attribute *attr, char *buf)\n{\n  struct chardev_data *cdev_data = dev_get_drvdata(dev);\n  return scnprintf(buf, PAGE_SIZE,  %d\\n , cdev_data->debug_level);\n}\n\nstatic ssize_t debug_store(struct device *dev, struct device_attribute *attr,\n  const char *buf, size_t count)\n{\n  struct chardev_data *cdev_data = dev_get_drvdata(dev);\n  int level;\n\n  if (kstrtoint(buf, 10, &level))\n  return -EINVAL;\n\n  cdev_data->debug_level = level;\n  return count;\n}\nstatic DEVICE_ATTR_RW(debug);\n\nstatic struct attribute *chardev_attrs[] = {\n  &dev_attr_size.attr,\n  &dev_attr_debug.attr,\n  NULL,\n};\n\nATTRIBUTE_GROUPS(chardev);\n\n/* ==== MODULE INIT/EXIT ==== */\n\nstatic int __init chardev_init(void)\n{\n  int ret, i;\n\n  pr_info( chardev: Initializing (%d devices)\\n , device_count);\n\n  if (device_count  MAX_DEVICES) {\n  pr_err( chardev: Invalid device_count %d\\n , device_count);\n  return -EINVAL;\n  }\n\n  /* Step 1: Allocate device number range */\n  ret = alloc_chrdev_region(&dev_num, 0, device_count, DEVICE_NAME);\n  if (ret minor = i;\n  dev->debug_level = 0;\n  dev->open_count = 0;\n  dev->buffer_size = BUFFER_SIZE;\n  mutex_init(&dev->lock);\n\n  /* Allocate buffer */\n  dev->buffer = kzalloc(BUFFER_SIZE, GFP_KERNEL);\n  if (!dev->buffer) {\n  ret = -ENOMEM;\n  goto fail_devices;\n  }\n\n  /* Initialize and add cdev */\n  cdev_init(&dev->cdev, &chardev_fops);\n  dev->cdev.owner = THIS_MODULE;\n  ret = cdev_add(&dev->cdev, this_dev, 1);\n  if (ret) {\n  kfree(dev->buffer);\n  goto fail_devices;\n  }\n\n  /* Create device node (/dev/chardevN) */\n  dev->device = device_create(chardev_class, NULL, this_dev,\n  dev,  chardev%d , i);\n  if (IS_ERR(dev->device)) {\n  ret = PTR_ERR(dev->device);\n  cdev_del(&dev->cdev);\n  kfree(dev->buffer);\n  goto fail_devices;\n  }\n\n  /* Create sysfs attributes */\n  ret = sysfs_create_groups(&dev->device->kobj, chardev_groups);\n  if (ret)\n  dev_warn(dev->device,  Failed to create sysfs attrs\\n );\n\n  dev_info(dev->device,  Created chardev%d (major=%d, minor=%d)\\n ,\n  i, MAJOR(this_dev), MINOR(this_dev));\n  }\n\n  pr_info( chardev: Driver loaded successfully (%d devices)\\n , device_count);\n  return 0;\n\nfail_devices:\n  /* Clean up already-created devices */\n  for (i = i - 1; i >= 0; i--) {\n  struct chardev_data *dev = &devices[i];\n  dev_t this_dev = MKDEV(MAJOR(dev_num), MINOR(dev_num) + i);\n  sysfs_remove_groups(&dev->device->kobj, chardev_groups);\n  device_destroy(chardev_class, this_dev);\n  cdev_del(&dev->cdev);\n  kfree(dev->buffer);\n  }\n  class_destroy(chardev_class);\nfail_region:\n  unregister_chrdev_region(dev_num, device_count);\n  return ret;\n}\n\nstatic void __exit chardev_exit(void)\n{\n  int i;\n\n  for (i = 0; i device->kobj, chardev_groups);\n  device_destroy(chardev_class, this_dev);\n  cdev_del(&dev->cdev);\n  kfree(dev->buffer);\n  mutex_destroy(&dev->lock);\n  }\n\n  class_destroy(chardev_class);\n  unregister_chrdev_region(dev_num, device_count);\n\n  pr_info( chardev: Driver unloaded\\n );\n}\n\nmodule_init(chardev_init);\nmodule_exit(chardev_exit);␀ENDCODE␀'},{h:'💻 MAKEFILE',b:'␀CODE␀# File: ~/embedded_learning/day_15/chardev/Makefile\nobj-m += chardev.o\nKDIR := /lib/modules/$(shell uname -r)/build\nPWD := $(shell pwd)\n\nall:\n  $(MAKE) -C $(KDIR) M=$(PWD) modules\n\nclean:\n  $(MAKE) -C $(KDIR) M=$(PWD) clean\n\nload: all\n  sudo insmod chardev.ko device_count=2\n  dmesg | tail -10\n\nunload:\n  sudo rmmod chardev\n  dmesg | tail -5\n\ntest: all load\n  @echo  === Test Application === \n  gcc -Wall -o test_app test_app.c\n  sudo ./test_app\n  @echo  === Check dmesg === \n  dmesg | tail -20␀ENDCODE␀'},{h:'💻 TEST APPLICATION',b:'␀CODE␀// File: ~/embedded_learning/day_15/chardev/test_app.c\n#include \n#include \n#include \n#include \n#include \n#include \n\n/* Must match driver definitions */\n#define CHARDEV_IOC_MAGIC \'C\'\n#define CHARDEV_IOCRESET  _IO(CHARDEV_IOC_MAGIC, 0)\n#define CHARDEV_IOCGSIZE  _IOR(CHARDEV_IOC_MAGIC, 1, int)\n#define CHARDEV_IOCSDBG  _IOW(CHARDEV_IOC_MAGIC, 2, int)\n\nint main() {\n  int fd, ret;\n  char write_buf[] =  Hello from userspace! Testing char driver. ;\n  char read_buf[256] = {0};\n  int size, debug;\n\n  printf( === chardev Test Application ===\\n\\n );\n\n  /* Open device */\n  fd = open( /dev/chardev0 , O_RDWR);\n  if (fd  0 ?  PASS  :  FAIL , ret);\n\n  /* Get size via ioctl */\n  ret = ioctl(fd, CHARDEV_IOCGSIZE, &size);\n  printf( [%s] Buffer size = %d bytes\\n , ret == 0 ?  PASS  :  FAIL , size);\n\n  /* Seek back to start */\n  lseek(fd, 0, SEEK_SET);\n\n  /* Read */\n  ret = read(fd, read_buf, sizeof(read_buf) - 1);\n  read_buf[ret] = \'\\0\';\n  printf( [%s] Read %d bytes: \'%s\'\\n , ret > 0 ?  PASS  :  FAIL , ret, read_buf);\n\n  /* Verify */\n  if (strcmp(write_buf, read_buf) == 0) {\n  printf( [PASS] Data integrity verified!\\n );\n  } else {\n  printf( [FAIL] Data mismatch!\\n );\n  }\n\n  /* Reset device */\n  ret = ioctl(fd, CHARDEV_IOCRESET);\n  printf( [%s] Device reset\\n , ret == 0 ?  PASS  :  FAIL );\n\n  /* Verify reset */\n  ioctl(fd, CHARDEV_IOCGSIZE, &size);\n  printf( [%s] After reset: size=%d (expected 0)\\n ,\n  size == 0 ?  PASS  :  FAIL , size);\n\n  /* Test sysfs */\n  printf( \\n=== Sysfs Test ===\\n );\n  FILE *f = fopen( /sys/class/chardev_class/chardev0/size ,  r );\n  if (f) {\n  char sysfs_buf[32];\n  fgets(sysfs_buf, sizeof(sysfs_buf), f);\n  printf( [PASS] Sysfs size = %s , sysfs_buf);\n  fclose(f);\n  } else {\n  printf( [SKIP] Sysfs file not found\\n );\n  }\n\n  close(fd);\n  printf( \\n=== All tests complete ===\\n );\n  return 0;\n}␀ENDCODE␀'},{h:'🏗️ MINI-EXERCISES — Days 14-22',b:'• **Exercise 14.1**: Add a `poll()` implementation. Test with `select()` from userspace.\n\n• **Exercise 14.2**: Add exclusive open — only one fd at a time. Return `-EBUSY` for second open.\n\n• **Exercise 14.3**: Implement `O_NONBLOCK` support in read (return `-EAGAIN` instead of blocking when no data).\n\n• **Exercise 14.4**: Add an ioctl to get driver version string.\n\n• **Exercise 14.5**: Create a second test that opens chardev0 and chardev1 simultaneously, writes different data, verifies each returns correct data.'},{h:'⚠️ COMMON PITFALLS — Character Driver',b:'Pitfall\nWhy\nFix\n\n Missing copy_to/from_user |\n Direct user pointer access → crash |\n Always use copy_to/from_user |\n\n Not using IS_ERR for class_create |\n Returns error pointer, not NULL |\n Check with IS_ERR() |\n\n Forgetting mutex in ioctl |\n Race with read/write |\n Lock in every file op |\n\n Wrong cleanup order |\n Resources depend on each other |\n Reverse order of allocation |\n\n Not checking copy_to_user return |\n Partial copy silently drops data |\n Check != 0, return -EFAULT |\n\n Setting private_data to wrong ptr |\n Wrong container_of |\n Verify with manual calculation |'},{h:'📝 INTERVIEW QUESTIONS — Character Driver (15 Questions)',b:'**Q1: Walk me through your character driver s open path.**\n\nUser calls open( /dev/chardev0 ). VFS resolves to inode with major:minor. Finds our cdev via major number. Calls our .open(inode, filp). We use container_of(inode->i_cdev, struct chardev_data, cdev) to find per-device data. Store in filp->private_data. Increment open counter. Return 0.\n\n**Q2: Why use container_of instead of a global pointer?**\n\nGlobal works for one device. container_of supports multiple instances — each has its own embedded cdev. This is the standard Linux driver pattern for scalability.\n\n**Q3: What does copy_to_user return?**\n\nNumber of bytes NOT copied. 0 = success. Non-zero = couldn t copy everything (bad address, page fault). If non-zero, return -EFAULT.\n\n**Q4: Why mutex_lock_interruptible instead of mutex_lock?**\n\nInterruptible allows user to Ctrl+C out of a blocked operation. Returns -ERESTARTSYS which tells VFS to either restart the syscall or return -EINTR. Without it, user can t kill stuck process.\n\n**Q5: What is the difference between read count, *ppos, and dev->size?**\n\ncount: bytes user wants. _ppos: current position in file. dev->size: total data in buffer. Driver must: clamp count to min(count, dev->size - _ppos), advance *ppos by actual bytes read.\n\n**Q6: How does IOCTL numbering work?**\n\nMagic 8 bits + number 8 bits + direction 2 bits + size 14 bits. _IO: no data. _IOR: driver→user (Get). _IOW: user→driver (Set). _IOWR: both. Unique magic avoids collision.\n\n**Q7: What is release() vs close()?**\n\nrelease() is called when the LAST fd referencing this file object is closed. If process forks, child inherits fd — close(fd) in parent doesn t call release yet. Only when both parent and child close their fds does release fire.\n\n**Q8: Should you use sysfs or ioctl for device configuration?**\n\nSysfs: simple values, one value per file, readable without special tools, discoverable. Ioctl: complex data, binary protocols, backward compatibility. Modern preference: sysfs for new interfaces.\n\n**Q9: Why `.owner = THIS_MODULE` in file_operations?**\n\nPrevents module unloading while device is open. When file is opened, module reference count increments. rmmod fails with  Module in use . Without it, removing module while in use → crash.\n\n**Q10: How do you handle write at arbitrary position?**\n\nCheck `*ppos + count <= buffer_size`. If writing past current size, update dev->size = *ppos + count (like extending file). Return -ENOSPC if no room.\n\n**Q11: Your read returns 0. What does this mean to the user?**\n\nEOF. User s read() returns 0, ending read loops. This should ONLY happen when *ppos >= dev->size. Returning 0 mid-data would prematurely end reads.\n\n**Q12: How do you test your driver for race conditions?**\n\n• Open device from multiple threads simultaneously. 2. Use ThreadSanitizer for userspace test app. 3. Enable lockdep in kernel (CONFIG_PROVE_LOCKING). 4. Stress test: rapid open/close/read/write from many processes.\n\n**Q13: What if your driver needs to notify userspace of events?**\n\nImplement `.poll()` → enables `select()`/`poll()`/`epoll()` in userspace. Alternative: fasync for signal-based notification. Or: blocking read with wait_event_interruptible.\n\n**Q14: How would you add DMA support to your chardev?**\n\n• Allocate DMA buffer: `dma_alloc_coherent()`. 2. Implement `.mmap()` to map DMA buffer to userspace. 3. On write: DMA from user buffer to device. 4. On read: DMA from device to user buffer. 5. Use DMA completion interrupt.\n\n**Q15: How do you version your driver s IOCTL interface?**\n\nUse unique magic number. Add version query ioctl. Document ABI. Never change existing command semantics. Use new command numbers for new features. Return -ENOTTY for unknown commands.\n\n  \n  \n  ← PreviousPhase 3: Kernel Modules\nNext →Phase 5: Device Tree & Platform\n  \n  \n  \n\n  \n  ↑'}]},
