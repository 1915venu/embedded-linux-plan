  <div style="font-family:var(--mono);font-size:.7rem;color:var(--text-dim);margin:.4rem 0 .9rem;letter-spacing:.04em">📚 THEORY GUIDES</div>
  <div class="theory-grid fu">`;
  THEORY.forEach(t=>{
    h+=`<div class="tcard" onclick="showTheory('${t.id}')">
      <div class="ic">${t.icon}</div>
      <div class="ti">${t.title}</div>
      <div class="ct">${t.secs.length} sections</div>
    </div>`;
  });
  h+=`</div>
  <div class="kbh fu"><span><kbd>Space</kbd> flip card</span><span><kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate</span><span><kbd>1</kbd> Know <kbd>2</kbd> Shaky <kbd>3</kbd> Review</span></div>`;

function showTheory(id){
  const t=THEORY.find(x=>x.id===id);
  if(!t)return;
  curTheory=id; setNav('theory');
  let h=`<div class="treader fu">

    h+=`<div class="t-section" id="${sid}">
      <div class="t-sh" onclick="document.getElementById('${sid}').classList.toggle('open')">

function startMode(m){
  curMode=m;setNav(m);
  if(m==='lessons')renderLessons();
  else if(m==='flash'){fcIdx=0;fcFlip=false;renderFlash();}
  else if(m==='quiz'){qIdx=0;qScore=0;qAnswered=false;renderQuiz();}
  else if(m==='timer'){fcIdx=0;fcFlip=false;tSec=20;stopTimer();renderTimer();}
}

function fbar(){
  let h=`<div class="filters"><button class="chip ${!curSec?'active':''}" onclick="curSec=null;startMode('${curMode}')">All ${Q.length}</button>`;
  SECTIONS.forEach(s=>{
    const n=Q.filter(q=>q.s===s.id).length;

  });
  return h+`</div>`;
}
function mbar(a){
  return `<div class="mode-bar">${[['lessons','📖 Lessons'],['flash','🃏 Flash'],['quiz','❓ Quiz'],['timer','⏱ Timed']].map(([id,l])=>`<button class="mbn${a===id?' active':''}" onclick="startMode('${id}')">${l}</button>`).join('')}</div>`;

/* ── QUIZ ── */
function renderQuiz(){
  const list=glist();
  if(!list.length){document.getElementById('app').innerHTML=fbar()+mbar('quiz')+'<p style="text-align:center;padding:3rem">No questions.</p>';return;}
  if(qIdx>=list.length){renderQScore(list);return;}
  const q=list[qIdx];const gidx=gi(q);
  const others=Q.filter(x=>x!==q).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.a);
  const opts=[q.a,...others].sort(()=>Math.random()-.5);
  const ci=opts.indexOf(q.a);
  document.getElementById('app').innerHTML=`${fbar()}${mbar('quiz')}
  <div class="fc-prog"><span>Q ${qIdx+1} / ${list.length}</span><div class="bar"><div class="bf" style="width:${Math.round(qIdx/list.length*100)}%"></div></div><span style="color:var(--green)">${qScore} correct</span></div>
  <div class="qcard fu">
    <div class="qq">${esc(q.q)}</div>
    <div class="qopts">${opts.map((o,i)=>`<button class="qo" onclick="qA(${i},${ci},${gidx})">${esc(o)}</button>`).join('')}</div>
    <div id="q-reveal"></div>
  </div>`;
}
function qA(picked,correct,gidx){
  if(qAnswered)return;qAnswered=true;
  document.querySelectorAll('.qo').forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===correct)b.classList.add('correct');
    else if(i===picked)b.classList.add('wrong');
  });
  if(picked===correct){qScore++;R[gidx]='know';}else{R[gidx]='miss';}
  saveR();
  const q=Q[gidx];
  document.getElementById('q-reveal').innerHTML=`<div class="q-reveal"><strong>Full answer:</strong> ${esc(q.d)}<br><br><em style="color:var(--purple)">Follow-ups: ${q.f.map(esc).join(' &middot; ')}</em></div>`;
  setTimeout(()=>{qIdx++;qAnswered=false;renderQuiz();},2600);
}
function renderQScore(list){
  const pct=Math.round(qScore/list.length*100);
  document.getElementById('app').innerHTML=`${fbar()}${mbar('quiz')}
  <div class="qcard q-score fu">
    <div class="big">${pct}%</div>
    <p style="margin:.5rem 0;color:var(--text-dim)">${qScore} / ${list.length} correct</p>
    <p style="font-size:.82rem;color:var(--text-dim);margin:.5rem 0">${pct>=80?'Excellent! Ready for interviews.':pct>=60?'Good progress! Keep going.':'Keep reviewing your weak spots.'}</p>
    <button class="mbn" style="margin-top:1.2rem" onclick="qIdx=0;qScore=0;renderQuiz()">Try Again</button>
  </div>`;
}

  const sec=SECTIONS.find(s=>s.id===q.s)||{icon:'📌',title:''};
  document.getElementById('app').innerHTML=`${fbar()}${mbar('timer')}
  <div class="timer-wrap">
    <button class="tbtn" onclick="tSec=20;stopTimer();updT()">20s</button>
    <button class="tbtn" onclick="tSec=60;stopTimer();updT()">60s</button>
    <button class="tbtn" onclick="tSec=90;stopTimer();updT()">90s</button>
    <div class="t-display${tSec<=0?' exp':''}" id="t-display">${fmt(tSec)}</div>
    <button class="tbtn" onclick="toggleTimer()">${tRunning?'&#9208; Pause':'&#9654; Start'}</button>
    <button class="tbtn" onclick="tSec=20;stopTimer();updT()">&#8634;</button>
  </div>
  <div class="t-hint">Say your answer aloud within the time limit, then flip to compare.</div>
  <div class="fcc">
    <div class="fc-prog"><span>${idx+1} / ${list.length}</span><div class="bar"><div class="bf" style="width:${Math.round((idx+1)/list.length*100)}%"></div></div></div>
    <div class="fc-card ${fcFlip?'flipped':''}" onclick="fcFlip=!fcFlip;renderTimer()">
      <div class="fc-face fc-front">
        <span class="fc-tag">${sec.icon} ${sec.title}</span>
        <div class="fc-lbl">Say your answer aloud &rarr;</div>
        <div class="fc-q">${esc(q.q)}</div>
      </div>
      <div class="fc-face fc-back">
        <span class="fc-tag">${sec.icon} ${sec.title}</span>
        <div class="fc-lbl">Short Answer</div>
        <div class="fc-a"><strong>${esc(q.a)}</strong></div>
        <div class="fc-deep">${esc(q.d)}</div>
      </div>
    </div>
    <div class="fc-actions">
      <button class="rb know" onclick="R[${gidx}]='know';saveR();tNext(${list.length})">&#10003; Nailed it</button>
      <button class="rb shaky" onclick="R[${gidx}]='shaky';saveR();tNext(${list.length})">~ Partial</button>
      <button class="rb miss" onclick="R[${gidx}]='miss';saveR();tNext(${list.length})">&#10007; Missed</button>
    </div>
    <div class="fc-nav">
      <button onclick="if(fcIdx>0){fcIdx--;fcFlip=false;tSec=20;stopTimer();renderTimer()}" ${idx===0?'disabled':''}>&#8592; Prev</button>
      <button onclick="tNext(${list.length})" ${idx>=list.length-1?'disabled':''}>Next &#8594;</button>
    </div>
  </div>`;
}
function tNext(len){if(fcIdx<len-1){fcIdx++;fcFlip=false;}tSec=20;stopTimer();renderTimer();}
function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function updT(){const el=document.getElementById('t-display');if(el){el.textContent=fmt(tSec);el.className='t-display'+(tSec<=0?' exp':'');}}
function toggleTimer(){if(tRunning)stopTimer();else{tRunning=true;tTimer=setInterval(()=>{tSec=Math.max(0,tSec-1);updT();if(tSec<=0)stopTimer();},1000);renderTimer();}}
function stopTimer(){tRunning=false;clearInterval(tTimer);}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(curMode==='flash'||curMode==='timer'){
    const list=glist();const idx=fcIdx%list.length;const q=list[idx];const gidx=gi(q);
    const re=curMode==='flash'?renderFlash:renderTimer;
    if(e.code==='Space'){e.preventDefault();fcFlip=!fcFlip;re();}
    if(e.code==='ArrowRight'){if(fcIdx<list.length-1){fcIdx++;fcFlip=false;}re();}
    if(e.code==='ArrowLeft'){if(fcIdx>0){fcIdx--;fcFlip=false;}re();}
    if(e.key==='1'){R[gidx]='know';saveR();if(fcIdx<list.length-1){fcIdx++;fcFlip=false;}re();}
    if(e.key==='2'){R[gidx]='shaky';saveR();if(fcIdx<list.length-1){fcIdx++;fcFlip=false;}re();}
    if(e.key==='3'){R[gidx]='miss';saveR();if(fcIdx<list.length-1){fcIdx++;fcFlip=false;}re();}
  }
});
showHome();

</script>
</body>
</html>
