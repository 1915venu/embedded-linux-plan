<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL:study — Embedded Linux Prep</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14;--bg-panel:#0d1117;--bg-card:#131921;--bg-hover:#1a2233;
  --border:#1e2a3a;--border-lit:#2d4a6f;--text:#c5cdd8;--text-dim:#5a6a7e;
  --text-bright:#eef1f5;--green:#00e08e;--green-dim:rgba(0,224,142,.12);
  --amber:#ffb020;--amber-dim:rgba(255,176,32,.12);--red:#ff4d6a;
  --red-dim:rgba(255,77,106,.12);--blue:#3b9eff;--blue-dim:rgba(59,158,255,.1);
  --purple:#b58aff;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;--r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;height:52px;gap:.4rem;padding:0 1.2rem;overflow-x:auto}
.logo{font-family:var(--mono);font-weight:700;font-size:.9rem;color:var(--green);cursor:pointer;white-space:nowrap;margin-right:.4rem}
.logo span{color:var(--text-dim);font-weight:400}
nav{display:flex;gap:.2rem}
nav button{font-family:var(--font);font-size:.78rem;font-weight:500;padding:.35rem .7rem;border:1px solid transparent;border-radius:6px;background:none;color:var(--text-dim);cursor:pointer;transition:all .15s;white-space:nowrap}
nav button:hover{color:var(--text);background:var(--bg-hover)}
nav button.active{color:var(--green);background:var(--green-dim);border-color:rgba(0,224,142,.2)}
.main{max-width:860px;margin:0 auto;padding:1.5rem 1.2rem}
.hero{text-align:center;padding:2rem 0 1.5rem}
.hero h1{font-size:1.75rem;font-weight:700;color:var(--text-bright);letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{color:var(--text-dim);font-size:.88rem;margin-top:.4rem}
.stats{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:.55rem 1rem;text-align:center;min-width:88px}
.stat .num{font-family:var(--mono);font-size:1.2rem;font-weight:700;color:var(--green)}
.stat .label{font-size:.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:.1rem}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.65rem;margin-bottom:1.5rem}
.sc{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1.1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.sc:hover{border-color:var(--border-lit);transform:translateY(-2px)}
.sc .ic{font-size:1.3rem;margin-bottom:.3rem}
.sc .ti{font-weight:600;font-size:.87rem;color:var(--text-bright)}
.sc .ct{font-family:var(--mono);font-size:.67rem;color:var(--text-dim);margin-top:.2rem}
.sc .pb{position:absolute;bottom:0;left:0;height:3px;background:var(--green);transition:width .4s}
.filters{display:flex;gap:.3rem;margin-bottom:.9rem;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.67rem;padding:.25rem .55rem;border:1px solid var(--border);border-radius:20px;background:none;color:var(--text-dim);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--border-lit);color:var(--text)}
.chip.active{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.mode-bar{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap}
.mbn{font-family:var(--mono);font-size:.73rem;font-weight:500;padding:.4rem .85rem;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-dim);cursor:pointer;transition:all .15s}
.mbn:hover{border-color:var(--border-lit);color:var(--text)}
.mbn.active{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.fc-prog{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;font-family:var(--mono);font-size:.74rem;color:var(--text-dim)}
.fc-prog .bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.fc-prog .bf{height:100%;background:var(--green);transition:width .3s;border-radius:2px}
.fcc{perspective:1000px;max-width:660px;margin:0 auto 1rem}
.fc-card{position:relative;width:100%;min-height:290px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:var(--r);padding:1.7rem 1.7rem 4.5rem;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.fc-front{background:linear-gradient(145deg,var(--bg-card),#0f1520)}
.fc-back{background:linear-gradient(145deg,#0b1a10,#0f1520);transform:rotateY(180deg);border-color:rgba(0,224,142,.2)}
.fc-lbl{font-family:var(--mono);font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem}
.fc-front .fc-lbl{color:var(--blue)}
.fc-back .fc-lbl{color:var(--green)}
.fc-q{font-size:1.05rem;font-weight:600;color:var(--text-bright);line-height:1.6}
.fc-a{font-size:.87rem;line-height:1.7}
.fc-a strong{color:var(--text-bright)}
.fc-a code,.fc-deep code,.lb code{font-family:var(--mono);font-size:.8em;background:var(--bg);padding:.1em .32em;border-radius:3px;color:var(--blue)}
.fc-deep{margin-top:.75rem;padding-top:.65rem;border-top:1px solid var(--border);font-size:.82rem;color:var(--text-dim);line-height:1.65}
.fc-fu{margin-top:.65rem;font-size:.79rem;color:var(--amber)}
.fc-fu ul{padding-left:1.1rem}
.fc-fu li{margin-bottom:.2rem}
.fc-tag{font-family:var(--mono);font-size:.62rem;color:var(--text-dim);position:absolute;top:.8rem;right:.8rem;background:var(--bg-hover);padding:.13rem .4rem;border-radius:4px}
.fc-hint{font-size:.74rem;color:var(--text-dim);text-align:center;margin-top:.5rem;font-style:italic}
.fc-actions{display:flex;gap:.4rem;justify-content:center;margin-top:.75rem}
.rb{font-family:var(--mono);font-size:.73rem;font-weight:600;padding:.48rem 1.05rem;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);cursor:pointer;transition:all .15s}
.rb:hover{transform:translateY(-1px)}
.rb.know{color:var(--green);border-color:rgba(0,224,142,.3)}.rb.know:hover{background:var(--green-dim)}
.rb.shaky{color:var(--amber);border-color:rgba(255,176,32,.3)}.rb.shaky:hover{background:var(--amber-dim)}
.rb.miss{color:var(--red);border-color:rgba(255,77,106,.3)}.rb.miss:hover{background:var(--red-dim)}
.fc-nav{display:flex;gap:.4rem;justify-content:center;margin-top:.6rem}
.fc-nav button{font-family:var(--mono);font-size:.79rem;padding:.33rem .85rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-dim);cursor:pointer;transition:all .15s}
.fc-nav button:hover{color:var(--text);border-color:var(--border-lit)}
.fc-nav button:disabled{opacity:.3;cursor:default}
.lesson{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.65rem;overflow:hidden}
.lh{display:flex;align-items:flex-start;gap:.65rem;padding:.8rem 1.05rem;cursor:pointer;transition:background .15s}
.lh:hover{background:var(--bg-hover)}
.l-num{font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--bg);background:var(--blue);padding:.17rem .48rem;border-radius:4px;white-space:nowrap;margin-top:.1rem}
.l-title{font-weight:600;font-size:.88rem;color:var(--text-bright);flex:1;line-height:1.45}
.l-badge{font-family:var(--mono);font-size:.61rem;padding:.11rem .36rem;border-radius:4px;border:1px solid;white-space:nowrap;margin-top:.1rem}
.bk{color:var(--green);border-color:rgba(0,224,142,.3);background:var(--green-dim)}
.bs{color:var(--amber);border-color:rgba(255,176,32,.3);background:var(--amber-dim)}
.bm{color:var(--red);border-color:rgba(255,77,106,.3);background:var(--red-dim)}
.l-chev{color:var(--text-dim);transition:transform .2s;font-size:.78rem;margin-top:.15rem}
.lesson.open .l-chev{transform:rotate(90deg)}
.lb{display:none;padding:0 1.05rem 1.05rem;border-top:1px solid var(--border)}
.lesson.open .lb{display:block;padding-top:.85rem}
.ll{font-family:var(--mono);font-size:.61rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.28rem}
.ll-s{color:var(--green)}.ll-d{color:var(--amber)}.ll-f{color:var(--purple)}
.lb p{font-size:.85rem;line-height:1.65;margin-bottom:.32rem}
.lb ul{padding-left:1.1rem;font-size:.83rem;line-height:1.6}
.lb li{margin-bottom:.18rem;color:var(--text-dim)}
.l-rate{display:flex;gap:.32rem;margin-top:.65rem;padding-top:.65rem;border-top:1px solid var(--border)}
.l-rate button{font-family:var(--mono);font-size:.67rem;font-weight:600;padding:.3rem .68rem;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;transition:all .15s}
.lr-k{color:var(--green)}.lr-k:hover{background:var(--green-dim);border-color:rgba(0,224,142,.3)}
.lr-s{color:var(--amber)}.lr-s:hover{background:var(--amber-dim);border-color:rgba(255,176,32,.3)}
.lr-m{color:var(--red)}.lr-m:hover{background:var(--red-dim);border-color:rgba(255,77,106,.3)}
.qcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem 1.65rem;margin-bottom:1.2rem;max-width:660px;margin-left:auto;margin-right:auto}
.qq{font-size:1rem;font-weight:600;color:var(--text-bright);margin-bottom:1.1rem;line-height:1.6}
.qopts{display:flex;flex-direction:column;gap:.42rem}
.qo{font-size:.86rem;padding:.62rem .9rem;border:1px solid var(--border);border-radius:8px;background:var(--bg-panel);color:var(--text);cursor:pointer;transition:all .15s;text-align:left}
.qo:hover{border-color:var(--border-lit);background:var(--bg-hover)}
.qo.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);pointer-events:none}
.qo.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);pointer-events:none}
.qo.disabled{pointer-events:none;opacity:.55}
.q-reveal{margin-top:.85rem;padding:.85rem;background:rgba(0,224,142,.04);border:1px solid rgba(0,224,142,.13);border-radius:8px;font-size:.83rem;line-height:1.65}
.q-score{text-align:center;padding:2.5rem}
.q-score .big{font-family:var(--mono);font-size:2.5rem;font-weight:700;color:var(--green)}
.timer-wrap{display:flex;align-items:center;gap:.85rem;justify-content:center;margin-bottom:1.15rem;flex-wrap:wrap}
.t-display{font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--amber);min-width:78px;text-align:center;transition:color .3s}
.t-display.exp{color:var(--red)}
.tbtn{font-family:var(--mono);font-size:.72rem;padding:.38rem .75rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-dim);cursor:pointer;transition:all .15s}
.tbtn:hover{border-color:var(--amber);color:var(--amber)}
.t-hint{font-size:.76rem;color:var(--text-dim);text-align:center;margin-bottom:.95rem;font-style:italic}
.kbh{display:flex;gap:.8rem;justify-content:center;font-family:var(--mono);font-size:.65rem;color:var(--text-dim);margin-top:.85rem;flex-wrap:wrap}
.kbh kbd{display:inline-block;padding:.11rem .36rem;border:1px solid var(--border);border-radius:3px;background:var(--bg-card);color:var(--text);margin:0 .1rem;font-size:.65rem}
.prio{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.6rem;padding:.13rem .42rem;border-radius:4px;margin-left:.3rem;vertical-align:middle}
.pm{background:rgba(255,77,106,.1);color:var(--red);border:1px solid rgba(255,77,106,.22)}
@media(max-width:640px){
  .hero h1{font-size:1.3rem}.main{padding:1rem .8rem}
  .sg{grid-template-columns:1fr 1fr}.fc-face{padding:1.4rem 1.1rem 4rem}
  .fc-q{font-size:.95rem}.kbh{display:none}
}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .28s ease-out}


/* THEORY */
.theory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.65rem;margin-bottom:1.2rem}
.tcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.tcard:hover{border-color:var(--border-lit);transform:translateY(-2px)}
.tcard .ic{font-size:1.4rem;margin-bottom:.3rem}
.tcard .ti{font-weight:600;font-size:.9rem;color:var(--text-bright)}
.tcard .ct{font-family:var(--mono);font-size:.67rem;color:var(--text-dim);margin-top:.2rem}

/* Theory reader */
.treader{max-width:760px;margin:0 auto}
.t-back{font-family:var(--mono);font-size:.73rem;padding:.35rem .7rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-dim);cursor:pointer;margin-bottom:1rem;transition:all .15s}
.t-back:hover{border-color:var(--border-lit);color:var(--text)}
.t-title{font-size:1.3rem;font-weight:700;color:var(--text-bright);margin-bottom:1.2rem;letter-spacing:-.02em}
.t-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.6rem;overflow:hidden}
.t-sh{display:flex;align-items:center;gap:.6rem;padding:.75rem 1.1rem;cursor:pointer;transition:background .15s}
.t-sh:hover{background:var(--bg-hover)}
.t-sh-text{font-weight:600;font-size:.88rem;color:var(--text-bright);flex:1}
.t-chev{color:var(--text-dim);transition:transform .2s;font-size:.75rem}
.t-section.open .t-chev{transform:rotate(90deg)}
.t-sb{display:none;padding:0 1.1rem 1.1rem;border-top:1px solid var(--border)}
.t-section.open .t-sb{display:block;padding-top:.9rem}
.t-sb p{font-size:.85rem;line-height:1.7;color:var(--text);margin-bottom:.5rem}
.t-sb code{font-family:var(--mono);font-size:.8em;background:var(--bg);padding:.1em .3em;border-radius:3px;color:var(--blue)}
.t-sb strong,.t-sb b{color:var(--text-bright)}
.t-sb pre,.t-codeblock{font-family:var(--mono);font-size:.76em;background:#0b0f18;border:1px solid var(--border-lit);border-radius:8px;padding:.9rem 1.1rem;margin:.6rem 0;overflow-x:auto;line-height:1.55;color:#c9d1d9;white-space:pre}
.t-sb ul,.t-sb ol{padding-left:1.3rem;margin:.3rem 0}
.t-sb li{font-size:.84rem;line-height:1.65;margin-bottom:.18rem;color:var(--text-dim)}
.t-sb .bullet{color:var(--green);font-size:.75rem;margin-right:.3rem}

</style>
</head>

<script>

const SECTIONS=[
  {id:'c',     icon:'⚙️',  title:'C Programming Fundamentals'},
  {id:'mem',   icon:'🧠',  title:'Memory Management'},
  {id:'linux', icon:'🐧',  title:'Linux Kernel Fundamentals'},
  {id:'kmod',  icon:'🧩',  title:'Kernel Modules'},
  {id:'char',  icon:'💾',  title:'Character Driver'},
  {id:'dt',    icon:'🌳',  title:'Device Tree & Platform'},
  {id:'bus',   icon:'🔌',  title:'I2C, SPI & Bus Protocols'},
  {id:'conc',  icon:'🔒',  title:'Concurrency & Interrupts'},
  {id:'debug', icon:'🐛',  title:'Debugging & Scenarios'},
];

const Q=[
{s:'c',p:0,q:'What is the difference between an array and a pointer in C?',a:'An array is a fixed-size contiguous collection of elements, while a pointer is a variable that stores an address. Arrays often decay to pointers when passed to functions, but they are not the same thing.',d:'If `int arr[10];`, then `arr` is storage for 10 integers. If `int *p = arr;`, then `p` only stores the address of the first element. `sizeof(arr)` gives the total size of the array, but `sizeof(p)` gives the size of the pointer itself. This matters in embedded and kernel code because confusing arrays and pointers often leads to buffer bugs.',f:['What does array-to-pointer decay mean?','What is the difference between `sizeof(arr)` and `sizeof(p)`?','Why is this important in function parameters?']},
{s:'c',p:1,q:'What is `volatile` and why is it important in embedded systems?',a:'`volatile` tells the compiler that a variable may change unexpectedly, so it must not optimize away accesses to it. It is commonly used for hardware registers and variables affected by interrupts.',d:'In embedded programming, hardware registers can change outside normal program flow, so repeated reads must actually happen. `volatile` prevents the compiler from caching or removing those reads and writes. But `volatile` is not a lock, does not make code thread-safe, and does not replace proper synchronization.',f:['Where would you use `volatile`?','Why is `volatile` not enough for multithreading?','Should every shared variable be `volatile`?']},
{s:'c',p:1,q:'What is structure padding and alignment?',a:'Compilers insert padding inside structures so members are aligned according to architecture rules. This improves access efficiency but may make the structure bigger than the sum of its fields.',d:'For example, an `int` may require 4-byte alignment, so if a `char` appears before it, the compiler may insert extra bytes in between. This matters in embedded systems when working with hardware registers, binary protocols, or DMA descriptors. If you ignore padding, you may misread data layouts or corrupt protocol structures.',f:['Why does the compiler add padding?','How can you inspect structure size?','When is packed layout needed, and what are the risks?']},
{s:'c',p:1,q:'What are function pointers, and why are they important in Linux kernel code?',a:'A function pointer stores the address of a function and lets code call it indirectly. The kernel uses them heavily for callbacks and operation tables.',d:'In Linux drivers, structures like `file_operations` contain function pointers for `open`, `read`, `write`, `ioctl`, and `poll`. This allows the kernel to call driver-specific behavior through a common interface. Function pointers are also used in interrupt handlers, timers, workqueues, and many subsystems.',f:['Where do function pointers appear in drivers?','Why are they better than a giant `switch` in many designs?','What is the syntax for a simple function pointer?']},
{s:'linux',p:0,q:'What is the difference between user space and kernel space?',a:'User space runs normal applications with restricted privileges, while kernel space runs the operating system core and drivers with full hardware access.',d:'This separation improves security and stability. Applications cannot directly touch hardware or kernel memory; they must go through system calls. Drivers live in kernel space because they need direct access to devices, interrupts, memory-mapped I/O, and privileged kernel APIs.',f:['Why is this separation necessary?','How does user space request kernel services?','What happens if kernel code has a bug?']},
{s:'linux',p:1,q:'What is a system call?',a:'A system call is the controlled interface through which a user-space program requests a service from the kernel.',d:'Examples include `open`, `read`, `write`, `mmap`, `fork`, and `ioctl`. When a program makes a system call, the CPU switches into kernel mode, the kernel validates the request, performs the operation, and then returns back to user space. In driver interviews, this is important because user programs reach drivers through kernel-managed interfaces like file operations.',f:['What is the path from `read()` in user space to a driver?','Why can&rsquo;t user space directly call kernel functions?','What is `ioctl()` used for?']},
{s:'linux',p:0,q:'What is the difference between a process and a thread?',a:'A process has its own virtual address space, while threads within the same process share memory and resources but have separate stacks and registers.',d:'Processes are heavier because they isolate memory and resources. Threads are lighter and useful when tasks within one application need to run concurrently and share data. In interviews, this question often leads into synchronization, race conditions, and the mapping between user-space threads and kernel concurrency concepts.',f:['Why are threads lighter than processes?','What resources are shared between threads?','When would you prefer threads over processes?']},
{s:'linux',p:0,q:'Explain `fork()`, `exec()`, and copy-on-write.',a:'`fork()` creates a new process, `exec()` replaces the current process image with a new program, and copy-on-write is the optimization that makes `fork()` efficient.',d:'After `fork()`, parent and child initially share the same memory pages as read-only. If either side writes to a page, the kernel creates a private copy of that page. `exec()` does not create a new process; it replaces the current program with a different executable. These concepts matter in Linux fundamentals and show how the kernel manages process creation efficiently.',f:['What stays the same after `exec()`?','Why is `fork()` not as expensive as a full memory copy?','What is a typical `fork()` + `exec()` workflow?']},
{s:'linux',p:1,q:'What is the difference between `mmap()` and `ioremap()`?',a:'`mmap()` is a user-space system call for mapping memory into a process address space, while `ioremap()` is a kernel function used by drivers to map physical I/O memory into kernel virtual address space.',d:'`mmap()` is often used for files, shared memory, and sometimes device memory exposed to user space. `ioremap()` is used inside drivers for accessing MMIO registers of hardware devices. Both deal with mapping memory, but they operate in different contexts and for different users.',f:['Why can&rsquo;t a driver directly dereference a physical address?','Where would `mmap()` appear in a character driver?','What APIs are used after `ioremap()`?']},
{s:'linux',p:0,q:'Explain the embedded Linux boot flow.',a:'A typical embedded Linux boot flow is: BootROM → bootloader like U-Boot → kernel → initramfs or root filesystem → init process.',d:'The SoC starts with BootROM, which loads a bootloader from flash, SD, or another source. The bootloader initializes basic hardware, loads the kernel image, Device Tree Blob, and sometimes initramfs, and passes boot arguments. Then the kernel initializes subsystems, mounts a temporary or final root filesystem, and starts `init` or another first userspace process.',f:['What does U-Boot do?','What is initramfs?','What is the role of the Device Tree Blob?']},
{s:'kmod',p:0,q:'What is a kernel module?',a:'A kernel module is code that can be loaded into or removed from the kernel at runtime.',d:'Modules are commonly used for device drivers, filesystems, and protocol support. They let you add functionality without rebuilding the entire kernel. A module usually has an initialization function and an exit function, declared using `module_init()` and `module_exit()`.',f:['What is the difference between a built-in driver and a module?','Why are modules useful during development?','What commands are used to load and unload a module?']},
{s:'kmod',p:1,q:'What is the difference between `insmod` and `modprobe`?',a:'`insmod` loads a module directly by filename, while `modprobe` loads a module by name and also resolves dependencies automatically.',d:'`insmod` is a simple low-level tool and does not handle dependencies. `modprobe` consults module dependency information and is generally the preferred command on real systems. If a module fails to load, `dmesg` is often the first place to check for errors like unresolved symbols or vermagic mismatch.',f:['What is vermagic?','Why might a module fail to load?','When would you use `modprobe` instead of `insmod`?']},
{s:'kmod',p:1,q:'What is the difference between `kmalloc()`, `kzalloc()`, and `vmalloc()`?',a:'`kmalloc()` allocates physically contiguous memory, `kzalloc()` does the same but zero-initializes it, and `vmalloc()` allocates virtually contiguous memory that may not be physically contiguous.',d:'`kmalloc()` is the most common allocator for small driver structures. `kzalloc()` is often preferred because it avoids uninitialized fields. `vmalloc()` is useful for larger allocations where physical contiguity is not required, but it is slower and unsuitable for many DMA use cases.',f:['Why is physical contiguity sometimes important?','When would `vmalloc()` be a bad choice?','Why is `kzalloc()` often safer than `kmalloc()`?']},
{s:'kmod',p:1,q:'What are `GFP_KERNEL` and `GFP_ATOMIC`?',a:'They are memory allocation flags. `GFP_KERNEL` is used when sleeping is allowed, and `GFP_ATOMIC` is used when sleeping is not allowed.',d:'`GFP_KERNEL` is the normal choice in process context because the allocator may block and reclaim memory. `GFP_ATOMIC` is used in interrupt context or while holding a spinlock, where sleeping would be illegal. Using the wrong flag can lead to failures or serious kernel bugs.',f:['In which context is `GFP_ATOMIC` required?','Why can&rsquo;t allocation sleep in interrupt context?','What is process context versus atomic context?']},
{s:'kmod',p:0,q:'Why does kernel code often use `goto` for cleanup?',a:'Kernel code uses `goto` cleanup to handle errors cleanly when multiple resources are allocated in sequence.',d:'If a driver allocates memory, maps registers, requests an IRQ, and then fails later, it must release earlier resources in reverse order. Without `goto`, cleanup logic gets duplicated and becomes error-prone. The `goto` cleanup pattern centralizes resource release and makes failure paths easier to maintain.',f:['Why is this pattern common in `probe()`?','Why is duplicated cleanup code risky?','How do `devm_*` APIs reduce cleanup code?']},
{s:'char',p:0,q:'What is a character device driver?',a:'A character device driver provides stream-oriented access to a device through file operations such as `open`, `read`, `write`, and `ioctl`.',d:'Character devices are exposed through device nodes under `/dev`. User space interacts with them using normal file APIs, and the kernel routes those operations into the driver&rsquo;s `file_operations` table. Many custom embedded drivers begin as character drivers because they are simple and flexible.',f:['What is the difference between character and block devices?','Where does the device node come from?','Why are character drivers common in teaching and interviews?']},
{s:'char',p:1,q:'What are major and minor numbers?',a:'The major number identifies the driver, and the minor number identifies a specific device instance handled by that driver.',d:'This allows one driver to manage multiple devices. The device number is stored in `dev_t`, and helper macros like `MAJOR()`, `MINOR()`, and `MKDEV()` are used to work with it. In a multi-instance driver, the minor number often helps locate per-device private data.',f:['What is `dev_t`?','How do you allocate device numbers?','How can one driver support multiple devices?']},
{s:'char',p:1,q:'What are `cdev` and `file_operations`?',a:'`cdev` represents a character device in the kernel, and `file_operations` is the table of callbacks that defines how that device behaves.',d:'When user space opens a device node, the VFS uses the registered `cdev` to find the driver&rsquo;s `file_operations`. These callbacks implement methods like `open`, `release`, `read`, `write`, `unlocked_ioctl`, and `poll`. This is one of the most important driver concepts to understand clearly for interviews.',f:['What callback is called when a user runs `read()`?','Where is the driver&rsquo;s private state usually stored?','Why are function pointers central here?']},
{s:'char',p:1,q:'Why do drivers use `copy_to_user()` and `copy_from_user()`?',a:'Drivers use them to safely transfer data between kernel space and user space.',d:'The kernel cannot trust or directly dereference user pointers because user memory may be invalid, unmapped, or malicious. `copy_to_user()` and `copy_from_user()` perform controlled access across the boundary. This is a very common interview question because it checks whether you understand the user-kernel memory separation.',f:['Why is direct access to user pointers unsafe?','What happens if the copy fails?','Where would you use these functions in a character driver?']},
{s:'char',p:1,q:'What is `ioctl()` and when would you use it?',a:'`ioctl()` is used for device-specific control operations that do not fit naturally into `read()` or `write()`.',d:'Examples include resetting a device, changing configuration, reading status, or issuing commands. In Linux drivers, `ioctl` commands are usually defined with macros like `_IO`, `_IOR`, and `_IOW`. Good drivers use `ioctl()` only when the operation really is control-oriented and does not map well to data streaming.',f:['What is the difference between `_IO`, `_IOR`, and `_IOW`?','When should you avoid `ioctl()`?','Could sysfs be a better choice in some cases?']},
{s:'char',p:1,q:'How do you implement a blocking `read()` in a driver?',a:'If data is not available, the process sleeps on a wait queue until the device or another context makes data available and wakes it up.',d:'A blocking `read()` should not spin in a loop. Instead, it should check whether data is available, call `wait_event_interruptible()` or a similar API if not, and wake up later when the condition becomes true. This is a core driver concurrency pattern and is far more interview-relevant than advanced user-space thread pools.',f:['What is a wait queue?','Why is blocking better than busy-waiting?','What should happen if the process receives a signal while waiting?']},
{s:'char',p:1,q:'What is `.poll()` in a driver?',a:'`.poll()` reports whether a device is ready for reading, writing, or other events, enabling user-space APIs like `poll()`, `select()`, and `epoll()`.',d:'The driver&rsquo;s `.poll()` implementation typically registers a wait queue and returns a bitmask indicating readiness. This lets user space efficiently monitor multiple descriptors instead of blocking blindly on one `read()`. If you add blocking I/O to a character driver, knowing how `.poll()` fits in is a strong plus in interviews.',f:['How is `.poll()` different from `read()`?','What does `O_NONBLOCK` change?','Why is `.poll()` useful in real applications?']},
{s:'dt',p:0,q:'Why does Device Tree exist?',a:'Device Tree separates hardware description from driver code so the same kernel can work across multiple boards without hardcoding platform details into drivers.',d:'Instead of embedding addresses, IRQs, GPIOs, clocks, and compatible strings directly in code, those details are described in a data structure that the kernel parses at boot. Drivers then match devices using `compatible` strings and fetch resources from the tree. This is essential in embedded Linux, especially on ARM-based systems.',f:['What hardware details are typically stored in DT?','What is a `compatible` string?','Why is this approach better than hardcoded board files?']},
{s:'dt',p:1,q:'What is a `compatible` string, and how does matching happen?',a:'A `compatible` string identifies the hardware type, and the kernel matches it against a driver&rsquo;s `of_match_table`.',d:'For example, a DT node may contain `compatible = "vendor,my-device";`. The driver exposes a list of supported strings, and if a match is found, the kernel binds the device to that driver and calls `probe()`. If the strings do not match exactly, `probe()` will never be called.',f:['What should you check if `probe()` is not called?','Can one driver support multiple `compatible` strings?','How does this differ from I2C device ID matching?']},
{s:'dt',p:0,q:'What are the `reg`, `interrupts`, and phandle-style properties used for?',a:'`reg` describes memory-mapped register ranges, `interrupts` describes interrupt wiring, and phandle references connect one DT node to another resource provider like a GPIO controller or clock provider.',d:'A driver uses these properties to discover hardware resources without hardcoding them. For example, `reg` is used with resource mapping APIs, `interrupts` leads to IRQ lookup, and a phandle may connect the device to clocks, regulators, GPIO controllers, or pinctrl settings. Understanding these properties makes DT discussions much easier in interviews.',f:['How does a driver get the register base from `reg`?','How does a driver get an IRQ from the DT?','What kinds of things are usually referenced by phandles?']},
{s:'dt',p:1,q:'What is a platform driver, and what usually happens in `probe()`?',a:'A platform driver handles non-discoverable SoC or board-integrated devices, and `probe()` is where the driver acquires resources, initializes hardware, and registers its interfaces.',d:'In `probe()`, a platform driver commonly allocates private data, maps MMIO registers with `devm_platform_ioremap_resource()`, gets IRQs with `platform_get_irq()`, requests clocks or GPIOs, initializes the device, and registers with a subsystem or creates user interfaces. If something fails, it returns an error and performs cleanup or relies on `devm_*` helpers.',f:['What kinds of devices use platform drivers?','What is `devm_platform_ioremap_resource()`?','Why is `probe()` such an important function?']},
{s:'dt',p:1,q:'What is `-EPROBE_DEFER` and when is it used?',a:'`-EPROBE_DEFER` tells the kernel that a driver&rsquo;s dependency is not ready yet and that probing should be tried again later.',d:'This happens when a device depends on another provider such as a clock, regulator, GPIO controller, reset controller, or other subsystem that has not finished registering. Returning `-EPROBE_DEFER` is the correct way to handle this dependency ordering issue.',f:['What dependencies commonly cause deferred probing?','Why is returning a hard failure wrong in this case?','How would you debug repeated probe deferrals?']},
{s:'bus',p:0,q:'What is the difference between I2C and SPI?',a:'I2C uses two shared wires and addressing, while SPI uses separate clock/data lines and chip-select signals and is usually faster.',d:'I2C is common for sensors, EEPROMs, RTCs, and low-speed peripherals because it uses fewer wires and allows multiple devices on the same bus by address. SPI is often used for flash, displays, ADCs, and other higher-speed devices because it offers higher throughput. Interviewers often ask this to see if you can choose the right bus for a use case.',f:['When would you choose I2C over SPI?','What are ACK and NACK in I2C?','What are CPOL and CPHA in SPI?']},
{s:'bus',p:0,q:'Explain the Linux I2C model: adapter, client, and driver.',a:'The adapter is the I2C controller, the client is a device on the bus, and the driver is the software that handles that device.',d:'The adapter represents the hardware bus controller. The client represents a specific device at a specific address on that bus. The driver binds to that client, typically through Device Tree matching, and uses APIs like `i2c_smbus_read_byte_data()` or `i2c_smbus_write_byte_data()` to talk to the device.',f:['What is an `i2c_client`?','How does DT matching work for I2C drivers?','What are SMBus helper APIs?']},
{s:'bus',p:0,q:'Why is subsystem integration like `hwmon` preferred in sensor drivers?',a:'Subsystem integration gives a standard user-space interface and makes drivers more maintainable and consistent with the rest of Linux.',d:'Instead of inventing a custom `/dev` interface or custom sysfs layout, a temperature sensor driver can register with `hwmon`, which automatically exposes standard attributes like `temp1_input`. This is better for tooling, userspace compatibility, and code quality.',f:['What kinds of subsystems exist besides `hwmon`?','Why is a subsystem often better than a custom character device?','What does a sensor driver still need to implement after joining `hwmon`?']},
{s:'bus',p:1,q:'What is the difference between process context and interrupt context?',a:'Process context is normal schedulable task context where sleeping is usually allowed, while interrupt context is time-sensitive and must not sleep.',d:'Code running due to system calls, kernel threads, or workqueues usually runs in process context. Interrupt handlers run in interrupt context and must complete quickly because they are handling urgent events. This distinction determines what locks, memory allocation flags, and APIs are safe to use.',f:['Why can&rsquo;t you sleep in interrupt context?','Which allocation flags are safe in interrupt context?','Is a workqueue process context or interrupt context?']},
{s:'bus',p:1,q:'What is the difference between a mutex and a spinlock?',a:'A mutex is a sleeping lock used in process context, while a spinlock is a busy-wait lock used when sleeping is not allowed, such as atomic or interrupt context.',d:'Use a mutex for longer critical sections where blocking is acceptable. Use a spinlock for short critical sections where the code cannot sleep. A common interview trap is to ask whether a mutex can be used in interrupt context; the correct answer is no, because mutex acquisition may sleep.',f:['Why is sleeping while holding a spinlock wrong?','When would you use `spin_lock_irqsave()`?','If data is shared between process context and IRQ context, what kind of protection is common?']},
{s:'conc',p:1,q:'What are top half, threaded IRQ, and workqueue?',a:'The top half is the immediate interrupt handler, a threaded IRQ defers heavier work to a schedulable thread, and a workqueue defers work to process context.',d:'A top half should do only urgent work like acknowledging the interrupt and capturing minimal state. If more work is needed and it may sleep, a threaded IRQ or workqueue is used. Modern driver design often prefers a small hard IRQ handler plus a threaded IRQ handler, because real device handling often needs APIs that are not safe in hard interrupt context.',f:['Why should the top half be short?','When would you prefer threaded IRQ over workqueue?','Can a threaded IRQ sleep?']},
{s:'conc',p:1,q:'How would you debug if your driver&rsquo;s `probe()` is not getting called?',a:'First check whether the driver loaded, whether the DT `compatible` string matches, and whether the device node is enabled.',d:'First check whether the driver loaded, whether the DT `compatible` string matches, and whether the device node is enabled.',f:['What if the module loaded but `probe()` still never runs?','How would you detect repeated probe deferral?','What sysfs paths can help inspect device-driver binding?']},
{s:'conc',p:1,q:'How would you debug a module that fails to load?',a:'Start with `dmesg`, then check for symbol errors, vermagic mismatch, invalid parameters, missing dependencies, or code paths that fail during initialization.',d:'Many module load problems are explained clearly in kernel logs. Common causes include unresolved symbols, wrong kernel version, missing exported symbols, bad module parameters, or crashes during `init`. The key interview point is not memorizing every failure, but showing that your first move is to inspect logs and reason systematically.',f:['What is vermagic mismatch?','What is the difference between `insmod` failure and runtime probe failure?','Why is `dmesg` usually the first step?']},
{s:'conc',p:0,q:'Walk me through your driver project.',a:'Start from the user-visible goal, then explain architecture, data flow, synchronization, error handling, and how you tested and debugged it.',d:'Interviewers care less about fancy wording and more about whether you truly understand your own code.',f:['What was the hardest bug you hit?','Why did you choose that synchronization mechanism?','If you had more time, what would you improve?']},
{s:'debug',p:0,q:'A kernel module is not loading. How would you debug it?',a:'First I would check `dmesg`, because kernel logs usually show the real reason such as symbol mismatch, vermagic issue, bad parameters, or init failure.',d:'In driver development, `dmesg` is usually the fastest way to understand why loading failed.',f:['What is vermagic mismatch?','What is the difference between `insmod` and `modprobe` here?','What if the module loads but the device still does not work?']},
{s:'debug',p:1,q:'Your driver module loads, but `probe()` is never called. What would you check?',a:'I would check whether the device was actually created or described correctly, whether the `compatible` string matches, and whether the driver is registered on the correct bus.',d:'If this is an I2C driver, I would also check whether the I2C device exists on the expected bus and address.',f:['What is `of_match_table`?','What is `-EPROBE_DEFER`?','How would you check device-driver binding in sysfs?']},
{s:'debug',p:1,q:'`probe()` is called, but it fails. How would you debug that?',a:'I would add clear logs inside `probe()` and identify exactly which resource acquisition or initialization step is failing.',d:'Most probe failures happen due to bad DT data, missing dependencies, or incorrect assumptions about hardware state.',f:['Which APIs in `probe()` commonly return error pointers?','Why is structured logging important?','Why are cleanup paths critical here?']},
{s:'debug',p:0,q:'Device node under `/dev` is not created. What would you check?',a:'I would check whether device number allocation, `cdev_add`, `class_create`, and `device_create` all succeeded, and then inspect `dmesg`.',d:'If `/dev` entry is missing, then one of those steps likely failed. I would also check whether user-space device management like `udev` or `mdev` is present if the system depends on it.',f:['What are major and minor numbers?','Does `cdev_add()` itself create `/dev`?','What is the role of `class_create()` and `device_create()`?']},
{s:'debug',p:0,q:'`read()` blocks forever in your driver. How would you debug that?',a:'I would check whether the condition for waking the wait queue is ever becoming true and whether the wake-up path is actually executed.',d:'I would check whether the condition for waking the wait queue is ever becoming true and whether the wake-up path is actually executed.',f:['What is a wait queue?','Why must the wait condition be checked carefully?','How would non-blocking mode behave differently?']},
{s:'debug',p:1,q:'`poll()` is not working correctly. How would you think about it?',a:'I would check whether the driver correctly registers the wait queue with `poll_wait()` and returns the right readiness mask when data is available.',d:'I would verify whether the device should report readable, writable, or error conditions and whether those states match the driver&rsquo;s internal buffer or event flags.',f:['What is the difference between `.poll()` and `read()`?','What readiness bits are commonly returned?','Why is `.poll()` important for real applications?']},
{s:'debug',p:1,q:'Interrupt is registered, but it never fires. What would you check?',a:'I would check DT interrupt configuration, hardware enable path, and `/proc/interrupts` to confirm whether the IRQ is actually arriving.',d:'Often the problem is not in the handler code but in DT, pin configuration, or hardware enable sequence.',f:['What does `/proc/interrupts` show?','Why do trigger type and polarity matter?','What if the interrupt count increases but the handler logic still seems wrong?']},
{s:'debug',p:1,q:'Your I2C driver probes, but communication with the device fails. How do you debug it?',a:'I would check bus number, device address, DT data, pull-ups, and the actual register read/write return values.',d:'I2C issues are often caused by wrong address, missing pull-ups, bad wiring, or using the wrong register access pattern.',f:['What tools help debug I2C from Linux?','What is the difference between raw I2C and SMBus helper APIs?','Why might a sensor ACK but still return wrong data?']},
{s:'debug',p:0,q:'The kernel crashes with an oops after loading your driver. What would you do?',a:'I would read the oops carefully, identify the failing function and address, and relate it to the recent code path such as probe, read, interrupt, or cleanup.',d:'Tools like `addr2line` with the module&rsquo;s debug symbols can convert a crash address into a source line. If a crash is reproducible, adding `pr_debug()` before and after suspicious lines helps narrow it down.',f:['What is a kernel oops vs a kernel panic?','How would you use `addr2line` with a module?','Can the system continue after an oops?','20-second short answer']},
{s:'c',p:1,q:'What is the difference between stack and heap? How does this relate to kernel programming?',a:'Stack: auto-allocated, LIFO, ~8MB user / 8-16KB kernel. Heap: manual via malloc, unlimited. In kernel: NO malloc — use kmalloc (slab allocator). Kernel stack is extremely limited, so never declare large local arrays.',d:'Stack: auto-allocated, LIFO, ~8MB user / 8-16KB kernel. Heap: manual via malloc, unlimited. In kernel: NO malloc — use kmalloc (slab allocator). Kernel stack is extremely limited, so never declare large local arrays.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:1,q:'What is a memory leak? How do you detect one in kernel space?',a:'Memory allocated but never freed. User: valgrind, ASan. Kernel: `CONFIG_DEBUG_KMEMLEAK` — kmemleak scans memory for unreferenced allocations. Also: `cat /proc/slab_allocators`.',d:'Memory allocated but never freed. User: valgrind, ASan. Kernel: `CONFIG_DEBUG_KMEMLEAK` — kmemleak scans memory for unreferenced allocations. Also: `cat /proc/slab_allocators`.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:1,q:'What is the `container_of` macro? Give a kernel use case.',a:'Given pointer to member, returns pointer to enclosing struct: `container_of(ptr, type, member)`. Used in kernel linked lists: you embed `struct list_head` in your struct, then recover your struct from the list node pointer. Also used in `cdev` → your device struct in driver&rsquo;s open().',d:'Given pointer to member, returns pointer to enclosing struct: `container_of(ptr, type, member)`. Used in kernel linked lists: you embed `struct list_head` in your struct, then recover your struct from the list node pointer. Also used in `cdev` → your device struct in driver&rsquo;s open().',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:1,q:'Explain `volatile` keyword and when to use it.',a:'Tells compiler: don&rsquo;t optimize accesses, always read from memory. Use for: memory-mapped hardware registers, variables shared with ISR, signal handlers. In kernel: I/O accessors (`readl()`/`writel()`) include barriers, so `volatile` is less common but `volatile` is needed for direct MMIO pointers.',d:'Tells compiler: don&rsquo;t optimize accesses, always read from memory. Use for: memory-mapped hardware registers, variables shared with ISR, signal handlers. In kernel: I/O accessors (`readl()`/`writel()`) include barriers, so `volatile` is less common but `volatile` is needed for direct MMIO pointers.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'What is `restrict` keyword?',a:'Promise to compiler that a pointer is the only way to access that memory. Enables better optimization. Used in: `memcpy(void * restrict dest, const void * restrict src, size_t n)` — guarantees no overlap.',d:'Promise to compiler that a pointer is the only way to access that memory. Enables better optimization. Used in: `memcpy(void * restrict dest, const void * restrict src, size_t n)` — guarantees no overlap.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'Explain the difference between `sizeof` and `strlen`.',a:'`sizeof`: compile-time operator, gives size of type/variable in bytes (includes padding, null terminator). `strlen`: runtime function, counts chars until `\\0`. `sizeof("hello") = 6` (includes \\0), `strlen("hello") = 5`.',d:'`sizeof`: compile-time operator, gives size of type/variable in bytes (includes padding, null terminator). `strlen`: runtime function, counts chars until `\\0`. `sizeof("hello") = 6` (includes \\0), `strlen("hello") = 5`.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'What is a union? How is it used in embedded?',a:'Union members share same memory location. Size = largest member. Use: type punning, protocol parsing, register overlays. union reg_access { uint32_t raw; struct { uint8_t byte0, byte1, byte2, byte3; } bytes;',d:'Union members share same memory location. Size = largest member. Use: type punning, protocol parsing, register overlays. union reg_access { uint32_t raw; struct { uint8_t byte0, byte1, byte2, byte3; } bytes;',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'What is the `offsetof` macro?',a:'Returns byte offset of member within struct: `offsetof(struct_type, member)`. Foundation of `container_of`. Defined as `((size_t)&((type*)0)->member)`.',d:'Returns byte offset of member within struct: `offsetof(struct_type, member)`. Foundation of `container_of`. Defined as `((size_t)&((type*)0)->member)`.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'Explain `static` keyword in all its uses in C.',a:'`static` local variable: persists across function calls (stored in DATA/BSS, not stack). `static` global/function: limits linkage to current file (internal linkage — like &ldquo;private&rdquo; in OOP). In kernel: `static` functions/variables are file-scope — standard practice to avoid symbol collisions between modules.',d:'`static` local variable: persists across function calls (stored in DATA/BSS, not stack). `static` global/function: limits linkage to current file (internal linkage — like &ldquo;private&rdquo; in OOP). In kernel: `static` functions/variables are file-scope — standard practice to avoid symbol collisions between modules.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'What is `inline` and does the compiler always inline?',a:'Hint to compiler to expand function at call site (eliminates call overhead). Compiler may ignore hint. In kernel: `__always_inline` forces inlining. `inline` helps for small, frequently-called functions. Trade-off: code size vs call overhead.',d:'Hint to compiler to expand function at call site (eliminates call overhead). Compiler may ignore hint. In kernel: `__always_inline` forces inlining. `inline` helps for small, frequently-called functions. Trade-off: code size vs call overhead.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:1,q:'How do you atomically set a bit in a shared variable?',a:'Userspace: `__atomic_or_fetch(&var, BIT(n), __ATOMIC_SEQ_CST)` or `atomic_fetch_or()`. Kernel: `set_bit(n, &var)` which uses architecture-specific atomic instructions (LOCK prefix on x86, LDREX/STREX on ARM).',d:'Userspace: `__atomic_or_fetch(&var, BIT(n), __ATOMIC_SEQ_CST)` or `atomic_fetch_or()`. Kernel: `set_bit(n, &var)` which uses architecture-specific atomic instructions (LOCK prefix on x86, LDREX/STREX on ARM).',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'Write code to reverse the bits of a 32-bit integer.',a:'uint32_t reverse_bits(uint32_t n) { n = ((n >> 1) & 0x55555555) | ((n & 0x55555555) > 2) & 0x33333333) | ((n & 0x33333333) > 4) & 0x0F0F0F0F) | ((n & 0x0F0F0F0F) > 8) & 0x00FF00FF) | ((n & 0x00FF00FF) > 16) | (n << 16); return n;',d:'uint32_t reverse_bits(uint32_t n) { n = ((n >> 1) & 0x55555555) | ((n & 0x55555555) > 2) & 0x33333333) | ((n & 0x33333333) > 4) & 0x0F0F0F0F) | ((n & 0x0F0F0F0F) > 8) & 0x00FF00FF) | ((n & 0x00FF00FF) > 16) | (n << 16); return n;',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'What is two&rsquo;s complement representation?',a:'System to represent signed integers. Positive: same as unsigned. Negative: flip all bits + 1. So -1 = 0xFFFFFFFF. Advantage: single representation of zero, addition works for both signed/unsigned.',d:'System to represent signed integers. Positive: same as unsigned. Negative: flip all bits + 1. So -1 = 0xFFFFFFFF. Advantage: single representation of zero, addition works for both signed/unsigned.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'What is a futex and how does `pthread_mutex` use it?',a:'Fast Userspace Mutex. Uncontested lock/unlock: atomic CAS in userspace (no syscall!). Only when contested: `futex()` syscall to sleep/wake. Huge performance win — most locks are uncontested.',d:'Fast Userspace Mutex. Uncontested lock/unlock: atomic CAS in userspace (no syscall!). Only when contested: `futex()` syscall to sleep/wake. Huge performance win — most locks are uncontested.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'c',p:0,q:'What is the ABA problem in lock-free programming?',a:'Thread reads value A, gets preempted. Another thread changes A→B→A. First thread&rsquo;s CAS succeeds (value is A again) but state has changed. Solution: add version counter alongside the value.',d:'Thread reads value A, gets preempted. Another thread changes A→B→A. First thread&rsquo;s CAS succeeds (value is A again) but state has changed. Solution: add version counter alongside the value.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:1,q:'What is the difference between kernel space and user space?',a:'Kernel: Ring 0, full HW access, all memory, single shared address space. User: Ring 3, restricted, isolated per-process virtual address space. Crossing boundary = syscall = context switch (save/restore registers, switch stack).',d:'Kernel: Ring 0, full HW access, all memory, single shared address space. User: Ring 3, restricted, isolated per-process virtual address space. Crossing boundary = syscall = context switch (save/restore registers, switch stack).',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:1,q:'What happens during a system call? Trace it step by step.',a:'User calls library function (write()). 2. glibc wrapper loads syscall# into rax. 3. Args in rdi, rsi, rdx, etc. 4. SYSCALL instruction. 5. CPU switches to Ring 0. 6. Kernel saves user registers. 7. Look up handler in sys_call_table. 8. Execute handler (ksys_write). 9. Return value in rax. 10. SYSRET back to user mode.',d:'User calls library function (write()). 2. glibc wrapper loads syscall# into rax. 3. Args in rdi, rsi, rdx, etc. 4. SYSCALL instruction. 5. CPU switches to Ring 0. 6. Kernel saves user registers. 7. Look up handler in sys_call_table. 8. Execute handler (ksys_write). 9. Return value in rax. 10. SYSRET back to user mode.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:0,q:'What is kernel preemption?',a:'Kernel can be preempted to run higher-priority task. `CONFIG_PREEMPT_NONE`: never preempt kernel (server). `CONFIG_PREEMPT`: preempt almost anywhere except critical sections (desktop). `CONFIG_PREEMPT_RT`: full preemption (real-time).',d:'Kernel can be preempted to run higher-priority task. `CONFIG_PREEMPT_NONE`: never preempt kernel (server). `CONFIG_PREEMPT`: preempt almost anywhere except critical sections (desktop). `CONFIG_PREEMPT_RT`: full preemption (real-time).',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:0,q:'Explain the Linux kernel module lifecycle.',a:'`insmod module.ko` → load binary into kernel memory. 2. Resolve symbols (link to kernel exports like printk). 3. Call `module_init()` function. 4. If returns 0 → module active, appears in lsmod. 5. `rmmod module` → Call `module_exit()` function. 6. Free module memory.',d:'`insmod module.ko` → load binary into kernel memory. 2. Resolve symbols (link to kernel exports like printk). 3. Call `module_init()` function. 4. If returns 0 → module active, appears in lsmod. 5. `rmmod module` → Call `module_exit()` function. 6. Free module memory.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:0,q:'What is EXPORT_SYMBOL?',a:'Makes a kernel function/variable available to other modules. Without it, a function is only usable within its own module. `EXPORT_SYMBOL_GPL` limits to GPL-licensed modules. Exported symbols appear in `/proc/kallsyms`.',d:'Makes a kernel function/variable available to other modules. Without it, a function is only usable within its own module. `EXPORT_SYMBOL_GPL` limits to GPL-licensed modules. Exported symbols appear in `/proc/kallsyms`.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:1,q:'What happens if module_init returns non-zero?',a:'Module loading fails. Error code returned to insmod. Module_exit is NOT called! You MUST clean up any partially-allocated resources before returning the error (this is why goto cleanup pattern exists).',d:'Module loading fails. Error code returned to insmod. Module_exit is NOT called! You MUST clean up any partially-allocated resources before returning the error (this is why goto cleanup pattern exists).',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:0,q:'What is `printk` vs `pr_info`?',a:'`printk(KERN_INFO "msg")` is the raw function. `pr_info("msg")` is a convenience macro that adds KERN_INFO level. `pr_err`, `pr_warn`, `pr_debug` for other levels. `dev_info(dev, "msg")` adds device name prefix — preferred in drivers.',d:'`printk(KERN_INFO "msg")` is the raw function. `pr_info("msg")` is a convenience macro that adds KERN_INFO level. `pr_err`, `pr_warn`, `pr_debug` for other levels. `dev_info(dev, "msg")` adds device name prefix — preferred in drivers.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:0,q:'When can you sleep in kernel code?',a:'Only in process context (system calls, work queues, kernel threads). NEVER in: interrupt handlers (top half), softirqs, tasklets, or while holding spinlocks. Use `might_sleep()` debug assertion to verify.',d:'Only in process context (system calls, work queues, kernel threads). NEVER in: interrupt handlers (top half), softirqs, tasklets, or while holding spinlocks. Use `might_sleep()` debug assertion to verify.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:0,q:'What are the kernel log levels?',a:'0=EMERG, 1=ALERT, 2=CRIT, 3=ERR, 4=WARNING, 5=NOTICE, 6=INFO, 7=DEBUG. Messages below console_loglevel appear on console. Default: 4 (KERN_WARNING and above).',d:'0=EMERG, 1=ALERT, 2=CRIT, 3=ERR, 4=WARNING, 5=NOTICE, 6=INFO, 7=DEBUG. Messages below console_loglevel appear on console. Default: 4 (KERN_WARNING and above).',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'linux',p:0,q:'What is the __init and __initdata annotation?',a:'`__init`: function only needed during initialization. Memory freed after init. `__initdata`: same for data. Saves memory in running kernel. If module is built-in, this memory is reclaimed. If loadable module, __init memory freed after successful insmod.',d:'`__init`: function only needed during initialization. Memory freed after init. `__initdata`: same for data. Saves memory in running kernel. If module is built-in, this memory is reclaimed. If loadable module, __init memory freed after successful insmod.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:1,q:'kmalloc vs vmalloc vs kzalloc — when to use each?',a:'`kmalloc`: physically contiguous, fast, < 128KB, for DMA-able buffers. `vmalloc`: virtually contiguous only, large allocations, slower, can&rsquo;t DMA. `kzalloc`: kmalloc + zero-initialized. Rule: use kzalloc for structures, kmalloc for DMA, vmalloc for large non-DMA.',d:'`kmalloc`: physically contiguous, fast, < 128KB, for DMA-able buffers. `vmalloc`: virtually contiguous only, large allocations, slower, can&rsquo;t DMA. `kzalloc`: kmalloc + zero-initialized. Rule: use kzalloc for structures, kmalloc for DMA, vmalloc for large non-DMA.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:1,q:'What is GFP_KERNEL vs GFP_ATOMIC?',a:'`GFP_KERNEL`: normal allocation, can sleep (block) waiting for memory. Use in process context. `GFP_ATOMIC`: cannot sleep, for interrupt context or spinlock-held context. May fail more often because can&rsquo;t reclaim memory.',d:'`GFP_KERNEL`: normal allocation, can sleep (block) waiting for memory. Use in process context. `GFP_ATOMIC`: cannot sleep, for interrupt context or spinlock-held context. May fail more often because can&rsquo;t reclaim memory.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'What is the slab allocator?',a:'Caches of commonly-sized objects. Reduces fragmentation vs raw page allocation. Kernel uses SLUB (default), SLAB, or SLOB. `kmem_cache_create()` for driver-specific caches. View: `cat /proc/slabinfo`.',d:'Caches of commonly-sized objects. Reduces fragmentation vs raw page allocation. Kernel uses SLUB (default), SLAB, or SLOB. `kmem_cache_create()` for driver-specific caches. View: `cat /proc/slabinfo`.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'Explain the page allocator (buddy system).',a:'Allocates physical pages in powers of 2 (1, 2, 4, 8&hellip; pages). Fast allocation/freeing. Handles fragmentation by splitting and merging buddies. `alloc_pages()` returns `struct page*`.',d:'Allocates physical pages in powers of 2 (1, 2, 4, 8&hellip; pages). Fast allocation/freeing. Handles fragmentation by splitting and merging buddies. `alloc_pages()` returns `struct page*`.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:1,q:'What is `devm_kzalloc` and why use it?',a:'&ldquo;Managed&rdquo; allocation — automatically freed when device is removed or probe fails. No need to manually free in remove() or error paths. Almost always preferred in modern drivers. `devm_*` family includes devm_ioremap, devm_request_irq, etc.',d:'&ldquo;Managed&rdquo; allocation — automatically freed when device is removed or probe fails. No need to manually free in remove() or error paths. Almost always preferred in modern drivers. `devm_*` family includes devm_ioremap, devm_request_irq, etc.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'What is DMA-able memory? How do you allocate it?',a:'Memory accessible by hardware DMA engines. Must be physically contiguous. Use `dma_alloc_coherent()` for consistent DMA, `dma_map_single()` for streaming DMA. Never use vmalloc for DMA.',d:'Memory accessible by hardware DMA engines. Must be physically contiguous. Use `dma_alloc_coherent()` for consistent DMA, `dma_map_single()` for streaming DMA. Never use vmalloc for DMA.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:1,q:'What is the difference between `ioremap` and `mmap`?',a:'`ioremap()`: kernel function, maps physical I/O addresses into kernel virtual space. Returns `void __iomem*`. Use to access hardware registers from driver. `mmap()`: user syscall, maps files/memory into user virtual space.',d:'`ioremap()`: kernel function, maps physical I/O addresses into kernel virtual space. Returns `void __iomem*`. Use to access hardware registers from driver. `mmap()`: user syscall, maps files/memory into user virtual space.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'What is `__iomem` annotation?',a:'Sparse annotation marking pointers to I/O memory (not regular RAM). Must use `readl()`/`writel()` to access, not direct dereference. Sparse checker warns if you dereference __iomem directly.',d:'Sparse annotation marking pointers to I/O memory (not regular RAM). Must use `readl()`/`writel()` to access, not direct dereference. Sparse checker warns if you dereference __iomem directly.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:1,q:'What is copy_to_user / copy_from_user?',a:'Safe data transfer between kernel and user address spaces. Validates user pointer, handles page faults, returns number of bytes NOT copied (0=success). Using memcpy with user pointers would crash kernel on bad addresses.',d:'Safe data transfer between kernel and user address spaces. Validates user pointer, handles page faults, returns number of bytes NOT copied (0=success). Using memcpy with user pointers would crash kernel on bad addresses.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'What is the high memory problem (32-bit)?',a:'32-bit kernel: ~1GB virtual address space. If system has >1GB RAM, some physical pages can&rsquo;t be permanently mapped. These are &ldquo;high memory&rdquo; pages, accessed via temporary mappings (`kmap()`/`kunmap()`). Not an issue on 64-bit.',d:'32-bit kernel: ~1GB virtual address space. If system has >1GB RAM, some physical pages can&rsquo;t be permanently mapped. These are &ldquo;high memory&rdquo; pages, accessed via temporary mappings (`kmap()`/`kunmap()`). Not an issue on 64-bit.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'What is MMIO vs Port I/O?',a:'MMIO: hardware registers mapped to memory addresses, accessed with readl/writel. Standard on ARM/modern x86. Port I/O: separate I/O address space on x86, accessed with inb/outb. Legacy x86 peripherals use port I/O.',d:'MMIO: hardware registers mapped to memory addresses, accessed with readl/writel. Standard on ARM/modern x86. Port I/O: separate I/O address space on x86, accessed with inb/outb. Legacy x86 peripherals use port I/O.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'Explain kernel virtual address space layout.',a:'On 64-bit x86: User space 0x0-0x7FFF&hellip; (128TB). Kernel starts at 0xFFFF&hellip; Direct mapping of all physical RAM. vmalloc area. Module space. fixmap area.',d:'On 64-bit x86: User space 0x0-0x7FFF&hellip; (128TB). Kernel starts at 0xFFFF&hellip; Direct mapping of all physical RAM. vmalloc area. Module space. fixmap area.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:1,q:'What is a memory barrier and why needed?',a:'CPUs/compilers reorder memory operations for performance. Barriers enforce ordering. `smp_rmb()`: read barrier. `smp_wmb()`: write barrier. `smp_mb()`: full barrier. I/O functions and locks include appropriate barriers.',d:'CPUs/compilers reorder memory operations for performance. Barriers enforce ordering. `smp_rmb()`: read barrier. `smp_wmb()`: write barrier. `smp_mb()`: full barrier. I/O functions and locks include appropriate barriers.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'What is NUMA-aware allocation?',a:'Non-Uniform Memory Access: different CPU/memory node distances. `kmalloc_node()` allocates from specific NUMA node. Important for performance on multi-socket servers.',d:'Non-Uniform Memory Access: different CPU/memory node distances. `kmalloc_node()` allocates from specific NUMA node. Important for performance on multi-socket servers.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'mem',p:0,q:'What is kernel OOM (Out of Memory) killer?',a:'When system runs out of memory, OOM killer selects and terminates a process to free memory. Selection based on memory usage, oom_score_adj. Kernel drivers should handle allocation failures gracefully.',d:'When system runs out of memory, OOM killer selects and terminates a process to free memory. Selection based on memory usage, oom_score_adj. Kernel drivers should handle allocation failures gracefully.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'Character vs Block vs Network devices — explain each.',a:'Character: byte-stream, sequential, no caching (serial ports, sensors). Block: random access, sector-based, kernel provides caching (disks, flash). Network: packet-based, special subsystem, no /dev entry (eth0, wlan0).',d:'Character: byte-stream, sequential, no caching (serial ports, sensors). Block: random access, sector-based, kernel provides caching (disks, flash). Network: packet-based, special subsystem, no /dev entry (eth0, wlan0).',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'Walk me through what happens when user calls `open("/dev/mydev")`.',a:'VFS resolves path to inode. 2. Inode has major/minor number. 3. Kernel looks up character device by major number → finds your `struct cdev`. 4. Gets `file_operations` from cdev. 5. Allocates `struct file`. 6. Calls your `.open()` handler, passing inode and file. 7. Returns fd to user.',d:'VFS resolves path to inode. 2. Inode has major/minor number. 3. Kernel looks up character device by major number → finds your `struct cdev`. 4. Gets `file_operations` from cdev. 5. Allocates `struct file`. 6. Calls your `.open()` handler, passing inode and file. 7. Returns fd to user.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'What is `file_operations` structure?',a:'Table of function pointers that defines how a character device responds to file operations: `.open()`, `.read()`, `.write()`, `.release()`, `.unlocked_ioctl()`, `.llseek()`, `.mmap()`, `.poll()`. This is effectively a vtable — polymorphism in C.',d:'Table of function pointers that defines how a character device responds to file operations: `.open()`, `.read()`, `.write()`, `.release()`, `.unlocked_ioctl()`, `.llseek()`, `.mmap()`, `.poll()`. This is effectively a vtable — polymorphism in C.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:0,q:'Explain `struct file` vs `struct inode`.',a:'`inode`: represents a file on disk/filesystem. One per file. Contains permissions, size, device numbers. Persists as long as file exists. `file`: represents an open instance of a file. One per open() call. Contains position (f_pos), flags, private_data. Multiple file structs can point to same inode.',d:'`inode`: represents a file on disk/filesystem. One per file. Contains permissions, size, device numbers. Persists as long as file exists. `file`: represents an open instance of a file. One per open() call. Contains position (f_pos), flags, private_data. Multiple file structs can point to same inode.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:0,q:'What is `file->private_data` and how do you use it?',a:'`void*` in struct file for driver-private data. Set in `.open()`: `filp->private_data = my_device_struct;`. Read in `.read()`, `.write()`, `.ioctl()`. Allows one driver to handle multiple devices — private_data points to per-device state.',d:'`void*` in struct file for driver-private data. Set in `.open()`: `filp->private_data = my_device_struct;`. Read in `.read()`, `.write()`, `.ioctl()`. Allows one driver to handle multiple devices — private_data points to per-device state.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'Why `container_of` in open() instead of global variable?',a:'Multiple device instances. `container_of(inode->i_cdev, struct my_dev, cdev)` recovers your device struct from the cdev embedded in it. Global variable only works for single device.',d:'Multiple device instances. `container_of(inode->i_cdev, struct my_dev, cdev)` recovers your device struct from the cdev embedded in it. Global variable only works for single device.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'Explain `alloc_chrdev_region` vs `register_chrdev_region`.',a:'`alloc_chrdev_region`: kernel chooses major number dynamically. Preferred — avoids conflicts. `register_chrdev_region`: you specify major number. Static allocation — risk of conflict. Old API.',d:'`alloc_chrdev_region`: kernel chooses major number dynamically. Preferred — avoids conflicts. `register_chrdev_region`: you specify major number. Static allocation — risk of conflict. Old API.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'What is `cdev_init` + `cdev_add`?',a:'`cdev_init(&cdev, &fops)`: initialize cdev with your file_operations. `cdev_add(&cdev, dev_t, count)`: register with kernel, making device callable. Must do both — init sets up fops, add makes it findable by VFS.',d:'`cdev_init(&cdev, &fops)`: initialize cdev with your file_operations. `cdev_add(&cdev, dev_t, count)`: register with kernel, making device callable. Must do both — init sets up fops, add makes it findable by VFS.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:0,q:'What is `class_create` + `device_create`?',a:'`class_create("my_class")`: creates device class in `/sys/class/my_class/`. `device_create(class, parent, dev_t, data, "mydev%d", minor)`: creates device entry → triggers udev → creates `/dev/mydevN` automatically. Without this, user must manually `mknod`.',d:'`class_create("my_class")`: creates device class in `/sys/class/my_class/`. `device_create(class, parent, dev_t, data, "mydev%d", minor)`: creates device entry → triggers udev → creates `/dev/mydevN` automatically. Without this, user must manually `mknod`.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'Explain IOCTL — what it is and how to implement.',a:'IOCTL (I/O Control): custom device commands beyond read/write. Define commands with macros: `_IO(magic, nr)` (no data), `_IOR(magic, nr, type)` (read from driver), `_IOW(magic, nr, type)` (write to driver), `_IOWR` (both). Handler validates magic with `_IOC_TYPE(cmd)`, uses switch on command, copy_to/from_user for data.',d:'IOCTL (I/O Control): custom device commands beyond read/write. Define commands with macros: `_IO(magic, nr)` (no data), `_IOR(magic, nr, type)` (read from driver), `_IOW(magic, nr, type)` (write to driver), `_IOWR` (both). Handler validates magic with `_IOC_TYPE(cmd)`, uses switch on command, copy_to/from_user for data.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'What is the difference between `mutex_lock` and `mutex_lock_interruptible`?',a:'`mutex_lock`: blocks until available, cannot be interrupted by signals. `mutex_lock_interruptible`: can be interrupted — returns `-ERESTARTSYS` if signal received. Use interruptible in drivers so Ctrl+C works when user process is blocked.',d:'`mutex_lock`: blocks until available, cannot be interrupted by signals. `mutex_lock_interruptible`: can be interrupted — returns `-ERESTARTSYS` if signal received. Use interruptible in drivers so Ctrl+C works when user process is blocked.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:0,q:'How do you handle concurrent access to your driver?',a:'Use mutex for process-context operations (read/write/ioctl). Lock before accessing shared data, unlock after. Use `mutex_lock_interruptible()` for tasks that user should be able to cancel. For ISR+process interaction: spinlock + irqsave.',d:'Use mutex for process-context operations (read/write/ioctl). Lock before accessing shared data, unlock after. Use `mutex_lock_interruptible()` for tasks that user should be able to cancel. For ISR+process interaction: spinlock + irqsave.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:0,q:'What is a device node and how is it created?',a:'Special file in /dev with major:minor numbers. Created by: 1) `device_create()` + udev (automatic, preferred), 2) `mknod /dev/mydev c MAJOR MINOR` (manual), 3) devtmpfs (early boot).',d:'Special file in /dev with major:minor numbers. Created by: 1) `device_create()` + udev (automatic, preferred), 2) `mknod /dev/mydev c MAJOR MINOR` (manual), 3) devtmpfs (early boot).',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'What is the probe/remove lifecycle?',a:'Modern Linux driver model. `probe()`: called when kernel matches device to driver (by compatible string or name). Initialize hardware, allocate resources, register interfaces. `remove()`: called on unload. Release resources. With `devm_*`, remove() can often be empty.',d:'Modern Linux driver model. `probe()`: called when kernel matches device to driver (by compatible string or name). Initialize hardware, allocate resources, register interfaces. `remove()`: called on unload. Release resources. With `devm_*`, remove() can often be empty.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
{s:'char',p:1,q:'What is deferred probing (`-EPROBE_DEFER`)?',a:'If probe() depends on resource not yet available (clock, regulator, GPIO controller), return `-EPROBE_DEFER`. Kernel retries later when more subsystems are initialized. Essential for handling driver initialization ordering.',d:'If probe() depends on resource not yet available (clock, regulator, GPIO controller), return `-EPROBE_DEFER`. Kernel retries later when more subsystems are initialized. Essential for handling driver initialization ordering.',f:['Explain in your own words.','When would this matter in a real driver?','How would you verify this in practice?']},
