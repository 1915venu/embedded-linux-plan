{id:'05',sec:'dt',icon:'🌳',title:'Phase 5: Device Tree & Platform',secs:[{h:'🧠 THEORY: Why Device Tree Exists',b:'␀CODE␀BEFORE Device Tree (pre-2012):\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\narm/mach-omap2/board-beagle.c  ← Board-specific C code\narm/mach-omap2/board-panda.c  ← Another board\narm/mach-exynos/mach-smdk.c  ← Samsung board\narm/mach-tegra/board-harmony.c  ← NVIDIA board\n...\nHUNDREDS of board files, each compiling different kernel!\n\nLinus Torvalds (2011):  This is a f***ing mess \n\nAFTER Device Tree:\n━━━━━━━━━━━━━━━━━━\nOne kernel binary (vmlinuz) works on ALL boards.\nHardware differences described in .dtb (Device Tree Blob):\n  arch/arm/boot/dts/am335x-boneblack.dts  ← BeagleBone Black\n  arch/arm/boot/dts/sun8i-h3-orangepi.dts  ← Orange Pi\n  arch/arm/boot/dts/bcm2711-rpi-4-b.dts  ← Raspberry Pi 4\n\nBootloader loads correct .dtb for the board → Kernel configures itself␀ENDCODE␀'},{h:'🧠 THEORY: Device Tree Syntax',b:'␀CODE␀/* A DTS (Device Tree Source) file is a tree of nodes */\n/dts-v1/;\n\n/ {  /* Root node */\n  model =  My Custom Board ;\n  compatible =  myvendor,myboard ;\n\n  /* Each node represents a hardware component */\n  /* Node name format: name@unit-address */\n\n  memory@80000000 {\n  device_type =  memory ;\n  reg = ;  /* base=0x8000_0000, size=512MB */\n  };\n\n  /* Peripherals section */\n  soc {\n  compatible =  simple-bus ;\n  #address-cells = ;  /* Child reg addresses are 1 cell (32-bit) */\n  #size-cells = ;  /* Child reg sizes are 1 cell (32-bit) */\n  ranges;  /* 1:1 address translation */\n\n  uart0: serial@44e09000 {\n  compatible =  ti,am335x-uart ;  /* KEY: matches driver! */\n  reg = ;  /* Base address, size */\n  interrupts = ;  /* IRQ number */\n  clock-frequency = ;  /* 48 MHz */\n  status =  okay ;  /* enabled */\n  };\n\n  i2c0: i2c@44e0b000 {\n  compatible =  ti,omap4-i2c ;\n  reg = ;\n  interrupts = ;\n  #address-cells = ;  /* I2C child = address only */\n  #size-cells = ;  /* No size for I2C */\n  clock-frequency = ;  /* 400 kHz fast mode */\n  status =  okay ;\n\n  /* Devices ON the I2C bus (children) */\n  temp_sensor: tmp102@48 {\n  compatible =  ti,tmp102 ;  /* Matches I2C driver! */\n  reg = ;  /* I2C address (7-bit) */\n  #io-channel-cells = ;\n  };\n\n  eeprom@50 {\n  compatible =  atmel,24c256 ;\n  reg = ;\n  };\n  };\n\n  gpio0: gpio@44e07000 {\n  compatible =  ti,omap4-gpio ;\n  reg = ;\n  interrupts = ;\n  gpio-controller;\n  #gpio-cells = ;  /* gpio num + flags */\n  };\n  };\n\n  /* LEDs described in DT */\n  leds {\n  compatible =  gpio-leds ;\n\n  heartbeat {\n  label =  my-led ;\n  gpios = ;\n  linux,default-trigger =  heartbeat ;\n  };\n  };\n};␀ENDCODE␀'},{h:'🧠 THEORY: Key Properties Reference',b:'Property\nPurpose\nExample\n\n `compatible` |\n **Matches device to driver** |\n `"ti,tmp102"` |\n\n `reg` |\n Register addresses & sizes / bus address |\n `<0x44e09000 0x2000>` |\n\n `interrupts` |\n Interrupt specification |\n `<GIC_SPI 45 IRQ_TYPE_LEVEL_HIGH>` |\n\n `status` |\n Enable/disable device |\n `"okay"` or `"disabled"` |\n\n `clocks` |\n Clock references |\n `<&clock_ctrl 5>` |\n\n `clock-frequency` |\n Clock speed |\n `<400000>` |\n\n `#address-cells` |\n Address width for children |\n `<1>` = 32-bit |\n\n `#size-cells` |\n Size width for children |\n `<0>` = no size |\n\n `ranges` |\n Address translation |\n Empty = 1:1 |\n\n `phandle` |\n Reference to another node |\n `<&gpio0>` |'},{h:'🧠 THEORY: Compatible String Matching — The Heart of DT',b:'␀CODE␀How matching works:\n\nDevice Tree node:\n  temp_sensor {\n  compatible =  ti,tmp102 ,  ti,tmp100 ,  generic-temp ;\n  };  ↑ most specific  ↑ fallback\n\nDriver code:\n  static const struct of_device_id my_match[] = {\n  { .compatible =  ti,tmp102 , .data = &tmp102_config },\n  { .compatible =  generic-temp , .data = &generic_config },\n  { }  ← terminator\n  };\n\nMatching process (kernel tries in order):\n1. Try  ti,tmp102  → FOUND in driver! Use tmp102_config ✓\n2. (If not found, try  ti,tmp100 ) → Not in driver\n3. (If not found, try  generic-temp ) → Found in driver as fallback\n\nBEST PRACTICE for compatible:\n vendor,specific-version ,  vendor,generic-version ␀ENDCODE␀'},{h:'💻 COMPLETE CODE: DT Property Reading Demo',b:'␀CODE␀// File: ~/embedded_learning/day_23/dt_demo/dt_demo.c\n// This platform driver demonstrates reading DT properties\n// It won\'t match real hardware — it\'s for learning the APIs\n\n#include \n#include \n#include \n#include \n#include \n\nMODULE_LICENSE( GPL );\n\nstatic int dt_demo_probe(struct platform_device *pdev)\n{\n  struct device *dev = &pdev->dev;\n  struct device_node *np = dev->of_node;\n  u32 value;\n  const char *str;\n  int ret;\n\n  dev_info(dev,  Probe called!\\n );\n\n  /* Read single u32 property */\n  ret = of_property_read_u32(np,  my-frequency , &value);\n  if (ret == 0)\n  dev_info(dev,  Frequency: %u Hz\\n , value);\n  else\n  dev_info(dev,  No frequency property\\n );\n\n  /* Read string property */\n  ret = of_property_read_string(np,  my-label , &str);\n  if (ret == 0)\n  dev_info(dev,  Label: %s\\n , str);\n\n  /* Read boolean property (presence = true) */\n  if (of_property_read_bool(np,  my-feature-enabled ))\n  dev_info(dev,  Feature is ENABLED\\n );\n  else\n  dev_info(dev,  Feature is DISABLED\\n );\n\n  /* Read array */\n  u32 arr[4];\n  int count = of_property_count_u32_elems(np,  my-array );\n  if (count > 0 && count  1 ? arr[1] : 0,\n  count > 2 ? arr[2] : 0,\n  count > 3 ? arr[3] : 0, count);\n  }\n\n  /* Get version-specific data from compatible match */\n  const struct of_device_id *match = of_match_device(\n  pdev->dev.driver->of_match_table, dev);\n  if (match && match->data)\n  dev_info(dev,  Match data pointer: %p\\n , match->data);\n\n  dev_info(dev,  Probe complete!\\n );\n  return 0;\n}\n\nstatic int dt_demo_remove(struct platform_device *pdev)\n{\n  dev_info(&pdev->dev,  Remove called\\n );\n  return 0;\n}\n\nstatic const struct of_device_id dt_demo_of_match[] = {\n  { .compatible =  demo,dt-learning , },\n  { }\n};\nMODULE_DEVICE_TABLE(of, dt_demo_of_match);\n\nstatic struct platform_driver dt_demo_driver = {\n  .probe = dt_demo_probe,\n  .remove = dt_demo_remove,\n  .driver = {\n  .name =  dt_demo ,\n  .of_match_table = dt_demo_of_match,\n  },\n};\n\nmodule_platform_driver(dt_demo_driver);␀ENDCODE␀'},{h:'DT Overlay for Testing (without real hardware)',b:'␀CODE␀// File: ~/embedded_learning/day_23/dt_demo/demo_overlay.dts\n/dts-v1/;\n/plugin/;\n\n/ {\n  fragment@0 {\n  target-path =  / ;\n  __overlay__ {\n  dt_demo_device {\n  compatible =  demo,dt-learning ;\n  my-frequency = ;\n  my-label =  test-sensor ;\n  my-feature-enabled;\n  my-array = ;\n  status =  okay ;\n  };\n  };\n  };\n};␀ENDCODE␀'},{h:'🧠 THEORY: Platform Driver Model',b:'␀CODE␀In the kernel, there are multiple BUS TYPES:\n\n┌──────────────────────────────────────────────────────┐\n│  Linux Driver Model  │\n│  │\n│  ┌─────────┐  ┌──────┐  ┌──────┐  ┌─────┐  ┌─────┐ │\n│  │Platform  │  │ I2C  │  │ SPI  │  │ PCI │  │ USB │ │\n│  │  Bus  │  │ Bus  │  │ Bus  │  │ Bus │  │ Bus │ │\n│  └────┬────┘  └───┬──┘  └───┬──┘  └──┬──┘  └──┬──┘ │\n│  │  │  │  │  │  │\n│  On-SoC  I2C devices  SPI  PCIe  USB  │\n│  peripherals  (sensors,  devices  cards  devices  │\n│  (UART, GPIO, EEPROM)  (flash)  │\n│  Timer, DMA)  │\n└──────────────────────────────────────────────────────┘\n\nPlatform Bus = for devices directly connected to SoC\n  - Addressable via memory-mapped I/O\n  - Not on a discoverable bus (unlike PCI/USB)\n  - Described in Device Tree or ACPI␀ENDCODE␀'},{h:'🧠 THEORY: probe() and remove() — The Full Story',b:'␀CODE␀DRIVER REGISTRATION  DEVICE DISCOVERY\n(when module loads)  (from Device Tree)\n  │  │\n  │  module_platform_driver()  │  Kernel parses DTB\n  │  ├── registers with platform bus  │  ├── Creates platform_device\n  │  ├── provides of_match_table  │  │  for each DT node\n  │  └── provides probe/remove  │  └── Adds to platform bus\n  │  │\n  └──────────────────┬───────────────────┘\n  │\n  ▼\n  MATCHING (by platform bus)\n  Compare device\'s compatible string\n  with driver\'s of_match_table\n  │\n  ▼ (MATCH!)\n  probe(platform_device *pdev)\n  ├── Get resources from DT:\n  │  ├── devm_platform_ioremap_resource()  → registers\n  │  ├── platform_get_irq()  → IRQ\n  │  ├── devm_clk_get()  → clock\n  │  └── of_property_read_*()  → custom props\n  ├── Initialize hardware\n  ├── Register with subsystem\n  │  └── (hwmon, input, net, char device, etc.)\n  └── Return 0 (success) or negative error\n\n  remove(platform_device *pdev)\n  ├── Unregister from subsystem\n  ├── Release resources\n  │  (devm_* resources auto-freed!)\n  └── Return 0␀ENDCODE␀'},{h:'💻 COMPLETE CODE: Platform Driver',b:'␀CODE␀// File: ~/embedded_learning/day_25/platform_drv/myplat.c\n#include \n#include \n#include \n#include \n#include \n#include \n\nMODULE_LICENSE( GPL );\nMODULE_DESCRIPTION( Platform driver learning example );\n\n/* Version-specific configuration via match data */\nstruct mydev_config {\n  const char *name;\n  int features;\n  int max_speed;\n};\n\nstatic const struct mydev_config v1_config = {\n  .name =  MyDevice-v1 ,\n  .features = 3,\n  .max_speed = 100000,\n};\n\nstatic const struct mydev_config v2_config = {\n  .name =  MyDevice-v2 ,\n  .features = 7,\n  .max_speed = 400000,\n};\n\n/* Per-device instance data */\nstruct mydev_data {\n  void __iomem *base;  /* Memory-mapped register base */\n  int irq;  /* IRQ number */\n  const struct mydev_config *config;\n  struct device *dev;\n};\n\nstatic int mydev_probe(struct platform_device *pdev)\n{\n  struct device *dev = &pdev->dev;\n  struct mydev_data *data;\n  struct resource *res;\n  int ret;\n\n  dev_info(dev,  Probe starting\\n );\n\n  /* Allocate per-device data (managed — auto-freed!) */\n  data = devm_kzalloc(dev, sizeof(*data), GFP_KERNEL);\n  if (!data)\n  return -ENOMEM;\n\n  data->dev = dev;\n\n  /* Get version-specific config from DT match */\n  data->config = of_device_get_match_data(dev);\n  if (!data->config) {\n  dev_err(dev,  No match data!\\n );\n  return -ENODEV;\n  }\n  dev_info(dev,  Matched: %s (features=%d, speed=%d)\\n ,\n  data->config->name, data->config->features,\n  data->config->max_speed);\n\n  /* Get memory resource from DT \'reg\' property */\n  /* devm_platform_ioremap_resource does:\n  * 1. platform_get_resource(pdev, IORESOURCE_MEM, 0)\n  * 2. devm_request_mem_region()\n  * 3. devm_ioremap()\n  * All managed — auto-cleaned-up!\n  */\n  data->base = devm_platform_ioremap_resource(pdev, 0);\n  if (IS_ERR(data->base)) {\n  /* On simulated/VM environment, this is expected to fail */\n  dev_warn(dev,  No memory resource (expected in VM)\\n );\n  data->base = NULL;\n  } else {\n  dev_info(dev,  Mapped registers at %p\\n , data->base);\n  /* Access registers: readl(data->base + OFFSET) */\n  }\n\n  /* Get IRQ from DT \'interrupts\' property */\n  data->irq = platform_get_irq(pdev, 0);\n  if (data->irq > 0) {\n  dev_info(dev,  IRQ: %d\\n , data->irq);\n  /* Would devm_request_irq here */\n  } else {\n  dev_warn(dev,  No IRQ (expected in VM)\\n );\n  }\n\n  /* Read custom DT properties */\n  u32 custom_val;\n  ret = of_property_read_u32(dev->of_node,  custom-property , &custom_val);\n  if (ret == 0)\n  dev_info(dev,  Custom property: %u\\n , custom_val);\n\n  /* Store driver data in platform device */\n  platform_set_drvdata(pdev, data);\n\n  dev_info(dev,  Probe complete!\\n );\n  return 0;\n}\n\nstatic int mydev_remove(struct platform_device *pdev)\n{\n  struct mydev_data *data = platform_get_drvdata(pdev);\n\n  /* With devm_* functions, most cleanup is automatic!\n  * Only need to unregister from subsystems here */\n\n  dev_info(data->dev,  Removed (%s)\\n , data->config->name);\n  return 0;\n}\n\n/* DT compatible matching table */\nstatic const struct of_device_id mydev_of_match[] = {\n  { .compatible =  myvendor,mydevice-v1 , .data = &v1_config },\n  { .compatible =  myvendor,mydevice-v2 , .data = &v2_config },\n  { }\n};\nMODULE_DEVICE_TABLE(of, mydev_of_match);\n\n/* Platform driver registration */\nstatic struct platform_driver mydev_driver = {\n  .probe = mydev_probe,\n  .remove = mydev_remove,\n  .driver = {\n  .name =  mydevice ,\n  .of_match_table = mydev_of_match,\n  },\n};\n\n/* This macro creates init/exit that register/unregister the driver */\nmodule_platform_driver(mydev_driver);␀ENDCODE␀'},{h:'📝 INTERVIEW QUESTIONS — Device Tree Platform (16 Questions)',b:'**Q1: What is Device Tree? Why was it introduced?**\n\nHardware description separate from code. Before DT: every ARM board = custom C file = separate kernel compile. DT lets one kernel binary work on many boards. Only the .dtb file changes per hardware.\n\n**Q2: What is the compatible property and how does matching work?**\n\nString list identifying device. Driver provides of_match_table. Kernel tries each compatible string until match found. First = most specific. Allows fallback matching.\n\n**Q3: What is #address-cells and #size-cells?**\n\nSpecify format of reg property in child nodes. address-cells=1: 32-bit addresses. size-cells=0: no size (I2C addresses are just addresses). size-cells=1: 32-bit sizes.\n\n**Q4: What is devm_platform_ioremap_resource?**\n\nOne function that: gets resource from DT, requests memory region (prevents conflicts), maps physical to kernel virtual address. All managed — freed on error/remove. Replaces 3 separate calls.\n\n**Q5: What is platform_get_irq?**\n\nGets IRQ number from DT interrupts property. Handles IRQ domain translation. Returns IRQ number ready for request_irq().\n\n**Q6: Explain of_device_get_match_data.**\n\nReturns .data pointer from matching of_device_id entry. Use for version-specific config without runtime string comparison. Kernel already did matching — just retrieve the data.\n\n**Q7: What is module_platform_driver macro?**\n\nCreates __init and __exit functions that register/unregister the platform driver. Equivalent to: init → platform_driver_register(), exit → platform_driver_unregister(). Less boilerplate.\n\n**Q8: Platform driver vs character driver — relationship?**\n\nPlatform driver handles device discovery (probe/remove via DT). Character driver handles user-space interface (read/write/ioctl). A real driver often IS BOTH: platform driver for HW interaction, creates chardev for user interface.\n\n**Q9: What is deferred probing and when does it happen?**\n\nprobe() returns -EPROBE_DEFER when a dependency isn t ready (clock, regulator, GPIO). Kernel queues the device and retries later. Essential for non-deterministic driver initialization order.\n\n**Q10: How do you handle device tree overlays?**\n\nOverlays modify base DT at runtime. Used for: hardware add-ons (RPi HATs), enabling peripherals, hot-pluggable devices. Applied via configfs: `/sys/kernel/config/device-tree/overlays/`.\n\n**Q11: What is the ranges property?**\n\nAddress translation between parent and child. Empty ranges = 1:1 mapping (child addresses = parent addresses). Non-empty: specifies translation offsets.\n\n**Q12: How does your driver know the register base address?**\n\nFrom DT reg property. In probe: devm_platform_ioremap_resource(pdev, 0) reads first reg entry. Returns virtual address. Access registers with readl/writel.\n\n**Q13: What is MMIO? How do you access it safely?**\n\nMemory-Mapped I/O: hardware registers at specific physical addresses. In driver: ioremap maps to kernel virtual address. Use readl()/writel() (not pointer dereference!) — they include memory barriers.\n\n**Q14: Difference between readl/writel and ioread32/iowrite32?**\n\nreadl/writel: for MMIO (memory-mapped). ioread32/iowrite32: work for both MMIO and port I/O (x86). Modern drivers should use ioread/iowrite for portability.\n\n**Q15: What happens if your driver s probe fails?**\n\nReturn negative errno. devm_* resources auto-freed. Device stays unbound. dmesg shows error. User sees device in /sys/bus/platform/devices/ but not bound to driver.\n\n**Q16: How do you test a platform driver without real hardware?**\n\n• DT overlay to create platform device. 2. QEMU with custom DTB. 3. Use sysfs to manually bind: `echo "mydevice" > /sys/bus/platform/drivers/.../bind`. 4. Module parameter to skip HW checks in probe.\n\n  \n  \n  ← PreviousPhase 4: Char Driver Project\nNext →Phase 6: I2C Project\n  \n  \n  \n\n  \n  ↑'}]},
{id:'06',sec:'bus',icon:'🔌',title:'Phase 6: I2C Project',secs:[{h:'🧠 THEORY: I2C Protocol — Hardware Level',b:'␀CODE␀I2C Bus Physical Layer:\n━━━━━━━━━━━━━━━━━━━━━\nTwo wires, both open-drain with pull-up resistors:\n\nVCC ─────┬──────────┬──────────┬──────────┐\n  │  │  │  │\n  ┌┴┐  ┌┴┐  │  │\n  │R│ 4.7kΩ  │R│ 4.7kΩ  │  │\n  │ │  │ │  │  │\n  └┬┘  └┬┘  │  │\n  │  │  │  │\nSCL ─────┼──────────┼──────┬──┤  │\n  │  │  │  │  │\nSDA ─────┼──────────┼──────┼──┼──┬───────│\n  │  │  │  │  │  │\n  ┌────┴────┐ ┌───┴───┐  │  │  │  │\n  │ Master  │ │ Slave │  │  │  │  │\n  │ (SoC)  │ │ 0x48  │  │  │  │  │\n  │  │ │ Sensor │  │  │  │  │\n  └─────────┘ └───────┘  │  │  │  │\n  ┌─────┴──┴──┴───┐  │\n  │ Slave 0x50  │  │\n  │ EEPROM  │  │\n  └───────────────┘  │\n  ┌──────────┴──┐\n  │ Slave 0x68  │\n  │ RTC  │\n  └─────────────┘␀ENDCODE␀'},{h:'🧠 THEORY: I2C Transaction Format',b:'␀CODE␀WRITE transaction (Master → Slave):\nSTART ──→ ADDR(7) + W(0) ──→ ACK ──→ REG(8) ──→ ACK ──→ DATA(8) ──→ ACK ──→ STOP\n │  │  │  │  │  │  │  │\n SDA↓  Slave  R/W=0  Slave  Register  Slave  Data  Slave\n while  address  =write ACKs  address  ACKs  byte  ACKs\n SCL↑\n\nREAD transaction (Master ← Slave):\nSTART ──→ ADDR+W ──→ ACK ──→ REG ──→ ACK\n  ──→ Sr ──→ ADDR+R ──→ ACK ──→ DATA ──→ NACK ──→ STOP\n  │\n  Slave drives SDA\n  Master reads data\nSr = Repeated START (no STOP between write-reg and read-data)\n\nWhy repeated start?\n  Without: another master could grab bus between our write-reg and read-data\n  With:  atomic operation, bus stays locked␀ENDCODE␀'},{h:'🧠 THEORY: Linux I2C Stack',b:'␀CODE␀┌─────────────────────────────────────────────────────┐\n│  USERSPACE  │\n│  cat /sys/class/hwmon/hwmon0/temp1_input  │\n│  i2cget -y 1 0x48 0x00 w  │\n└──────────────────────┬──────────────────────────────┘\n  │\n┌──────────────────────┼──────────────────────────────┐\n│  KERNEL  │  │\n│  ▼  │\n│  ┌────────────────────────────────┐  │\n│  │  YOUR I2C CLIENT DRIVER  │  ← YOU WRITE  │\n│  │  (temp_sensor_driver)  │  │\n│  │  - probe() / remove()  │  │\n│  │  - uses i2c_smbus_* APIs  │  │\n│  │  - registers with hwmon  │  │\n│  └────────────┬───────────────────┘  │\n│  │ i2c_smbus_read_byte_data()  │\n│  ▼  │\n│  ┌────────────────────────────────┐  │\n│  │  I2C CORE SUBSYSTEM  │  ← KERNEL  │\n│  │  (drivers/i2c/i2c-core-*.c)  │  │\n│  │  - Device/driver matching  │  │\n│  │  - SMBus emulation  │  │\n│  │  - Bus locking  │  │\n│  └────────────┬───────────────────┘  │\n│  │ master_xfer()  │\n│  ▼  │\n│  ┌────────────────────────────────┐  │\n│  │  I2C ADAPTER DRIVER  │  ← SOC VENDOR  │\n│  │  (e.g., i2c-omap, i2c-bcm)  │  │\n│  │  - Programs SoC I2C hardware │  │\n│  │  - Handles interrupts  │  │\n│  └────────────┬───────────────────┘  │\n│  │  │\n└───────────────┼──────────────────────────────────────┘\n  │ Physical I2C bus\n  ▼\n  ┌───────────┐\n  │  HARDWARE  │\n  │  TMP102  │\n  │  addr=0x48 │\n  └───────────┘␀ENDCODE␀'},{h:'🧠 THEORY: Key I2C API Functions',b:'␀CODE␀/* == READING from I2C device == */\n\n// Read a single byte from register\nint val = i2c_smbus_read_byte_data(client, reg_addr);\n// Returns: byte value (0-255) or negative error\n\n// Read 16-bit word from register\nint val = i2c_smbus_read_word_data(client, reg_addr);\n// Returns: 16-bit value (MSB first from bus) or negative error\n\n// Read 16-bit word, byte-swapped (for little-endian hosts)\nint val = i2c_smbus_read_word_swapped(client, reg_addr);\n// Returns: 16-bit value with bytes swapped for host endianness\n\n/* == WRITING to I2C device == */\n\n// Write single byte to register\nint ret = i2c_smbus_write_byte_data(client, reg_addr, value);\n\n// Write 16-bit word to register\nint ret = i2c_smbus_write_word_data(client, reg_addr, value);\n\n// Write 16-bit word, byte-swapped\nint ret = i2c_smbus_write_word_swapped(client, reg_addr, value);\n\n/* == BLOCK transfers == */\nint ret = i2c_smbus_read_i2c_block_data(client, reg, length, buf);\nint ret = i2c_smbus_write_i2c_block_data(client, reg, length, buf);␀ENDCODE␀'},{h:'💻 THE DRIVER — Production Quality',b:'␀CODE␀// File: ~/embedded_learning/day_30/i2c_temp/temp_sensor.c\n//\n// I2C Temperature Sensor Driver (TMP102/TMP112 compatible)\n// Features:\n//  - Device Tree matching with per-variant configuration\n//  - hwmon integration (standard sensor interface)\n//  - Temperature caching (avoid bus flooding)\n//  - sysfs custom attributes\n//  - Managed resources (devm_*)\n//\n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n#include \n\nMODULE_LICENSE( GPL );\nMODULE_AUTHOR( Your Name );\nMODULE_DESCRIPTION( I2C Temperature Sensor Driver (TMP102/TMP112) );\nMODULE_VERSION( 2.0 );\n\n/* ==== REGISTER MAP ==== */\n/* TMP102 registers */\n#define REG_TEMP  0x00  /* Temperature register (16-bit, read-only) */\n#define REG_CONFIG  0x01  /* Configuration register */\n#define REG_TLOW  0x02  /* Low temperature threshold */\n#define REG_THIGH  0x03  /* High temperature threshold */\n\n/* Configuration register bits */\n#define CFG_SD  BIT(0)  /* Shutdown mode */\n#define CFG_TM  BIT(1)  /* Thermostat mode */\n#define CFG_POL  BIT(2)  /* Polarity */\n#define CFG_FQ_MASK  (3> 4) * 625 / 10\n  *\n  * TMP112 (13-bit): Bits [15:3] = temperature, [2:0] = 0\n  *  Raw value shifted left by 3\n  *  Each LSB = 0.0625°C\n  *  Formula: (raw >> 3) * 625 / 10\n  */\n  int shift = 16 - resolution_bits;\n  int temp;\n\n  /* Sign extend if negative (two\'s complement) */\n  if (raw & 0x8000)\n  raw |= 0xFFFF0000;  /* Sign extend to 32-bit */\n\n  temp = (raw >> shift) * 625 / 10;  /* Result in milli-Celsius */\n  return temp;\n}\n\n/* Read temperature with caching */\nstatic int read_temperature(struct temp_sensor_data *data)\n{\n  int ret;\n\n  mutex_lock(&data->lock);\n\n  /* Check cache validity (1 second) */\n  if (data->cache_valid &&\n  time_before(jiffies, data->last_update + HZ)) {\n  ret = data->cached_temp;\n  goto out;\n  }\n\n  /* Read temperature register (16-bit, MSB first) */\n  ret = i2c_smbus_read_word_swapped(data->client, REG_TEMP);\n  if (ret client->dev,\n  Failed to read temperature: %d\\n , ret);\n  goto out;\n  }\n\n  /* Convert raw to milli-Celsius */\n  data->cached_temp = raw_to_millicelsius(ret,\n  data->config->resolution_bits);\n  data->last_update = jiffies;\n  data->cache_valid = true;\n  ret = data->cached_temp;\n\n  dev_dbg(&data->client->dev,  Temperature: %d.%03d°C (raw=0x%04x)\\n ,\n  ret / 1000, abs(ret % 1000), (unsigned int)(ret & 0xFFFF));\n\nout:\n  mutex_unlock(&data->lock);\n  return ret;\n}\n\n/* ==== HWMON INTERFACE ==== */\n\n/* hwmon provides standard sysfs: /sys/class/hwmon/hwmonN/temp1_input */\nstatic int temp_sensor_read(struct device *dev, enum hwmon_sensor_types type,\n  u32 attr, int channel, long *val)\n{\n  struct temp_sensor_data *data = dev_get_drvdata(dev);\n  int ret;\n\n  if (type != hwmon_temp)\n  return -EOPNOTSUPP;\n\n  switch (attr) {\n  case hwmon_temp_input:\n  ret = read_temperature(data);\n  if (ret config->name);\n}\nstatic DEVICE_ATTR_RO(sensor_name);\n\nstatic ssize_t resolution_show(struct device *dev,\n  struct device_attribute *attr, char *buf)\n{\n  struct i2c_client *client = to_i2c_client(dev);\n  struct temp_sensor_data *data = i2c_get_clientdata(client);\n  return scnprintf(buf, PAGE_SIZE,  %d\\n , data->config->resolution_bits);\n}\nstatic DEVICE_ATTR_RO(resolution);\n\nstatic ssize_t raw_temp_show(struct device *dev,\n  struct device_attribute *attr, char *buf)\n{\n  struct i2c_client *client = to_i2c_client(dev);\n  struct temp_sensor_data *data = i2c_get_clientdata(client);\n  int ret;\n\n  ret = i2c_smbus_read_word_swapped(client, REG_TEMP);\n  if (ret dev;\n  int ret;\n\n  dev_info(dev,  Probing I2C temp sensor at 0x%02x\\n , client->addr);\n\n  /* Allocate driver data (managed) */\n  data = devm_kzalloc(dev, sizeof(*data), GFP_KERNEL);\n  if (!data)\n  return -ENOMEM;\n\n  data->client = client;\n  mutex_init(&data->lock);\n  i2c_set_clientdata(client, data);\n\n  /* Get variant config from DT match */\n  data->config = of_device_get_match_data(dev);\n  if (!data->config) {\n  /* Fallback for non-DT matching */\n  data->config = &tmp102_config;\n  }\n\n  dev_info(dev,  Sensor variant: %s (%d-bit resolution)\\n ,\n  data->config->name, data->config->resolution_bits);\n\n  /* Verify sensor is responsive */\n  ret = i2c_smbus_read_word_swapped(client, REG_TEMP);\n  if (ret dev.kobj, temp_sensor_groups);\n  if (ret)\n  dev_warn(dev,  Failed to create sysfs attrs: %d\\n , ret);\n\n  /* Register with hwmon subsystem */\n  data->hwmon_dev = devm_hwmon_device_register_with_info(\n  dev,  temp_sensor , data,\n  &temp_sensor_chip_info, NULL);\n  if (IS_ERR(data->hwmon_dev)) {\n  ret = PTR_ERR(data->hwmon_dev);\n  dev_err(dev,  Failed to register hwmon: %d\\n , ret);\n  sysfs_remove_groups(&client->dev.kobj, temp_sensor_groups);\n  return ret;\n  }\n\n  /* Read first temperature */\n  int temp = read_temperature(data);\n  if (temp > -500000)\n  dev_info(dev,  Current temperature: %d.%03d°C\\n ,\n  temp / 1000, abs(temp % 1000));\n\n  dev_info(dev,  Probe complete (%s, %d-bit)\\n ,\n  data->config->name, data->config->resolution_bits);\n  return 0;\n}\n\nstatic void temp_sensor_remove(struct i2c_client *client)\n{\n  struct temp_sensor_data *data = i2c_get_clientdata(client);\n\n  sysfs_remove_groups(&client->dev.kobj, temp_sensor_groups);\n\n  dev_info(&client->dev,  Removed (%s)\\n , data->config->name);\n}\n\n/* ==== DEVICE MATCHING ==== */\n\n/* Device Tree match table */\nstatic const struct of_device_id temp_sensor_of_match[] = {\n  { .compatible =  ti,tmp102 ,  .data = &tmp102_config },\n  { .compatible =  ti,tmp112 ,  .data = &tmp112_config },\n  { .compatible =  myvendor,temp-sensor , .data = &tmp102_config },\n  { }\n};\nMODULE_DEVICE_TABLE(of, temp_sensor_of_match);\n\n/* Static I2C device ID table (for non-DT systems) */\nstatic const struct i2c_device_id temp_sensor_id[] = {\n  {  tmp102 , 0 },\n  {  tmp112 , 0 },\n  {  temp-sensor , 0 },\n  { }\n};\nMODULE_DEVICE_TABLE(i2c, temp_sensor_id);\n\n/* I2C driver structure */\nstatic struct i2c_driver temp_sensor_driver = {\n  .driver = {\n  .name =  temp_sensor ,\n  .of_match_table = temp_sensor_of_match,\n  },\n  .probe = temp_sensor_probe,\n  .remove = temp_sensor_remove,\n  .id_table = temp_sensor_id,\n};\n\n/* module_i2c_driver creates init/exit for I2C driver registration */\nmodule_i2c_driver(temp_sensor_driver);␀ENDCODE␀'},{h:'💻 MAKEFILE',b:'␀CODE␀# File: ~/embedded_learning/day_30/i2c_temp/Makefile\nobj-m += temp_sensor.o\nKDIR := /lib/modules/$(shell uname -r)/build\nPWD := $(shell pwd)\n\nall:\n  $(MAKE) -C $(KDIR) M=$(PWD) modules\n\nclean:\n  $(MAKE) -C $(KDIR) M=$(PWD) clean\n\ninfo:\n  modinfo temp_sensor.ko␀ENDCODE␀'},{h:'🧠 THEORY: Testing Without Real Hardware',b:'␀CODE␀# Method 1: Use i2c-stub (simulated I2C adapter)\nsudo modprobe i2c-stub chip_addr=0x48\n# Creates fake I2C bus with device at 0x48\n\n# Method 2: Use sysfs to instantiate device on existing bus\necho  tmp102 0x48  | sudo tee /sys/bus/i2c/devices/i2c-1/new_device\n\n# Method 3: Use DT overlay on platforms that support it\n# Load overlay, then load your driver\n\n# Useful commands:\ni2cdetect -l  # List I2C buses\ni2cdetect -y 1  # Scan bus 1 for devices\ni2cdump -y 1 0x48  # Dump all registers\ni2cget -y 1 0x48 0x00 w  # Read temp register (word)\ni2cset -y 1 0x48 0x01 0x6000 w  # Write config register\n\n# After driver loads:\ncat /sys/class/hwmon/hwmon*/temp1_input  # Read temp (milli-Celsius)\ncat /sys/bus/i2c/devices/1-0048/sensor_name\ncat /sys/bus/i2c/devices/1-0048/resolution␀ENDCODE␀'},{h:'📝 INTERVIEW QUESTIONS — I2C Driver (12 Questions)',b:'**Q1: Walk me through your I2C driver s probe path.**\n\nKernel matches DT compatible  ti,tmp102  to my of_match_table. probe() called with i2c_client. I use devm_kzalloc for data, of_device_get_match_data for config. Verify sensor responds with i2c_smbus_read. Register with hwmon via devm_hwmon_device_register_with_info. Read initial temp.\n\n**Q2: Why use i2c_smbus_read_word_swapped vs i2c_smbus_read_word_data?**\n\nI2C sends MSB first. On little-endian hosts (x86, ARM-LE), the bytes arrive reversed. _swapped corrects byte order automatically. Without it, you d need manual be16_to_cpu().\n\n**Q3: Why cache temperature readings?**\n\nPrevents I2C bus flooding if userspace polls rapidly (cat in a loop). Sensor has ~30ms conversion time anyway — faster reads return stale data. Cache valid for 1 second (HZ jiffies). Protected by mutex for thread safety.\n\n**Q4: What is the hwmon subsystem?**\n\nStandard Linux framework for hardware monitoring. Provides consistent sysfs interface (/sys/class/hwmon/). Works with `sensors` command. Temperature in milli-degrees Celsius. My driver just provides read callback — hwmon handles sysfs creation.\n\n**Q5: How does device tree matching work in your driver?**\n\nDT node has compatible =  ti,tmp102 . My driver s of_match_table lists this string with .data pointing to tmp102_config struct. Kernel finds match, calls probe. I get config via of_device_get_match_data — no string comparison needed!\n\n**Q6: How would you add support for a new sensor variant?**\n\n• Add new sensor_config struct with resolution/timing. 2. Add compatible string + config pointer to of_match_table. 3. Add to i2c_device_id table. Done — probe() already handles variants via config struct.\n\n**Q7: What is i2c_set_clientdata/i2c_get_clientdata?**\n\nStores private data pointer in i2c_client struct. Set in probe, get in other callbacks. Like file->private_data but for I2C. Allows recovery of driver state.\n\n**Q8: What errors can I2C operations return?**\n\n-ENODEV: no ACK (device not present). -ETIMEDOUT: bus stuck (clock stretching too long). -EIO: general I/O error (bus error). -EBUSY: bus arbitration lost. Always check return values!\n\n**Q9: What is the difference between i2c_driver and platform_driver?**\n\ni2c_driver: for devices on I2C bus, receives i2c_client. platform_driver: for SoC peripherals, receives platform_device with MMIO resources. Different bus types, same probe/remove model.\n\n**Q10: How is MODULE_DEVICE_TABLE used?**\n\nCreates alias information put in module ELF. depmod reads these aliases. When kernel detects new I2C device (from DT), it uses these aliases to find and auto-load the correct module.\n\n**Q11: What is devm_hwmon_device_register_with_info?**\n\nRegisters sensor with hwmon subsystem using ops/info structs. hwmon creates sysfs files (temp1_input, etc.) and calls your .read()/.write() callbacks. devm_: auto-unregisters on remove.\n\n**Q12: How would you add alarm thresholds to your sensor?**\n\n• Add HWMON_T_MAX and HWMON_T_MIN to channel info. 2. In read callback, handle hwmon_temp_max and hwmon_temp_min. 3. In write callback (make_visible returns 0644), write thresholds to REG_THIGH/REG_TLOW. 4. Optionally: request IRQ for alert pin, report alarm via hwmon.\n\n  \n  \n  ← PreviousPhase 5: Device Tree & Platform\nNext →Phase 7: SPI & Final Prep\n  \n  \n  \n\n  \n  ↑'}]},
{id:'07',sec:'bus2',icon:'🎯',title:'Phase 7: SPI & Final Prep',secs:[{h:'Theory: What is SPI?',b:'SPI (Serial Peripheral Interface) is a synchronous, full-duplex communication protocol commonly used for high-speed peripherals like flash memory, displays, ADCs, and DACs.\n␀CODE␀SPI Signal Lines:\n  MOSI  — Master Out Slave In  (data from master to slave)\n  MISO  — Master In Slave Out  (data from slave to master)\n  SCLK  — Serial Clock  (generated by master)\n  CS/SS — Chip Select  (one per slave, active low)\n\nFull duplex: data flows both directions simultaneously on every clock edge.␀ENDCODE␀'},{h:'Theory: CPOL and CPHA',b:'SPI has four modes defined by Clock Polarity (CPOL) and Clock Phase (CPHA):\n␀CODE␀CPOL=0: Clock idles LOW\nCPOL=1: Clock idles HIGH\n\nCPHA=0: Data sampled on first clock edge\nCPHA=1: Data sampled on second clock edge\n\nMode 0 (CPOL=0, CPHA=0) — most common\nMode 1 (CPOL=0, CPHA=1)\nMode 2 (CPOL=1, CPHA=0)\nMode 3 (CPOL=1, CPHA=1)␀ENDCODE␀\n\nThe slave s datasheet tells you which mode it requires. If the mode is wrong, every byte you read is garbage.'},{h:'Theory: SPI vs I2C',b:'Feature\nI2C\nSPI\n\n Wires |\n 2 (SDA, SCL) |\n 4 per device (MOSI, MISO, SCLK, CS) |\n\n Speed |\n 100kHz / 400kHz / 1MHz |\n 10MHz to 100MHz+ |\n\n Full duplex |\n No |\n Yes |\n\n Addressing |\n 7-bit or 10-bit address |\n Chip Select line |\n\n Multi-device |\n Many on same bus |\n One CS line per device |\n\n Typical use |\n Sensors, EEPROMs, RTCs |\n Flash, displays, ADCs, fast sensors |\n\n**Interview rule of thumb**: Choose I2C when wire count matters and speed is not critical. Choose SPI when speed matters or the device needs full-duplex communication.'},{h:'Theory: Linux SPI Driver Model',b:'Linux SPI follows the same master-controller / device structure as I2C:\n␀CODE␀SPI subsystem:\n\n  struct spi_master  — the SPI controller (hardware bus)\n  struct spi_device  — a device on the SPI bus\n  struct spi_driver  — driver that handles a spi_device\n  struct spi_transfer  — one segment of a SPI transaction\n  struct spi_message  — a sequence of transfers (atomic on the bus)␀ENDCODE␀\n\nSPI messages are composed of one or more transfers. Each transfer describes bytes to send, bytes to receive, and delay settings.'},{h:'Theory: Device Tree for SPI Devices',b:'SPI devices are described as children of the SPI controller node:\n␀CODE␀&spi0 {\n  status =  okay ;\n\n  my_sensor: sensor@0 {\n  compatible =  vendor,my-spi-sensor ;\n  reg = ;  /* chip select 0 */\n  spi-max-frequency = ;\n  spi-cpol;  /* optional: CPOL=1 */\n  spi-cpha;  /* optional: CPHA=1 */\n  };\n};␀ENDCODE␀\n\n`reg` is the chip-select number (0, 1, 2 ), not a memory address as in platform drivers.'},{h:'Theory: SPI Driver Skeleton',b:'␀CODE␀#include \n#include \n#include \n\nstruct my_spi_dev {\n  struct spi_device *spi;\n  /* per-device state */\n};\n\nstatic int my_spi_probe(struct spi_device *spi)\n{\n  struct my_spi_dev *dev;\n\n  dev = devm_kzalloc(&spi->dev, sizeof(*dev), GFP_KERNEL);\n  if (!dev)\n  return -ENOMEM;\n\n  dev->spi = spi;\n  spi_set_drvdata(spi, dev);\n\n  /* Configure SPI mode if needed */\n  spi->mode = SPI_MODE_0;\n  spi->bits_per_word = 8;\n  spi_setup(spi);\n\n  dev_info(&spi->dev,  SPI device probed\\n );\n  return 0;\n}\n\nstatic void my_spi_remove(struct spi_device *spi)\n{\n  dev_info(&spi->dev,  SPI device removed\\n );\n}\n\nstatic const struct of_device_id my_spi_of_match[] = {\n  { .compatible =  vendor,my-spi-sensor  },\n  {}\n};\nMODULE_DEVICE_TABLE(of, my_spi_of_match);\n\nstatic struct spi_driver my_spi_driver = {\n  .driver = {\n  .name  =  my-spi-sensor ,\n  .of_match_table = my_spi_of_match,\n  },\n  .probe  = my_spi_probe,\n  .remove = my_spi_remove,\n};\nmodule_spi_driver(my_spi_driver);\n\nMODULE_LICENSE( GPL );\nMODULE_DESCRIPTION( SPI sensor driver skeleton );␀ENDCODE␀'},{h:'Theory: SPI Transfer Example',b:'␀CODE␀/* Write one byte, read one byte (full duplex) */\nstatic int my_spi_transfer(struct spi_device *spi, u8 tx, u8 *rx)\n{\n  struct spi_transfer t = {\n  .tx_buf = &tx,\n  .rx_buf = rx,\n  .len  = 1,\n  };\n  struct spi_message m;\n\n  spi_message_init(&m);\n  spi_message_add_tail(&t, &m);\n  return spi_sync(spi, &m);\n}\n\n/* Or use the simpler helper for read-after-write */\nstatic int my_spi_write_then_read(struct spi_device *spi,\n  const u8 *txbuf, unsigned txlen,\n  u8 *rxbuf, unsigned rxlen)\n{\n  return spi_write_then_read(spi, txbuf, txlen, rxbuf, rxlen);\n}␀ENDCODE␀'},{h:'Interview Questions — SPI',b:'**Q: What is the difference between I2C and SPI?**\n\nI2C uses two shared wires with addressing for multi-device support, while SPI uses separate chip-select lines per device and is faster. I2C is common for sensors and low-speed devices; SPI is common for flash, displays, and high-throughput ADCs.\n\n**Q: What are CPOL and CPHA?**\n\nCPOL is clock polarity — whether the idle state of the clock is low or high. CPHA is clock phase — whether data is sampled on the first or second clock edge. Together they define four SPI modes (0-3). The device datasheet specifies the required mode.\n\n**Q: When would you choose SPI over I2C?**\n\nWhen speed matters (SPI can run at tens of MHz vs I2C s typical 400kHz), when full-duplex operation is needed, or when the device requires it. I2C is preferred when minimizing wire count is more important than speed.\n\n**Q: What is `spi_message` and `spi_transfer`?**\n\nA `spi_transfer` describes one segment of data exchange (tx buffer, rx buffer, length). A `spi_message` is a list of transfers that the controller executes atomically on the bus. `spi_sync()` blocks until the entire message completes.'},{h:'Theory: What Problem Do They Solve?',b:'When building an embedded Linux system, you need to produce:\n␀CODE␀What you need for a running embedded Linux system:\n  1. Cross-compilation toolchain  (GCC, binutils, libc for target arch)\n  2. Bootloader binary  (U-Boot or similar)\n  3. Linux kernel image + DTB  (bzImage/zImage + .dtb)\n  4. Root filesystem  (BusyBox tools, libraries, app binaries)\n\nWithout a build system: building these manually takes days and is fragile.\nWith Buildroot or Yocto: automated, reproducible builds.␀ENDCODE␀'},{h:'Theory: Buildroot',b:'Buildroot is a simple, Makefile-based build system for generating complete embedded Linux systems.\n\n**What it does:**\n- Downloads source code for all components\n- Cross-compiles them for your target architecture\n- Produces a bootable image you can flash to a board\n\n**Key concepts:**\n␀CODE␀make menuconfig  → configure target arch, packages, kernel version\nmake  → build everything\noutput/images/  → where kernel, DTB, rootfs image appear\noutput/target/  → the root filesystem tree\noutput/staging/  → sysroot for cross-compilation\n\nBoard support:\n  board/// → board-specific configs and patches␀ENDCODE␀\n\n**Strengths:** Simple, fast to learn, fast to build, good for small systems.\n**Limitations:** Not designed for large product lines, limited customization per-package.'},{h:'Theory: Yocto Project',b:'Yocto is a set of tools and processes for creating custom Linux distributions for embedded systems. It uses the BitBake build engine and OpenEmbedded layer system.\n\n**Key concepts:**\n␀CODE␀Layer  → a set of recipes (meta-*, meta-mylayer)\nRecipe (.bb) → build instructions for one package\nBitBake  → the build engine that processes recipes\nImage  → a collection of packages baked into a rootfs\nMACHINE  → the target hardware description\nDISTRO  → the Linux distribution configuration\n\nbitbake core-image-minimal  → build a minimal image\nbitbake -c devshell  → debug a recipe␀ENDCODE␀\n\n**Strengths:** Highly customizable, reproducible, scales to product lines, industry standard for commercial embedded Linux.\n**Limitations:** Steep learning curve, slow initial builds (can take hours).'},{h:'Theory: Buildroot vs Yocto — When to Use Which',b:'Aspect\nBuildroot\nYocto\n\n Learning curve |\n Low |\n High |\n\n Build time |\n Fast (minutes) |\n Slow (hours first time) |\n\n Customization |\n Moderate |\n Extensive |\n\n Package ecosystem |\n Good |\n Very large (OpenEmbedded) |\n\n Best for |\n Prototypes, simple products |\n Complex products, multiple boards |\n\n Industry usage |\n Widely used |\n Industry standard for products |\n\n**Interview answer:**  Buildroot is simpler and faster to learn — I would use it for prototyping or a single-board product. Yocto is the industry standard for products that need long-term maintenance, multiple BSPs, or extensive package customization.'},{h:'Theory: How an Embedded Linux Image Is Assembled',b:'Understanding what goes into a final image is important for interviews:\n␀CODE␀Embedded Linux image components:\n\n  Toolchain → gcc + glibc/musl/uclibc for target arch\n  builds everything else\n\n  Bootloader → U-Boot binary\n  initialized by BootROM, loads kernel\n\n  Kernel  → Linux vmlinuz or zImage\n  compressed, decompresses itself at boot\n\n  DTB  → Device Tree Blob (.dtb)\n  hardware description passed to kernel by bootloader\n\n  rootfs  → root filesystem image (ext4, squashfs, ubifs, cramfs)\n  contains: BusyBox (sh, ls, mount...), libraries, apps, /etc, /dev\n\n  Optional:\n  initramfs → small root filesystem baked into kernel or separate\n  used for early boot or minimal recovery systems␀ENDCODE␀'},{h:'Theory: BusyBox',b:'BusyBox is a single binary that provides a minimal implementation of dozens of Unix utilities (sh, ls, cat, mount, ifconfig, etc.). It is the standard shell and tool provider in most embedded Linux root filesystems.\n␀CODE␀/bin/busybox -> symlinked as /bin/sh, /bin/ls, /bin/cat, etc.\nEach symlink invokes BusyBox with a different argv[0] → different behavior␀ENDCODE␀'},{h:'Interview Questions — Buildroot and Yocto',b:'**Q: What is Buildroot?**\n\nBuildroot is a Makefile-based build system that generates a complete embedded Linux system — toolchain, bootloader, kernel, and root filesystem — for a target hardware platform. It is simple to use and good for prototyping or single-board products.\n\n**Q: What is Yocto?**\n\nYocto is a set of tools and metadata for creating custom embedded Linux distributions. It uses BitBake as the build engine and organizes packages into layers. It is the industry standard for commercial embedded Linux products because of its scalability and reproducibility.\n\n**Q: What is BusyBox?**\n\nBusyBox is a single binary that provides minimal implementations of dozens of Unix utilities. It is the standard tool provider in embedded Linux root filesystems because it occupies far less space than full GNU tools.\n\n**Q: What is the relationship between kernel, DTB, and rootfs?**\n\nThe bootloader loads the kernel image and DTB into memory and passes the DTB address to the kernel at boot. The kernel uses the DTB to discover hardware. After kernel initialization, it mounts the rootfs and launches the init process. All three must be compatible — a kernel and DTB mismatch causes boot failures.\n\n**Q: What is initramfs?**\n\ninitramfs is a small root filesystem embedded in or loaded alongside the kernel image. The kernel mounts it as an initial root filesystem during boot to perform early setup before switching to the real root filesystem.'},{h:'Overview',b:'Today is entirely practical. Work through each scenario systematically. The goal is to build confident debugging instincts — not memorize answers.'},{h:'Scenario 1: Module Does Not Load',b:'**Symptoms:** `insmod` or `modprobe` fails immediately.\n\n**Debug flow:**\n␀CODE␀1. Run insmod, capture output\n2. dmesg | tail -20  → first place to check\n3. Look for: vermagic mismatch  → built against wrong kernel headers\n  unresolved symbol  → missing kernel config or missing module_init\n  bad parameter  → wrong module_param type\n  init returned error  → bug in module_init()\n4. modinfo  → check vermagic, dependencies, parameters\n5. uname -r  → compare to kernel headers used\n6. ls /lib/modules/$(uname -r)/  → check headers are installed␀ENDCODE␀\n\n**Common cause:** Module compiled against different kernel version than running kernel.'},{h:'Scenario 2: Module Loads, But probe() Never Called',b:'**Symptoms:** `lsmod` shows the module, but device never initializes.\n\n**Debug flow:**\n␀CODE␀1. dmesg | grep  → any registration or matching messages?\n2. cat /sys/bus/platform/devices/  → list platform devices\n3. cat /sys/bus/i2c/devices/  → list I2C devices\n4. Check DT node:\n  - status =  okay ?\n  - compatible string exactly matches of_match_table?\n  - address/reg correct?\n5. ls /sys/bus/platform/drivers/  → is driver registered?\n6. Check that MODULE_DEVICE_TABLE is present␀ENDCODE␀\n\n**Common causes:**\n- `compatible` string typo (case-sensitive)\n- DT node has `status = "disabled"`\n- Driver registered on wrong bus type\n- Dependency causing `-EPROBE_DEFER`'},{h:'Scenario 3: probe() Called, But Fails',b:'**Symptoms:** `dmesg` shows probe called, then error returned.\n\n**Debug flow:**\n␀CODE␀1. dmesg | grep -i  probe\\|error\\|fail\\|defer \n2. Add pr_err() logs around each step in probe()\n3. Check: devm_kzalloc return  → -ENOMEM if out of memory\n  devm_ioremap_resource  → bad reg in DT?\n  platform_get_irq  → IRQ not in DT?\n  clk_get / regulator_get  → dependency not ready? → EPROBE_DEFER\n4. Return -EPROBE_DEFER if dependency not ready (not hard failure)␀ENDCODE␀\n\n**Common causes:**\n- Wrong DT `reg` property (address or size mismatch)\n- Dependency (clock, regulator, GPIO) not yet available — return `-EPROBE_DEFER`\n- Hardware initialization sequence incorrect'},{h:'Scenario 4: Device Node Not Created Under /dev',b:'**Symptoms:** Driver loads and probe succeeds, but `/dev/mydevice` is missing.\n\n**Debug flow:**\n␀CODE␀1. dmesg → did alloc_chrdev_region succeed?\n2. Check: alloc_chrdev_region return value\n  cdev_add return value\n  class_create return value\n  device_create return value\n3. ls /sys/class//  → class exists?\n4. ls /proc/devices  → character device registered?\n5. Check if udev/mdev is running  → device node created by userspace daemon␀ENDCODE␀\n\n**Note:** `device_create()` creates the sysfs entry. The device node in `/dev` is created by `udev` (or `mdev`) in response. If udev is not running, create the node manually: `mknod /dev/mydevice c <major> <minor>`.'},{h:'Scenario 5: read() Blocks Forever',b:'**Symptoms:** User application calling `read()` hangs and never returns.\n\n**Debug flow:**\n␀CODE␀1. strace ./app  → see which syscall is blocking\n2. cat /proc/\n/status  → check process state (S = sleeping)\n3. In driver: add pr_debug() at:\n  - entry to read()\n  - before wait_event_interruptible()\n  - after wakeup\n  - in the write path or interrupt handler (who wakes the reader?)\n4. Is the wakeup condition ever set? Check the producer path.\n5. Is wake_up_interruptible() called after setting the flag?\n6. Check: flag set and wake_up called while holding the wrong lock?\n  wake_up called before wait_event — race condition?␀ENDCODE␀\n**Common cause:** The flag that signals data-ready is never set, or `wake_up_interruptible()` is never called.'},{h:'Scenario 6: IRQ Not Firing',b:'**Symptoms:** Interrupt-driven code never executes the handler.\n\n**Debug flow:**\n␀CODE␀1. cat /proc/interrupts  → does the IRQ line appear?\n  is the count incrementing?\n2. request_irq/request_threaded_irq return value → 0 means success\n3. dmesg →  irq request failed ?\n4. Check DT: interrupts property correct?\n  interrupt-parent pointing to right controller?\n  trigger type matches hardware (edge vs level, polarity)?\n5. Is hardware interrupt generation actually enabled?\n  (check device register that enables the IRQ line)\n6. pinctrl: is the IRQ pin configured as an input?␀ENDCODE␀\n\n**Common cause:** Hardware must be configured to generate the interrupt, not just the driver. The device register that enables interrupt output is often overlooked.'},{h:'Scenario 7: I2C Communication Fails',b:'**Symptoms:** `i2c_smbus_read_*` or `i2c_smbus_write_*` returns negative error code.\n\n**Debug flow:**\n␀CODE␀1. i2cdetect -y  → does device ACK at expected address?\n2. dmesg | grep i2c  → timeout or NACK messages?\n3. Check:\n  - correct bus number in DT?\n  - correct I2C address in DT?\n  - physical pull-up resistors on SDA/SCL? (if real hardware)\n  - device powered and reset deasserted?\n4. i2cget -y  → manual register read test\n5. i2cdump -y  → dump all registers\n6. Check endianness: i2c_smbus_read_word_data returns little-endian,\n  but many sensors send big-endian — use swab16() if needed␀ENDCODE␀\n\n**Common cause:** Wrong bus number, wrong address, missing pull-ups on real hardware, or register access pattern mismatch (8-bit vs 16-bit register addresses).'},{h:'Must-Know Debug Commands — Reference Card',b:'␀CODE␀# Module loading\ndmesg | tail -30  # Check for load errors\nlsmod | grep  # Is module loaded?\nmodinfo  # Check vermagic and deps\nmodprobe --show-depends  # Show dependency chain\n\n# Device and driver binding\nls /sys/bus/platform/devices/  # Platform devices\nls /sys/bus/i2c/devices/  # I2C devices\nls /sys/bus/platform/drivers/  # Registered platform drivers\ncat /sys/bus/platform/drivers//uevent  # Driver info\nls /sys/bus/platform/devices//driver  # Is device bound?\n\n# Character devices\ncat /proc/devices  # Major number allocation\nls /sys/class//  # Class devices\n\n# Interrupts\ncat /proc/interrupts  # IRQ list and counts\ncat /proc/irq//spurious  # Spurious IRQ stats\n\n# Runtime\nstrace -e read,write,ioctl ./app  # Trace syscalls\ncat /proc//status  # Process state␀ENDCODE␀'},{h:'Your Three Projects',b:'By this point you should have working code for all three. If any project is incomplete, today is the day to finish it.\nProject 1: Character Device Driver\n\n**One-line description:**\n\n Multi-instance character device driver with IOCTL interface, blocking read via wait queue, non-blocking mode support, and sysfs attributes. \n\n**Architecture walkthrough (2 minutes):**\n\n I built a character device driver that exposes `/dev/chardevN` nodes. The driver uses `alloc_chrdev_region` to get a range of device numbers, and `container_of` in the `open` callback to recover per-device state from the `cdev` embedded in my device struct. Read and write use `copy_to_user` / `copy_from_user` for safe kernel-user transfer. For blocking read, if no data is available the reader sleeps on a wait queue using `wait_event_interruptible`, and wakes up when data is written. I added two IOCTL commands using `_IOR` and `_IOW` macros. A mutex protects the internal buffer. I tested it with a userspace application using both blocking and O_NONBLOCK modes. \n\n**Key design decisions:**\n- `container_of` for multi-instance: each file open recovers its own `struct my_dev` from the embedded `cdev`\n- `wait_event_interruptible` so the reader can be interrupted by signals\n- `mutex_lock_interruptible` so open/read/write are cancellable\n- `devm_*` APIs to simplify cleanup\n\n**One debugging story:**\n\n When I first implemented the wait queue, read() returned immediately even when the buffer was empty. I had the condition check inverted — I was waking up when the buffer was empty instead of when it had data. I added pr_debug() inside the wait condition and saw it evaluating wrong. One-line fix: `wait_event_interruptible(wq, buffer_len > 0)` instead of `== 0`. \n\nProject 2: Platform Driver / Device Tree Demo\n\n**One-line description:**\n\n Platform driver with DT matching, MMIO register access, IRQ handling, and devm resource management. \n\n**Architecture walkthrough (2 minutes):**\n\n I wrote a platform driver that matches via a DT compatible string. In probe(), I use `devm_platform_ioremap_resource()` to map the MMIO register range and `platform_get_irq()` to get the interrupt number. I request a threaded IRQ using `request_threaded_irq` so the heavy IRQ handling happens in a schedulable thread. The `of_property_read_u32()` API reads configuration from the DT node. All resources use `devm_*` APIs so cleanup is automatic on driver unload or probe failure. \n\n**Key design decisions:**\n- `devm_*` APIs eliminate manual cleanup paths\n- Threaded IRQ: top half acknowledges interrupt only, bottom thread handles data\n- `-EPROBE_DEFER` returned if clock or GPIO dependency is not ready\nProject 3: I2C Sensor Driver\n\n**One-line description:**\n\n I2C temperature sensor driver with DT matching, register I/O via SMBus, hwmon subsystem integration, and 1-second value caching. \n\n**Architecture walkthrough (2 minutes):**\n\n I wrote an I2C driver for a TMP102-style temperature sensor. The DT node carries the compatible string and I2C address; the kernel matches this to my driver and calls probe(). I use `i2c_smbus_read_word_swapped()` to read the temperature register since the sensor sends big-endian 16-bit data. I cache the last reading for 1 second to avoid flooding the I2C bus on repeated sysfs reads. The driver registers with the hwmon subsystem using `devm_hwmon_device_register_with_info()`, exposing the temperature through `/sys/class/hwmon/hwmonN/temp1_input` in millidegrees Celsius. \n\n**One debugging story:**\n\n Temperature readings were always off by a factor of 16. After looking at the datasheet more carefully, I realized the sensor returns the raw ADC value left-shifted by 4 — I was missing a right-shift by 4 before scaling. `pr_debug("raw=0x%04x\\n", raw_val)` showed me `0x0c80` when the temperature should have been `0xc8` — the extra nibble at the bottom was the problem.'},{h:'GitHub Cleanup Checklist',b:'␀CODE␀For each project:\n[ ] Code compiles with no warnings\n[ ] README.md with:\n  - What the driver does (one paragraph)\n  - Files in the project\n  - Build instructions\n  - How to load and test\n  - Architecture description\n[ ] Code is well-commented where non-obvious\n[ ] No debug printk left at pr_err or pr_warn level (use pr_debug)\n[ ] .gitignore covers: *.ko, *.o, *.mod.c, Module.symvers, modules.order\n[ ] Commit messages are meaningful (not  fix  or  update )␀ENDCODE␀'},{h:'Resume Bullet Points',b:'Write your resume lines around what you actually built:\n␀CODE␀Embedded Systems / Linux Kernel:\n  - Developed a multi-instance character device driver supporting\n  concurrent open(), read(), write(), and ioctl() operations with\n  wait queue-based blocking I/O and mutex-protected shared state\n  - Implemented a platform driver using device tree matching and\n  devm-managed resource acquisition (MMIO, IRQ, GPIO)\n  - Built an I2C temperature sensor driver integrated with the Linux\n  hwmon subsystem, exposing sensor data through standard sysfs\n  attributes using SMBus register access\n\nTechnical Skills:\n  - Linux kernel module development, character device drivers,\n  platform and I2C driver frameworks\n  - Device Tree authoring and compatible-string matching\n  - Kernel synchronization: mutex, spinlock, wait queues\n  - Debugging: dmesg, /proc/interrupts, /sys, strace, ftrace basics\n  - Cross-compilation, kernel/module/DTB build workflow␀ENDCODE␀'},{h:'How to Run Your Mock Interview',b:'Do this with a friend, or record yourself and watch it back. Time each answer. Aim for 20-second short answers and 60-second full answers.'},{h:'Rapid-Fire Round — C and Linux Basics',b:'Practice answering these in under 30 seconds each:\n␀CODE␀1. What is the difference between stack and heap?\n2. What does volatile do and why is it not a lock?\n3. What is structure padding and why does it happen?\n4. What is a function pointer? Where do drivers use them?\n5. What is the difference between user space and kernel space?\n6. What is a system call?\n7. What is the difference between a process and a thread?\n8. What does fork() do? What is copy-on-write?\n9. What is the difference between mmap() and ioremap()?\n10. Describe the embedded Linux boot flow.␀ENDCODE␀'},{h:'Driver Knowledge Round — 60-second Answers',b:'␀CODE␀1. What is a kernel module? What is the difference between built-in and loadable?\n2. What is the difference between kmalloc() and vmalloc()?\n3. What is GFP_KERNEL vs GFP_ATOMIC and when do you use each?\n4. Why does kernel code use goto for cleanup?\n5. What are major and minor device numbers?\n6. What is file_operations and why does it use function pointers?\n7. Why do drivers use copy_to_user() and copy_from_user()?\n8. What is ioctl() and when would you use it over a sysfs attribute?\n9. How does a blocking read() work in a driver?\n10. How does .poll() relate to select() and epoll() in user space?␀ENDCODE␀'},{h:'Device Tree and Platform Driver Round',b:'␀CODE␀1. Why does Device Tree exist?\n2. What is a compatible string and how does driver matching work?\n3. What is the reg property used for?\n4. What does a platform driver\'s probe() function typically do?\n5. What is -EPROBE_DEFER and when should you return it?␀ENDCODE␀'},{h:'I2C and Debugging Round',b:'␀CODE␀1. What is the difference between I2C and SPI?\n2. Describe the Linux I2C model: adapter, client, driver.\n3. Why is hwmon integration better than a custom character device for a sensor?\n4. Your module loaded but probe() was never called. What do you check?\n5. read() in your driver blocks forever. How do you debug it?\n6. An interrupt is registered but never fires. What do you check?␀ENDCODE␀'},{h:'Synchronization Round',b:'␀CODE␀1. What is the difference between a mutex and a spinlock?\n2. Why can\'t you use a mutex in interrupt context?\n3. What is process context vs atomic context?\n4. What is a wait queue and when do you use it?\n5. When would you use spin_lock_irqsave() instead of spin_lock()?␀ENDCODE␀'},{h:'Project Walkthrough Round',b:'Pick one project and explain it in 2 minutes without stopping:\n- Architecture\n- How user space or hardware interacts with it\n- Synchronization used\n- One real bug you debugged\n- What you would improve'},{h:'OPTIONAL BONUS: THREAD POOL PROJECT',b:'The thread pool project is not required for fresher embedded Linux roles. It is included here as an optional exercise for candidates who have extra time and want to demonstrate broader systems programming skills.\n\nFor most embedded Linux interviews, your three driver projects (character driver, platform driver, I2C driver) are the right focus. Interviewers care more about whether you understand kernel-driver basics and can debug logically than whether you built a userspace thread pool.\n\nIf you want to build the thread pool, the complete implementation (header, implementation, test application, Makefile) is available for reference. The key concepts it demonstrates are:\n\n• Producer-consumer pattern with condition variables\n\n• Spurious wakeup handling with while-loop conditions\n\n• Graceful shutdown with broadcast to all workers\n\n• Two condition variables: `not_empty` for workers, `all_done` for `pool_wait()`\n\nThese concepts translate directly to kernel concepts: wait queues replace condition variables, workqueues replace worker threads, and kernel synchronization patterns follow the same producer-consumer logic.'},{h:'FINAL ADVICE',b:'Do not try to master everything equally.\n\nFor fresher embedded Linux interviews, the strongest signal is:\n\n• You built working code\n\n• You understand kernel-driver basics\n\n• You can debug logically\n\n• You know how concurrency affects drivers\n\n• You can explain your projects clearly\n\nThree projects you can explain in depth beat ten projects you cannot discuss.\n\n  \n  \n  ← PreviousPhase 6: I2C Project\nNext →Appendix: Interview Bank\n  \n  \n  \n\n  \n  ↑'}]},
{id:'k',sec:'kint',icon:'🔬',title:'Kernel Internals Deep Dive',secs:[{h:'Address Translation',b:'␀CODE␀User Process View:\n  Virtual Address 0x00007FFF_12345678\n\n  ┌─────────┬─────────┬─────────┬─────────┬──────────┐\n  │  PGD  │  PUD  │  PMD  │  PTE  │  Offset  │\n  │ (9 bits)│ (9 bits)│ (9 bits)│ (9 bits)│ (12 bits)│\n  └────┬────┴────┬────┴────┬────┴────┬────┴─────┬────┘\n  │  │  │  │  │\n  ▼  ▼  ▼  ▼  │\n  ┌────────┐ ┌────────┐ ┌────────┐ ┌────────┐  │\n  │ Page  │→│ Page  │→│ Page  │→│ Page  │  │\n  │ Global │ │ Upper  │ │ Middle │ │ Table  │  │\n  │ Dir.  │ │ Dir.  │ │ Dir.  │ │ Entry  │  │\n  └────────┘ └────────┘ └────────┘ └───┬────┘  │\n  │  │\n  ▼  │\n  Physical Page ────┤\n  Frame Address  + Offset\n  │\n  ▼\n  Physical Address 0x0000_1234_5678\n\nTLB (Translation Lookaside Buffer):\n  Cache of recent translations. Hit → 1 cycle. Miss → page table walk.\n  Context switch → TLB flush (expensive!) unless using ASID.␀ENDCODE␀'},{h:'Page Fault Handling',b:'␀CODE␀Types of page faults:\n1. MINOR fault: Page exists but not in memory\n  → Allocate physical frame, fill from backing store, update PTE\n  → Example: first access to mmap\'d file page\n\n2. MAJOR fault: Page must be fetched from disk\n  → Read from swap or file, very expensive (~10ms)\n  → Example: swapped-out page\n\n3. INVALID fault: Accessing unmapped address\n  → SIGSEGV → process killed\n  → In kernel: oops/panic\n\n4. PROTECTION fault: Writing to read-only page\n  → If COW: copy page, make writable (minor fault)\n  → If truly read-only: SIGSEGV␀ENDCODE␀'},{h:'Why This Matters for Driver Development',b:'␀CODE␀1. copy_to_user() may trigger page fault\n  → User page might be swapped out\n  → That\'s OK — kernel handles it transparently\n  → But can\'t call copy_to_user from ISR (can\'t sleep to handle fault!)\n\n2. mmap() in your driver\n  → You set up virtual → physical mapping for device registers\n  → User accesses device through normal memory operations\n\n3. DMA considerations\n  → Physical addresses for DMA ≠ virtual addresses\n  → Pages might not be physically contiguous\n  → Use DMA API for proper address translation␀ENDCODE␀'},{h:'The Completely Fair Scheduler (CFS)',b:'␀CODE␀CFS uses a red-black tree ordered by  virtual runtime  (vruntime):\n\n  Tasks sorted by vruntime:\n\n  ┌───────────────────────┐\n  │  RB-Tree Root  │\n  └───────────┬───────────┘\n  │\n  ┌──────┴──────┐\n  │  │\n  ┌────┴───┐  ┌───┴────┐\n  │Task A  │  │Task C  │\n  │vrt=100 │  │vrt=300 │\n  └────┬───┘  └───┬────┘\n  │  │\n  ┌────┴───┐  ┌───┴────┐\n  │Task B  │  │Task D  │\n  │vrt=200 │  │vrt=400 │  ← Highest vruntime\n  └────────┘  └────────┘\n\n  Leftmost node (lowest vruntime) runs next.\n  When task runs, its vruntime increases.\n  Nice value affects rate of vruntime increase:\n  Nice -20 (high priority): vruntime increases slowly → runs more\n  Nice +19 (low priority): vruntime increases fast → runs less\n\n  Result: all tasks tend toward equal CPU time.␀ENDCODE␀'},{h:'Real-Time Scheduling Classes',b:'␀CODE␀Priority levels (lower number = higher priority):\n\n  SCHED_DEADLINE  ─── Earliest Deadline First (highest)\n  SCHED_FIFO  ─── First In, First Out (real-time)\n  SCHED_RR  ─── Round Robin (real-time)\n  SCHED_NORMAL  ─── CFS (default for user processes)\n  SCHED_BATCH  ─── CFS, optimized for throughput\n  SCHED_IDLE  ─── Only when system is idle (lowest)\n\nFor embedded RT:\n  - Critical tasks: SCHED_FIFO with high priority\n  - Kernel thread priority: set via kthread API\n  - PREEMPT_RT: makes most kernel code preemptible␀ENDCODE␀'},{h:'Interrupt Flow',b:'␀CODE␀Hardware Interrupt Occurs (e.g., I2C transfer complete)\n  │\n  ▼\n1. CPU saves context, switches to interrupt stack\n2. Interrupt controller identifies IRQ number\n3. Kernel calls registered handler (your top half)\n  │\n  ▼\n┌──────────────────────────────────────────────────────┐\n│  TOP HALF (Hard IRQ Handler)  │\n│  - Runs with interrupts disabled on this CPU  │\n│  - MUST be fast! (< 1μs ideally)  │\n│  - Can: read HW status, ack interrupt, set flags  │\n│  - Can: spin_lock (not _irqsave — already in IRQ)  │\n│  - CANNOT: sleep, mutex, kmalloc(GFP_KERNEL), I2C  │\n│  - Schedule bottom half if needed  │\n│  - Return IRQ_HANDLED or IRQ_WAKE_THREAD  │\n└──────────────────────┬───────────────────────────────┘\n  │\n  ▼\n┌──────────────────────────────────────────────────────┐\n│  BOTTOM HALF (choose one):  │\n│  │\n│  SOFTIRQ (lowest latency)  │\n│  - Pre-defined, used by networking, block I/O  │\n│  - Cannot sleep  │\n│  │\n│  TASKLET (obsolescent)  │\n│  - Built on softirq  │\n│  - Cannot sleep, serialized per-CPU  │\n│  │\n│  WORKQUEUE (most flexible) ← RECOMMENDED  │\n│  - Runs in kernel thread  │\n│  - CAN sleep, CAN use mutex, CAN do I2C/SPI  │\n│  - schedule_work(&my_work)  │\n│  │\n│  THREADED IRQ (modern preferred) ← BEST FOR DRIVERS  │\n│  - request_threaded_irq(irq, hard, thread, ...)  │\n│  - Hard handler: quick ack → IRQ_WAKE_THREAD  │\n│  - Thread handler: full processing, CAN sleep  │\n│  - Dedicated kernel thread per IRQ  │\n└──────────────────────────────────────────────────────┘␀ENDCODE␀'},{h:'Threaded IRQ Example',b:'␀CODE␀/* Modern interrupt handling — preferred in new drivers */\n\nstatic irqreturn_t sensor_hard_irq(int irq, void *dev_id)\n{\n  struct my_device *dev = dev_id;\n  uint32_t status;\n\n  /* Quick: read status register */\n  status = readl(dev->regs + STATUS_REG);\n\n  if (!(status & INT_PENDING))\n  return IRQ_NONE;  /* Not our interrupt */\n\n  /* Acknowledge interrupt in hardware */\n  writel(status, dev->regs + STATUS_REG);\n\n  /* Store status for thread handler */\n  dev->irq_status = status;\n\n  return IRQ_WAKE_THREAD;  /* Schedule threaded handler */\n}\n\nstatic irqreturn_t sensor_thread_handler(int irq, void *dev_id)\n{\n  struct my_device *dev = dev_id;\n\n  /* This runs in process context — CAN sleep! */\n  mutex_lock(&dev->lock);\n\n  /* Read data via I2C (would block in hard IRQ!) */\n  dev->last_reading = i2c_smbus_read_word_data(dev->client, DATA_REG);\n\n  /* Wake userspace */\n  dev->data_ready = true;\n  wake_up_interruptible(&dev->wait_queue);\n\n  mutex_unlock(&dev->lock);\n  return IRQ_HANDLED;\n}\n\n/* In probe: */\ndevm_request_threaded_irq(dev, irq,\n  sensor_hard_irq,  /* Top half */\n  sensor_thread_handler,  /* Bottom half (threaded) */\n  IRQF_ONESHOT,  /* Don\'t re-enable IRQ until thread finishes */\n  my-sensor , data);␀ENDCODE␀'},{h:'Runtime PM (for drivers)',b:'␀CODE␀/* In probe: */\npm_runtime_enable(dev);\npm_runtime_set_active(dev);\n\n/* Before accessing hardware: */\npm_runtime_get_sync(dev);  // Wakes device\n/* ... access hardware ... */\npm_runtime_put(dev);  // Marks idle, may power down\n\n/* Callbacks in driver: */\nstatic int my_runtime_suspend(struct device *dev) {\n  /* Power down hardware */\n  return 0;\n}\n\nstatic int my_runtime_resume(struct device *dev) {\n  /* Power up, re-initialize */\n  return 0;\n}\n\nstatic const struct dev_pm_ops my_pm_ops = {\n  SET_RUNTIME_PM_OPS(my_runtime_suspend, my_runtime_resume, NULL)\n};␀ENDCODE␀'},{h:'KERNEL DEBUGGING TOOLS REFERENCE',b:'Tool\nPurpose\nContext\n\n `printk/pr_info` |\n Print messages to dmesg |\n Kernel |\n\n `dev_info/dev_err` |\n Print with device prefix |\n Drivers |\n\n `dmesg -w` |\n Watch kernel log in real-time |\n Userspace |\n\n `strace` |\n Trace syscalls |\n Userspace |\n\n `ftrace` |\n Trace kernel functions |\n Kernel |\n\n `perf` |\n Performance profiling |\n Both |\n\n `gdb + KGDB` |\n Interactive kernel debugging |\n Kernel |\n\n `KASAN` |\n Memory error detection |\n Kernel config |\n\n `KMEMLEAK` |\n Memory leak detection |\n Kernel config |\n\n `lockdep` |\n Lock ordering validation |\n Kernel config |\n\n `UBSAN` |\n Undefined behavior detection |\n Kernel config |\n\n `dynamic debug` |\n Runtime debug enable/disable |\n Kernel |\n\n `lsof` |\n List open files |\n Userspace |\n\n `ltrace` |\n Trace library calls |\n Userspace |'},{h:'Dynamic Debug (Enable dev_dbg at runtime)',b:'␀CODE␀# Enable all debug messages from your module:\necho \'module temp_sensor +p\' > /sys/kernel/debug/dynamic_debug/control\n\n# Enable debug for specific file:\necho \'file temp_sensor.c +p\' > /sys/kernel/debug/dynamic_debug/control\n\n# Enable debug for specific function:\necho \'func temp_sensor_probe +p\' > /sys/kernel/debug/dynamic_debug/control\n\n# Disable:\necho \'module temp_sensor -p\' > /sys/kernel/debug/dynamic_debug/control␀ENDCODE␀\n\n  \n  \n  ← PreviousAppendix: Interview Bank\nNext →Appendix: Debugging\n  \n  \n  \n\n  \n  ↑'}]},
{id:'d',sec:'dtool',icon:'🔧',title:'Debugging Toolkit',secs:[{h:'strace — System Call Tracer',b:'The **#1 tool** for understanding what a user-space program does:\n␀CODE␀# Trace all syscalls of a command\nstrace ls -la\n\n# Trace your test app\nstrace ./test_app\n\n# Focus on specific syscall types\nstrace -e trace=open,read,write,close ./test_app\nstrace -e trace=ioctl ./test_app\nstrace -e trace=memory ./test_app  # mmap, munmap, etc.\n\n# With timestamps\nstrace -t ./test_app  # HH:MM:SS\nstrace -T ./test_app  # Time spent in each syscall\n\n# Follow forked children\nstrace -f ./program_that_forks\n\n# Write output to file (useful for long traces)\nstrace -o trace.log ./test_app\n\n# Count and summarize syscalls\nstrace -c ./test_app␀ENDCODE␀\n\n**Example output analysis:**\n␀CODE␀open( /dev/chardev0 , O_RDWR) = 3  ← fd=3, success\nwrite(3,  Hello , 5) = 5  ← 5 bytes written, OK\nread(3,  Hello , 100) = 5  ← Read back 5 bytes\nioctl(3, 0xC0044301, 0x7ffe...) = 0  ← IOCTL success\nclose(3) = 0  ← Clean close\n\nwrite(3,  test , 4) = -1 EBADF  ← fd 3 already closed!\nopen( /dev/missing , O_RDWR) = -1 ENOENT ← Device doesn\'t exist␀ENDCODE␀'},{h:'GDB — The GNU Debugger',b:'␀CODE␀# Compile with debug info\ngcc -g -O0 -o test_app test_app.c\n\n# Start debugging\ngdb ./test_app\n\n# Essential GDB commands:\n(gdb) break main  # Breakpoint at main\n(gdb) break test_app.c:42  # Breakpoint at line 42\n(gdb) run  # Start program\n(gdb) next  # Step over (execute line, don\'t enter functions)\n(gdb) step  # Step into function\n(gdb) print variable  # Print variable value\n(gdb) print *ptr  # Dereference pointer\n(gdb) print sizeof(struct my_struct)\n(gdb) x/16xb ptr  # Examine memory: 16 bytes, hex\n(gdb) bt  # Backtrace (call stack)\n(gdb) info threads  # List threads\n(gdb) thread 2  # Switch to thread 2\n(gdb) watch variable  # Break when variable changes\n(gdb) continue  # Resume execution\n(gdb) quit␀ENDCODE␀'},{h:'Valgrind — Memory Error Detector',b:'␀CODE␀# Detect memory errors\nvalgrind --leak-check=full ./test_app\n\n# Common outputs:\n#  Invalid read of size 4  → Use-after-free or out-of-bounds\n#  Conditional jump depends on uninitialised value  → Using uninitialized memory\n#  definitely lost: 48 bytes  → Memory leak\n\n# Thread error detector\nvalgrind --tool=helgrind ./threaded_app\n# Detects: data races, lock ordering issues, mutex misuse␀ENDCODE␀'},{h:'Address Sanitizer (ASan) — Compile-Time Instrumentation',b:'␀CODE␀# Compile with ASan (better performance than valgrind)\ngcc -fsanitize=address -g -o test_app test_app.c\n\n# Detects:\n# - Buffer overflow (stack and heap)\n# - Use-after-free\n# - Double-free\n# - Memory leaks\n\n# Thread Sanitizer\ngcc -fsanitize=thread -g -o test_app test_app.c thread_pool.c -pthread\n# Detects: data races between threads␀ENDCODE␀'},{h:'dmesg — Kernel Message Buffer',b:'␀CODE␀# View kernel messages\ndmesg  # All messages\ndmesg | tail -20  # Last 20 lines\ndmesg -w  # Watch in real-time (like tail -f)\ndmesg --level=err  # Only errors\ndmesg -T  # Human-readable timestamps\ndmesg -c  # Read AND clear buffer\n\n# Filter by your module\ndmesg | grep my_module\n\n# Log levels (0=highest priority):\n# KERN_EMERG  (0) - System unusable\n# KERN_ALERT  (1) - Action required immediately\n# KERN_CRIT  (2) - Critical\n# KERN_ERR  (3) - Error\n# KERN_WARNING (4) - Warning\n# KERN_NOTICE  (5) - Normal but significant\n# KERN_INFO  (6) - Informational\n# KERN_DEBUG  (7) - Debug messages\n\n# Set console log level (show level 7 and above on console)\necho 7 > /proc/sys/kernel/printk␀ENDCODE␀'},{h:'Dynamic Debug (dev_dbg at runtime)',b:'␀CODE␀# Enable ALL debug messages from your module\necho \'module temp_sensor +p\' > /sys/kernel/debug/dynamic_debug/control\n\n# Enable for specific file\necho \'file chardev.c +p\' > /sys/kernel/debug/dynamic_debug/control\n\n# Enable for specific function\necho \'func chardev_read +p\' > /sys/kernel/debug/dynamic_debug/control\n\n# Add function name and line number to output\necho \'module temp_sensor +fpl\' > /sys/kernel/debug/dynamic_debug/control\n\n# List all available debug sites\ncat /sys/kernel/debug/dynamic_debug/control | grep temp_sensor\n\n# Disable\necho \'module temp_sensor -p\' > /sys/kernel/debug/dynamic_debug/control␀ENDCODE␀'},{h:'/proc and /sys Inspection',b:'␀CODE␀# ==== MODULE INFO ====\ncat /proc/modules  # All loaded modules\nlsmod  # Same, formatted\nmodinfo my_module.ko  # Module metadata\n\n# ==== DEVICE INFORMATION ====\ncat /proc/devices  # Major numbers and drivers\nls -la /dev/chardev*  # Device nodes\ncat /sys/class/chardev_class/chardev0/dev  # Major:minor\n\n# ==== DRIVER-DEVICE BINDING ====\nls /sys/bus/platform/drivers/mydevice/  # Platform driver\nls /sys/bus/i2c/drivers/temp_sensor/  # I2C driver\ncat /sys/bus/i2c/devices/1-0048/name  # I2C device name\n\n# ==== I2C DEBUGGING ====\ni2cdetect -l  # List I2C buses\ni2cdetect -y 1  # Scan bus 1\ni2cget -y 1 0x48 0x00 w  # Read register\ni2cset -y 1 0x48 0x01 0x6000 w  # Write register\ni2cdump -y 1 0x48  # Dump all registers\n\n# ==== MEMORY INFO ====\ncat /proc/meminfo  # System memory\ncat /proc/slabinfo  # Slab allocator stats\ncat /proc/buddyinfo  # Free page counts\n\n# ==== INTERRUPT INFO ====\ncat /proc/interrupts  # IRQ counts per CPU\nwatch -n1 \'cat /proc/interrupts | head -20\' # Watch interrupts\n\n# ==== GPIO DEBUGGING ====\ncat /sys/kernel/debug/gpio  # GPIO state (if debugfs mounted)␀ENDCODE␀'},{h:'ftrace — Kernel Function Tracer',b:'␀CODE␀# Mount debugfs if not mounted\nmount -t debugfs none /sys/kernel/debug\n\n# Trace function calls\ncd /sys/kernel/debug/tracing\n\n# List available tracers\ncat available_tracers\n\n# Trace kernel function graph (who calls what)\necho function_graph > current_tracer\necho 1 > tracing_on\n# ... trigger your driver ...\necho 0 > tracing_on\ncat trace\n\n# Trace only your module\'s functions\necho \':mod:my_module\' > set_ftrace_filter\necho function > current_tracer\necho 1 > tracing_on\ninsmod my_module.ko\necho 0 > tracing_on\ncat trace\n\n# Reset\necho nop > current_tracer\necho > set_ftrace_filter␀ENDCODE␀'},{h:'Kernel Oops — Reading Crash Outputs',b:'␀CODE␀When your module crashes, you\'ll see something like:\n\nBUG: unable to handle page fault at ffffffffc0000000\nOops: 0002 [#1] SMP\nCPU: 0 PID: 1234 Comm: test_app Tainted: G  OE  5.15.0\nRIP: 0010:chardev_write+0x42/0x100 [chardev]  ← CRASH LOCATION\nRSP: 0018:ffffc900001234\nRAX: 0000000000000000 RBX: ffff888012345678  ← Register dump\n...\nCall Trace:\n vfs_write+0xc5/0x200  ← Call stack\n ksys_write+0x5f/0xe0\n do_syscall_64+0x33/0x80\n entry_SYSCALL_64_after_hwframe+0x44/0xae\n\nHOW TO READ:\n1.  RIP: 0010:chardev_write+0x42/0x100 [chardev] \n  → Crashed in chardev_write(), 0x42 bytes into the function\n  → Module: [chardev]\n\n2. Find exact line:\n  $ addr2line -e chardev.ko 0x42\n  or\n  $ gdb chardev.ko\n  (gdb) list *(chardev_write+0x42)\n\n3.  page fault at ffffffffc0000000 \n  → NULL pointer dereference (or near-NULL)\n  → Check: did you initialize the pointer?\n\n4.  Oops: 0002  \n  → Bit 0: 0=no page found, 1=protection fault\n  → Bit 1: 0=read, 1=write (0002 = write to unmapped page)␀ENDCODE␀'},{h:'When Your Module Won t Load',b:'␀CODE␀PROBLEM: insmod returns -1\n\nCHECK:\n1. dmesg | tail  → See YOUR init function\'s error message\n2. Is it a dependency?  → modprobe (not insmod) resolves deps\n3. Version mismatch?  → modinfo my_module.ko | grep vermagic\n  uname -r\n  Must match!\n4. Missing symbol?  → dmesg:  Unknown symbol kmalloc_... \n  → Need kernel headers: apt install linux-headers-$(uname -r)␀ENDCODE␀'},{h:'When Your Driver Crashes',b:'␀CODE␀1. Enable debug: echo 8 > /proc/sys/kernel/printk\n2. Add pr_info at every stage of your function\n3. Check dmesg for the Oops\n4. Use addr2line to find exact line\n5. Common causes:\n  - NULL dereference → check all pointer returns\n  - copy_to_user with bad pointer → check user args\n  - Sleeping in atomic context → no mutex in IRQ\n  - Missing lock → race condition␀ENDCODE␀'},{h:'When I2C Communication Fails',b:'␀CODE␀1. Is the device present?\n  i2cdetect -y 1\n  → UU means driver bound, -- means not found\n\n2. Is the bus working?\n  ls /dev/i2c-*\n  If empty: I2C adapter driver not loaded\n\n3. Manual test:\n  i2cget -y 1 0x48 0x00  (read one byte)\n  Error? → Check wiring, pull-ups, address\n\n4. In your driver:\n  Add dev_info in probe for every i2c_smbus call result\n  Check return values!␀ENDCODE␀'},{h:'perf — The Swiss Army Knife',b:'␀CODE␀# Record CPU profile of your test\nsudo perf record -g ./test_app\nsudo perf report\n\n# System-wide profiling\nsudo perf top\n\n# Count cache misses\nsudo perf stat -e cache-misses ./test_app\n\n# Trace events\nsudo perf trace -e \'syscalls:sys_enter_ioctl\' ./test_app␀ENDCODE␀'},{h:'Kernel Config Options for Debugging',b:'␀CODE␀CONFIG_DEBUG_KERNEL=y  # Master debug switch\nCONFIG_KASAN=y  # Kernel Address Sanitizer\nCONFIG_KMEMLEAK=y  # Memory leak detector\nCONFIG_PROVE_LOCKING=y  # Lockdep: detect lock issues\nCONFIG_DEBUG_ATOMIC_SLEEP=y  # Detect sleeping in atomic\nCONFIG_DEBUG_INFO=y  # Debug symbols in vmlinux\nCONFIG_DYNAMIC_DEBUG=y  # Dynamic pr_debug/dev_dbg\nCONFIG_FTRACE=y  # Function tracing\n\n# Check current config:\ncat /boot/config-$(uname -r) | grep CONFIG_KASAN\n# or\nzcat /proc/config.gz | grep KASAN  # if available␀ENDCODE␀'},{h:'QUICK REFERENCE: What Tool When?',b:'Problem\nTool\nCommand\n\n  What syscalls does my app make?  |\n strace |\n `strace -e trace=ioctl ./app` |\n\n  Where does my app crash?  |\n GDB |\n `gdb ./app` then `run`, `bt` |\n\n  Memory leak in userspace?  |\n Valgrind |\n `valgrind --leak-check=full ./app` |\n\n  Data race in threads?  |\n TSan |\n `gcc -fsanitize=thread` |\n\n  Module won t load?  |\n dmesg |\n `dmesg \\| tail -10` |\n\n  Module crashes kernel?  |\n Oops + addr2line |\n Read dmesg Oops |\n\n  Driver doesn t probe?  |\n sysfs |\n `ls /sys/bus/*/drivers/mydrv/` |\n\n  I2C device not responding?  |\n i2cdetect |\n `i2cdetect -y 1` |\n\n  What functions are slow?  |\n ftrace/perf |\n `perf record -g` |\n\n  Lock ordering bug?  |\n lockdep |\n Enable CONFIG_PROVE_LOCKING |\n\n  Sleeping in atomic context?  |\n kernel warning |\n Enable CONFIG_DEBUG_ATOMIC_SLEEP |\n\n  \n  \n  ← PreviousAppendix: Kernel Internals\nNext →Appendix: Interview Practice\n  \n  \n  \n\n  \n  ↑'}]}];

function glist(){return curSec?Q.filter(q=>q.s===curSec):Q;}
function gi(q){return Q.indexOf(q);}

function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/_([^_]+)_/g,'<em>$1</em>');
}

function escTheory(s){
  // Handle code blocks first: \x00CODE\x00...\x00ENDCODE\x00
  // (stored as literal \x00 in the string)
  let out = '';
  const parts = s.split('\x00CODE\x00');
  for(let i=0;i<parts.length;i++){
    if(i===0){
      out += renderTheoryText(parts[i]);
    } else {
      const end = parts[i].indexOf('\x00ENDCODE\x00');
      if(end !== -1){
        const code = parts[i].slice(0,end);
        const rest = parts[i].slice(end+10); // '\x00ENDCODE\x00'.length=10
        out += '<pre class="t-codeblock">' + code.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>';
        out += renderTheoryText(rest);
      } else {
        out += renderTheoryText(parts[i]);
      }
    }
  }
  return out;
}

function renderTheoryText(s){
  // Handle inline code
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Bold
  s = s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  // Bullets
  s = s.replace(/^• (.+)$/gm,'<li>$1</li>');
  // Paragraphs (double newline)
  const paras = s.split('\n\n');
  let html = '';
  let inList = false;
  for(let para of paras){
    para = para.trim();
    if(!para) continue;
    if(para.includes('<li>')){
      html += '<ul>' + para + '</ul>';
    } else {
      html += '<p>' + para.replace(/\n/g,'<br>') + '</p>';
    }
  }
  return html;
}
